e lhe ponham realmente um limite e o contenham dentro dum lúcido domínio de si."}, {"h": "2. A globalização do paradigma tecnocrático", "lvl": 1}, {"n": 106, "t": "Mas o problema fundamental é outro e ainda mais profundo: o modo como realmente a humanidade assumiu a tecnologia e o seu desenvolvimento juntamente com um paradigma homogéneo e unidimensional. Neste paradigma, sobressai uma concepção do sujeito que progressivamente, no processo lógico-racional, compreende e assim se apropria do objecto que se encontra fora. Um tal sujeito desenvolve-se ao estabelecer o método científico com a sua experimentação, que já é explicitamente uma técnica de posse, domínio e transformação. É como se o sujeito tivesse à sua frente a realidade informe totalmente disponível para a manipulação. Sempre se verificou a intervenção do ser humano sobre a natureza, mas durante muito tempo teve a característica de acompanhar, secundar as possibilidades oferecidas pelas próprias coisas; tratava-se de receber o que a realidade natural por si permitia, como que estendendo a mão. Mas, agora, o que interessa é extrair o máximo possível das coisas por imposição da mão humana, que tende a ignorar ou esquecer a realidade própria do que tem à sua frente. Por isso, o ser humano e as coisas deixaram de se dar amigavelmente a mão, tornando-se contendentes. Daqui passa-se facilmente à ideia dum crescimento infinito ou ilimitado, que tanto entusiasmou os economistas, os teóricos da finança e da tecnologia. Isto supõe a mentira da disponibilidade infinita dos bens do planeta, que leva a «espremê-lo» até ao limite e para além do mesmo. Trata-se do falso pressuposto de que «existe uma quantidade ilimitada de energia e de recursos a serem utilizados, que a sua regeneração é possível de imediato e que os efeitos negativos das manipulações da ordem natural podem ser facilmente absorvidos».[86]"}, {"n": 107, "t": "Assim podemos afirmar que, na origem de muitas dificuldades do mundo actual, está principalmente a tendência, nem sempre consciente, de elaborar a metodologia e os objectivos da tecnociência segundo um paradigma de compreensão que condiciona a vida das pessoas e o funcionamento da sociedade. Os efeitos da aplicação deste modelo a toda a realidade, humana e social, constatam-se na degradação do meio ambiente, mas isto é apenas um sinal do reducionismo que afecta a vida humana e a sociedade em todas as suas dimensões. É preciso reconhecer que os produtos da técnica não são neutros, porque criam uma trama que acaba por condicionar os estilos de vida e orientam as possibilidades sociais na linha dos interesses de determinados grupos de poder. Certas opções, que parecem puramente instrumentais, na realidade são opções sobre o tipo de vida social que se pretende desenvolver."}, {"n": 108, "t": "Não se consegue pensar que seja possível sustentar outro paradigma cultural e servir-se da técnica como mero instrumento, porque hoje o paradigma tecnocrático tornou-se tão dominante que é muito difícil prescindir dos seus recursos, e mais difícil ainda é utilizar os seus recursos sem ser dominados pela sua lógica. Tornou-se anticultural a escolha dum estilo de vida, cujos objectivos possam ser, pelo menos em parte, independentes da técnica, dos seus custos e do seu poder globalizante e massificador. Com efeito, a técnica tem tendência a fazer com que nada fique fora da sua lógica férrea, e «o homem que é o seu protagonista sabe que, em última análise, não se trata de utilidade nem de bem-estar, mas de domínio; domínio no sentido extremo da palavra».[87] Por isso, «procura controlar os elementos da natureza e, conjuntamente, os da existência humana».[88] Reduzem-se assim a capacidade de decisão, a liberdade mais genuína e o espaço para a criatividade alternativa dos indivíduos."}, {"n": 109, "t": "O paradigma tecnocrático tende a exercer o seu domínio também sobre a economia e a política. A economia assume todo o desenvolvimento tecnológico em função do lucro, sem prestar atenção a eventuais consequências negativas para o ser humano. A finança sufoca a economia real. Não se aprendeu a lição da crise financeira mundial e, muito lentamente, se aprende a lição do deterioramento ambiental. Nalguns círculos, defende-se que a economia actual e a tecnologia resolverão todos os problemas ambientais, do mesmo modo que se afirma, com linguagens não académicas, que os problemas da fome e da miséria no mundo serão resolvidos simplesmente com o crescimento do mercado. Não é uma questão de teorias económicas, que hoje talvez já ninguém se atreva a defender, mas da sua instalação no desenvolvimento concreto da economia. Aqueles que não o afirmam em palavras defendem-no com os factos, quando parece não preocupar-se com o justo nível da produção, uma melhor distribuição da riqueza, um cuidado responsável do meio ambiente ou os direitos das gerações futuras. Com os seus comportamentos, afirmam que é suficiente o objectivo da maximização dos ganhos. Mas o mercado, por si mesmo, não garante o desenvolvimento humano integral nem a inclusão social.[89] Entretanto temos um «superdesenvolvimento dissipador e consumista que contrasta, de modo inadmissível, com perduráveis situações de miséria desumanizadora»,[90] mas não se criam, de forma suficientemente rápida, instituições económicas e programas sociais que permitam aos mais pobres terem regularmente acesso aos recursos básicos. Não temos suficiente consciência de quais sejam as raízes mais profundas dos desequilíbrios actuais: estes têm a ver com a orientação, os fins, o sentido e o contexto social do crescimento tecnológico e económico."}, {"n": 110, "t": "A especialização própria da tecnologia comporta grande dificuldade para se conseguir um olhar de conjunto. A fragmentação do saber realiza a sua função no momento de se obter aplicações concretas, mas frequentemente leva a perder o sentido da totalidade, das relações que existem entre as coisas, do horizonte alargado: um sentido, que se torna irrelevante. Isto impede de individuar caminhos adequados para resolver os problemas mais complexos do mundo actual, sobretudo os do meio ambiente e dos pobres, que não se podem enfrentar a partir duma única perspectiva nem dum único tipo de interesses. Uma ciência, que pretenda oferecer soluções para os grandes problemas, deveria necessariamente ter em conta tudo o que o conhecimento gerou nas outras áreas do saber, incluindo a filosofia e a ética social. Mas este é actualmente um procedimento difícil de seguir. Por isso também não se consegue reconhecer verdadeiros horizontes éticos de referência. A vida passa a ser uma rendição às circunstâncias condicionadas pela técnica, entendida como o recurso principal para interpretar a existência. Na realidade concreta que nos interpela, aparecem vários sintomas que mostram o erro, tais como a degradação ambiental, a ansiedade, a perda do sentido da vida e da convivência social. Assim se demonstra uma vez mais que «a realidade é superior à ideia».[91]"}, {"n": 111, "t": "A cultura ecológica não se pode reduzir a uma série de respostas urgentes e parciais para os problemas que vão surgindo à volta da degradação ambiental, do esgotamento das reservas naturais e da poluição. Deveria ser um olhar diferente, um pensamento, uma política, um programa educativo, um estilo de vida e uma espiritualidade que oponham resistência ao avanço do paradigma tecnocrático. Caso contrário, até as melhores iniciativas ecologistas podem acabar bloqueadas na mesma lógica globalizada. Buscar apenas um remédio técnico para cada problema ambiental que aparece, é isolar coisas que, na realidade, estão interligadas e esconder os problemas verdadeiros e mais profundos do sistema mundial."}, {"n": 112, "t": "Todavia é possível voltar a ampliar o olhar, e a liberdade humana é capaz de limitar a técnica, orientá-la e colocá-la ao serviço doutro tipo de progresso, mais saudável, mais humano, mais social, mais integral. De facto verifica-se a libertação do paradigma tecnocrático nalgumas ocasiões. Por exemplo, quando comunidades de pequenos produtores optam por sistemas de produção menos poluentes, defendendo um modelo não-consumista de vida, alegria e convivência. Ou quando a técnica tem em vista prioritariamente resolver os problemas concretos dos outros, com o compromisso de os ajudar a viver com mais dignidade e menor sofrimento. E ainda quando a busca criadora do belo e a sua contemplação conseguem superar o poder objectivador numa espécie de salvação que acontece na beleza e na pessoa que a contempla. A humanidade autêntica, que convida a uma nova síntese, parece habitar no meio da civilização tecnológica de forma quase imperceptível, como a neblina que filtra por baixo da porta fechada. Será uma promessa permanente que, apesar de tudo, desabrocha como uma obstinada resistência daquilo que é autêntico?"}, {"n": 113, "t": "Além disso, as pessoas parecem já não acreditar num futuro feliz nem confiam cegamente num amanhã melhor a partir das condições actuais do mundo e das capacidades técnicas. Tomam consciência de que o progresso da ciência e da técnica não equivale ao progresso da humanidade e da história, e vislumbram que os caminhos fundamentais para um futuro feliz são outros. Apesar disso, também não se imaginam renunciando às possibilidades que oferece a tecnologia. A humanidade mudou profundamente, e o avolumar-se de constantes novidades consagra uma fugacidade que nos arrasta à superfície numa única direcção. Torna-se difícil parar para recuperarmos a profundidade da vida. Se a arquitectura reflecte o espírito duma época, as mega-estruturas e as casas em série expressam o espírito da técnica globalizada, onde a permanente novidade dos produtos se une a um tédio enfadonho. Não nos resignemos a isto nem renunciemos a perguntar-nos pelos fins e o sentido de tudo. Caso contrário, apenas legitimaremos o estado de facto e precisaremos de mais sucedâneos para suportar o vazio."}, {"n": 114, "t": "O que está a acontecer põe-nos perante a urgência de avançar numa corajosa revolução cultural. A ciência e a tecnologia não são neutrais, mas podem, desde o início até ao fim dum processo, envolver diferentes intenções e possibilidades que se podem configurar de várias maneiras. Ninguém quer o regresso à Idade da Pedra, mas é indispensável abrandar a marcha para olhar a realidade doutra forma, recolher os avanços positivos e sustentáveis e ao mesmo tempo recuperar os valores e os grandes objectivos arrasados por um desenfreamento megalómano."}, {"h": "3. Crise do antropocentrismo moderno e suas consequências", "lvl": 1}, {"n": 115, "t": "O antropocentrismo moderno acabou, paradoxalmente, por colocar a razão técnica acima da realidade, porque este ser humano «já não sente a natureza como norma válida nem como um refúgio vivente. Sem se pôr qualquer hipótese, vê-a, objectivamente, como espaço e matéria onde realizar uma obra em que se imerge completamente, sem se importar com o que possa suceder a ela».[92] Assim debilita-se o valor intrínseco do mundo. Mas, se o ser humano não redescobre o seu verdadeiro lugar, compreende-se mal a si mesmo e acaba por contradizer a sua própria realidade. «Não só a terra foi dada por Deus ao homem, que a deve usar respeitando a intenção originária de bem, segundo a qual lhe foi entregue; mas o homem é doado a si mesmo por Deus, devendo por isso respeitar a estrutura natural e moral de que foi dotado».[93]"}, {"n": 116, "t": "Nos tempos modernos, verificou-se um notável excesso antropocêntrico, que hoje, com outra roupagem, continua a minar toda a referência a algo de comum e qualquer tentativa de reforçar os laços sociais. Por isso, chegou a hora de prestar novamente atenção à realidade com os limites que a mesma impõe e que, por sua vez, constituem a possibilidade dum desenvolvimento humano e social mais saudável e fecundo. Uma apresentação inadequada da antropologia cristã acabou por promover uma concepção errada da relação do ser humano com o mundo. Muitas vezes foi transmitido um sonho prometeico de domínio sobre o mundo, que provocou a impressão de que o cuidado da natureza fosse actividade de fracos. Mas a interpretação correcta do conceito de ser humano como senhor do universo é entendê-lo no sentido de administrador responsável.[94]"}, {"n": 117, "t": "A falta de preocupação por medir os danos à natureza e o impacto ambiental das decisões é apenas o reflexo evidente do desinteresse em reconhecer a mensagem que a natureza traz inscrita nas suas próprias estruturas. Quando, na própria realidade, não se reconhece a importância dum pobre, dum embrião humano, duma pessoa com deficiência — só para dar alguns exemplos -, dificilmente se saberá escutar os gritos da própria natureza. Tudo está interligado. Se o ser humano se declara autónomo da realidade e se constitui dominador absoluto, desmorona-se a própria base da sua existência, porque «em vez de realizar o seu papel de colaborador de Deus na obra da criação, o homem substitui-se a Deus, e deste modo acaba por provocar a revolta da natureza».[95]"}, {"n": 118, "t": "Esta situação leva-nos a uma esquizofrenia permanente, que se estende da exaltação tecnocrática, que não reconhece aos outros seres um valor próprio, até à reacção de negar qualquer valor peculiar ao ser humano. Contudo não se pode prescindir da humanidade. Não haverá uma nova relação com a natureza, sem um ser humano novo. Não há ecologia sem uma adequada antropologia. Quando a pessoa humana é considerada apenas mais um ser entre outros, que provém de jogos do acaso ou dum determinismo físico, «corre o risco de atenuar-se, nas consciências, a noção da responsabilidade».[96] Um antropocentrismo desordenado não deve necessariamente ser substituído por um «biocentrismo», porque isto implicaria introduzir um novo desequilíbrio que não só não resolverá os problemas existentes, mas acrescentará outros. Não se pode exigir do ser humano um compromisso para com o mundo, se ao mesmo tempo não se reconhecem e valorizam as suas peculiares capacidades de conhecimento, vontade, liberdade e responsabilidade."}, {"n": 119, "t": "A crítica do antropocentrismo desordenado não deveria deixar em segundo plano também o valor das relações entre as pessoas. Se a crise ecológica é uma expressão ou uma manifestação externa da crise ética, cultural e espiritual da modernidade, não podemos iludir-nos de sanar a nossa relação com a natureza e o meio ambiente, sem curar todas as relações humanas fundamentais. Quando o pensamento cristão reivindica, para o ser humano, um valor peculiar acima das outras criaturas, suscita a valorização de cada pessoa humana e, assim, estimula o reconhecimento do outro. A abertura a um «tu» capaz de conhecer, amar e dialogar continua a ser a grande nobreza da pessoa humana. Por isso, para uma relação adequada com o mundo criado, não é necessário diminuir a dimensão social do ser humano nem a sua dimensão transcendente, a sua abertura ao «Tu» divino. Com efeito, não se pode propor uma relação com o ambiente, prescindindo da relação com as outras pessoas e com Deus. Seria um individualismo romântico disfarçado de beleza ecológica e um confinamento asfixiante na imanência."}, {"n": 120, "t": "Uma vez que tudo está relacionado, também não é compatível a defesa da natureza com a justificação do aborto. Não parece viável um percurso educativo para acolher os seres frágeis que nos rodeiam e que, às vezes, são molestos e inoportunos, quando não se dá protecção a um embrião humano ainda que a sua chegada seja causa de incómodos e dificuldades: «Se se perde a sensibilidade pessoal e social ao acolhimento duma nova vida, definham também outras formas de acolhimento úteis à vida social».[97]"}, {"n": 121, "t": "Espera-se ainda o desenvolvimento duma nova síntese, que ultrapasse as falsas dialécticas dos últimos séculos. O próprio cristianismo, mantendo-se fiel à sua identidade e ao tesouro de verdade que recebeu de Jesus Cristo, não cessa de se repensar e reformular em diálogo com as novas situações históricas, deixando desabrochar assim a sua eterna novidade.[98]"}, {"h": "O relativismo prático", "lvl": 2}, {"n": 122, "t": "Um antropocentrismo desordenado gera um estilo de vida desordenado. Na exortação apostólica Evangelii gaudium, referi-me ao relativismo prático que caracteriza a nossa época e que é «ainda mais perigoso que o doutrinal».[99] Quando o ser humano se coloca no centro, acaba por dar prioridade absoluta aos seus interesses contingentes, e tudo o mais se torna relativo. Por isso, não deveria surpreender que, juntamente com a omnipresença do paradigma tecnocrático e a adoração do poder humano sem limites, se desenvolva nos indivíduos este relativismo no qual tudo o que não serve os próprios interesses imediatos se torna irrelevante. Nisto, há uma lógica que permite compreender como se alimentam mutuamente diferentes atitudes, que provocam ao mesmo tempo a degradação ambiental e a degradação social."}, {"n": 123, "t": "A cultura do relativismo é a mesma patologia que impele uma pessoa a aproveitar-se de outra e a tratá-la como mero objecto, obrigando-a a trabalhos forçados, ou reduzindo-a à escravidão por causa duma dívida. É a mesma lógica que leva à exploração sexual das crianças, ou ao abandono dos idosos que não servem os interesses próprios. É também a lógica interna daqueles que dizem: «Deixemos que as forças invisíveis do mercado regulem a economia, porque os seus efeitos sobre a sociedade e a natureza são danos inevitáveis». Se não há verdades objectivas nem princípios estáveis, fora da satisfação das aspirações próprias e das necessidades imediatas, que limites pode haver para o tráfico de seres humanos, a criminalidade organizada, o narcotráfico, o comércio de diamantes ensanguentados e de peles de animais em vias de extinção? Não é a mesma lógica relativista a que justifica a compra de órgãos dos pobres com a finalidade de os vender ou utilizar para experimentação, ou o descarte de crianças porque não correspondem ao desejo de seus pais? É a mesma lógica do «usa e joga fora» que produz tantos resíduos, só pelo desejo desordenado de consumir mais do que realmente se tem necessidade. Portanto, não podemos pensar que os programas políticos ou a força da lei sejam suficientes para evitar os comportamentos que afectam o meio ambiente, porque, quando é a cultura que se corrompe deixando de reconhecer qualquer verdade objectiva ou quaisquer princípios universalmente válidos, as leis só se poderão entender como imposições arbitrárias e obstáculos a evitar."}, {"h": "A necessidade de defender o trabalho", "lvl": 2}, {"n": 124, "t": "Em qualquer abordagem de ecologia integral que não exclua o ser humano, é indispensável incluir o valor do trabalho, tão sabiamente desenvolvido por São João Paulo II na sua encíclica Laborem excercens. Recordemos que, segundo a narração bíblica da criação, Deus colocou o ser humano no jardim recém-criado (cf. Gn 2, 15), não só para cuidar do existente (guardar), mas também para trabalhar nele a fim de que produzisse frutos (cultivar). Assim, os operários e os artesãos «asseguram uma criação perpétua» (Sir 38, 34). Na realidade, a intervenção humana que favorece o desenvolvimento prudente da criação é a forma mais adequada de cuidar dela, porque implica colocar-se como instrumento de Deus para ajudar a fazer desabrochar as potencialidades que Ele mesmo inseriu nas coisas: «O Senhor produziu da terra os medicamentos; e o homem sensato não os desprezará» (Sir 38, 4)."}, {"n": 125, "t": "Se procurarmos pensar quais possam ser as relações adequadas do ser humano com o mundo que o rodeia, surge a necessidade duma concepção correcta do trabalho, porque, falando da relação do ser humano com as coisas, impõe-se-nos a questão relativa ao sentido e finalidade da acção humana sobre a realidade. Não falamos apenas do trabalho manual ou do trabalho da terra, mas de qualquer actividade que implique alguma transformação do existente, desde a elaboração dum balanço social até ao projecto dum progresso tecnológico. Qualquer forma de trabalho pressupõe uma concepção sobre a relação que o ser humano pode ou deve estabelecer com o outro diverso de si mesmo. A espiritualidade cristã, a par da admiração contemplativa das criaturas que encontramos em São Francisco de Assis, desenvolveu também uma rica e sadia compreensão do trabalho, como podemos encontrar, por exemplo, na vida do Beato Carlos de Foucauld e seus discípulos."}, {"n": 126, "t": "Algo se pode recolher também da longa tradição monástica. Nos primórdios, esta favorecia de certo modo a fuga do mundo, procurando afastar-se da decadência urbana. Por isso, os monges buscavam o deserto, convencidos de que fosse o lugar adequado para reconhecer a presença de Deus. Mais tarde, São Bento de Núrsia quis que os seus monges vivessem em comunidade, unindo oração e estudo com o trabalho manual («Ora et labora»). Esta introdução do trabalho manual impregnada de sentido espiritual revelou-se revolucionária. Aprendeu-se a buscar o amadurecimento e a santificação na compenetração entre o recolhimento e o trabalho. Esta maneira de viver o trabalho torna-nos mais capazes de ter cuidado e respeito pelo meio ambiente, impregnando de sadia sobriedade a nossa relação com o mundo."}, {"n": 127, "t": "Afirmamos que «o homem é o protagonista, o centro e o fim de toda a vida económico-social».[100] Apesar disso, quando no ser humano se deteriora a capacidade de contemplar e respeitar, criam-se as condições para se desfigurar o sentido do trabalho.[101] Convém recordar sempre que o ser humano é «capaz de, por si próprio, ser o agente responsável do seu bem-estar material, progresso moral e desenvolvimento espiritual».[102] O trabalho deveria ser o âmbito deste multiforme desenvolvimento pessoal, onde estão em jogo muitas dimensões da vida: a criatividade, a projectação do futuro, o desenvolvimento das capacidades, a exercitação dos valores, a comunicação com os outros, uma atitude de adoração. Por isso, a realidade social do munda actual exige que, acima dos limitados interesses das empresas e duma discutível racionalidade económica, «se continue a perseguir como prioritário o objectivo do acesso ao trabalho para todos».[103]"}, {"n": 128, "t": "Somos chamados ao trabalho desde a nossa criação. Não se deve procurar que o progresso tecnológico substitua cada vez mais o trabalho humano: procedendo assim, a humanidade prejudicar-se-ia a si mesma. O trabalho é uma necessidade, faz parte do sentido da vida nesta terra, é caminho de maturação, desenvolvimento humano e realização pessoal. Neste sentido, ajudar os pobres com o dinheiro deve ser sempre um remédio provisório para enfrentar emergências. O verdadeiro objectivo deveria ser sempre consentir-lhes uma vida digna através do trabalho. Mas a orientação da economia favoreceu um tipo de progresso tecnológico cuja finalidade é reduzir os custos de produção com base na diminuição dos postos de trabalho, que são substituídos por máquinas. É mais um exemplo de como a acção do homem se pode voltar contra si mesmo. A diminuição dos postos de trabalho «tem também um impacto negativo no plano económico com a progressiva corrosão do “capital social”, isto é, daquele conjunto de relações de confiança, de credibilidade, de respeito das regras, indispensável em qualquer convivência civil».[104] Em suma, «os custos humanos são sempre também custos económicos, e as disfunções económicas acarretam sempre também custos humanos».[105] Renunciar a investir nas pessoas para se obter maior receita imediata é um péssimo negócio para a sociedade."}, {"n": 129, "t": "Para se conseguir continuar a dar emprego, é indispensável promover uma economia que favoreça a diversificação produtiva e a criatividade empresarial. Por exemplo, há uma grande variedade de sistemas alimentares rurais de pequena escala que continuam a alimentar a maior parte da população mundial, utilizando uma porção reduzida de terreno e de água e produzindo menos resíduos, quer em pequenas parcelas agrícolas e hortas, quer na caça e recolha de produtos silvestres, quer na pesca artesanal. As economias de larga escala, especialmente no sector agrícola, acabam por forçar os pequenos agricultores a vender as suas terras ou a abandonar as suas culturas tradicionais. As tentativas feitas por alguns deles no sentido de desenvolverem outras formas de produção, mais diversificadas, resultam inúteis por causa da dificuldade de ter acesso aos mercados regionais e globais, ou porque a infra-estrutura de venda e transporte está ao serviço das grandes empresas. As autoridades têm o direito e a responsabilidade de adoptar medidas de apoio claro e firme aos pequenos produtores e à diversificação da produção. Às vezes, para que haja uma liberdade económica da qual todos realmente beneficiem, pode ser necessário pôr limites àqueles que detêm maiores recursos e poder financeiro. A simples proclamação da liberdade económica, enquanto as condições reais impedem que muitos possam efectivamente ter acesso a ela e, ao mesmo tempo, se reduz o acesso ao trabalho, torna-se um discurso contraditório que desonra a política. A actividade empresarial, que é uma nobre vocação orientada para produzir riqueza e melhorar o mundo para todos, pode ser uma maneira muito fecunda de promover a região onde instala os seus empreendimentos, sobretudo se pensa que a criação de postos de trabalho é parte imprescindível do seu serviço ao bem comum."}, {"h": "A inovação biológica a partir da pesquisa", "lvl": 2}, {"n": 130, "t": "Na visão filosófica e teológica do ser humano e da criação que procurei propor, aparece claro que a pessoa humana, com a peculiaridade da sua razão e da sua sabedoria, não é um factor externo que deva ser totalmente excluído. No entanto, embora o ser humano possa intervir no mundo vegetal e animal e fazer uso dele quando é necessário para a sua vida, o Catecismo ensina que as experimentações sobre os animais só são legítimas «desde que não ultrapassem os limites do razoável e contribuam para curar ou poupar vidas humanas».[106] Recorda, com firmeza, que o poder humano tem limites e que «é contrário à dignidade humana fazer sofrer inutilmente os animais e dispor indiscriminadamente das suas vidas».[107] Todo o uso e experimentação «exige um respeito religioso pela integridade da criação».[108]"}, {"n": 131, "t": "Quero recolher aqui a posição equilibrada de São João Paulo II, pondo em destaque os benefícios dos progressos científicos e tecnológicos, que «manifestam quanto é nobre a vocação do homem para participar de modo responsável na acção criadora de Deus», mas ao mesmo tempo recordava que «toda e qualquer intervenção numa área determinada do ecossistema não pode prescindir da consideração das suas consequências noutras áreas».[109] Afirmava que a Igreja aprecia a contribuição «do estudo e das aplicações da biologia molecular, completada por outras disciplinas como a genética e a sua aplicação tecnológica na agricultura e na indústria»,[110] embora dissesse também que isto não deve levar a uma «indiscriminada manipulação genética»[111] que ignore os efeitos negativos destas intervenções. Não é possível frenar a criatividade humana. Se não se pode proibir a um artista que exprima a sua capacidade criativa, também não se pode obstaculizar quem possui dons especiais para o progresso científico e tecnológico, cujas capacidades foram dadas por Deus para o serviço dos outros. Ao mesmo tempo, não se pode deixar de considerar os objectivos, os efeitos, o contexto e os limites éticos de tal actividade humana que é uma forma de poder com grandes riscos."}, {"n": 132, "t": "Neste quadro, deveria situar-se toda e qualquer reflexão acerca da intervenção humana sobre o mundo vegetal e animal que implique hoje mutações genéticas geradas pela biotecnologia, a fim de aproveitar as possibilidades presentes na realidade material. O respeito da fé pela razão pede para se prestar atenção àquilo que a própria ciência biológica, desenvolvida independentemente dos interesses económicos, possa ensinar a propósito das estruturas biológicas e das suas possibilidades e mutações. Em todo o caso, é legítima uma intervenção que actue sobre a natureza «para a ajudar a desenvolver-se na sua própria linha, a da criação, querida por Deus».[112]"}, {"n": 133, "t": "É difícil emitir um juízo geral sobre o desenvolvimento de organismos modificados geneticamente (OMG), vegetais ou animais, para fins medicinais ou agro-pecuários, porque podem ser muito diferentes entre si e requerer distintas considerações. Além disso, Os riscos nem sempre se devem atribuir à própria técnica, mas à sua aplicação inadequada ou excessiva. Na realidade, muitas vezes as mutações genéticas foram e continuam a ser produzidas pela própria natureza. E mesmo as provocadas pelo ser humano não são um fenómeno moderno. A domesticação de animais, o cruzamento de espécies e outras práticas antigas e universalmente seguidas podem incluir-se nestas considerações. É oportuno recordar que o início dos progressos científicos sobre cereais transgénicos foi a observação de bactérias que, de forma natural e espontânea, produziam uma modificação no genoma dum vegetal. Mas, na natureza, estes processos têm um ritmo lento, que não se compara com a velocidade imposta pelos avanços tecnológicos actuais, mesmo quando estes avanços se baseiam num desenvolvimento científico de vários séculos."}, {"n": 134, "t": "Embora não disponhamos de provas definitivas acerca do dano que poderiam causar os cereais transgénicos aos seres humanos e apesar de, nalgumas regiões, a sua utilização ter produzido um crescimento económico que contribuiu para resolver determinados problemas, há dificuldades importantes que não devem ser minimizadas. Em muitos lugares, na sequência da introdução destas culturas, constata-se uma concentração de terras produtivas nas mãos de poucos, devido ao «progressivo desaparecimento de pequenos produtores, que, em consequência da perda das terras cultivadas, se viram obrigados a retirar-se da produção directa».[113] Os mais frágeis deles tornam-se trabalhadores precários, e muitos assalariados agrícolas acabam por emigrar para miseráveis aglomerados das cidades. A expansão destas culturas destrói a complexa trama dos ecossistemas, diminui a diversidade na produção e afecta o presente ou o futuro das economias regionais. Em vários países, nota-se uma tendência para o desenvolvimento de oligopólios na produção de sementes e outros produtos necessários para o cultivo, e a dependência agrava-se quando se pensa na produção de sementes estéreis que acabam por obrigar os agricultores a comprá-las as empresas produtoras."}, {"n": 135, "t": "Sem dúvida, há necessidade duma atenção constante, que tenha em consideração todos os aspectos éticos implicados. Para isso, é preciso assegurar um debate científico e social que seja responsável e amplo, capaz de considerar toda a informação disponível e chamar as coisas pelo seu nome. Às vezes não se coloca sobre a mesa a informação completa, mas é seleccionada de acordo com os próprios interesses, sejam eles políticos, económicos ou ideológicos. Isto torna difícil elaborar um juízo equilibrado e prudente sobre as várias questões, tendo presente todas as variáveis em jogo. É necessário dispor de espaços de debate, onde todos aqueles que poderiam de algum modo ver-se, directa ou indirectamente, afectados (agricultores, consumidores, autoridades, cientistas, produtores de sementes, populações vizinhas dos campos tratados e outros) tenham possibilidade de expor as suas problemáticas ou ter acesso a uma informação ampla e fidedigna para adoptar decisões tendentes ao bem comum presente e futuro. A questão dos OMG é uma questão de carácter complexo, que requer ser abordada com um olhar abrangente de todos os aspectos; isto exigiria pelo menos um maior esforço para financiar distintas linhas de pesquisa autónoma e interdisciplinar que possam trazer nova luz."}, {"n": 136, "t": "Além disso, é preocupante constatar que alguns movimentos ecologistas defendem a integridade do meio ambiente e, com razão, reclamam a imposição de determinados limites à pesquisa científica, mas não aplicam estes mesmos princípios à vida humana. Muitas vezes justifica-se que se ultrapassem todos os limites, quando se faz experiências com embriões humanos vivos. Esquece-se que o valor inalienável do ser humano é independente do seu grau de desenvolvimento. Aliás, quando a técnica ignora os grandes princípios éticos, acaba por considerar legítima qualquer prática. Como vimos neste capítulo, a técnica separada da ética dificilmente será capaz de autolimitar o seu poder."}]}, {"id": "c4", "title": "Capítulo IV", "sub": "Uma ecologia integral", "short": "IV", "items": [{"n": 137, "t": "Dado que tudo está intimamente relacionado e que os problemas actuais requerem um olhar que tenha em conta todos os aspectos da crise mundial, proponho que nos detenhamos agora a reflectir sobre os diferentes elementos duma ecologia integral, que inclua claramente as dimensões humanas e sociais."}, {"h": "1. Ecologia ambiental, económica e social", "lvl": 1}, {"n": 138, "t": "A ecologia estuda as relações entre os organismos vivos e o meio ambiente onde se desenvolvem. E isto exige sentar-se a pensar e discutir acerca das condições de vida e de sobrevivência duma sociedade, com a honestidade de pôr em questão modelos de desenvolvimento, produção e consumo. Nunca é demais insistir que tudo está interligado. O tempo e o espaço não são independentes entre si; nem os próprios átomos ou as partículas subatómicas se podem considerar separadamente. Assim como os vários componentes do planeta — físicos, químicos e biológicos — estão relacionados entre si, assim também as espécies vivas formam uma trama que nunca acabaremos de individuar e compreender. Boa parte da nossa informação genética é partilhada com muitos seres vivos. Por isso, os conhecimentos fragmentários e isolados podem tornar-se uma forma de ignorância, quando resistem a integrar-se numa visão mais ampla da realidade."}, {"n": 139, "t": "Quando falamos de «meio ambiente», fazemos referência também a uma particular relação: a relação entre a natureza e a sociedade que a habita. Isto impede-nos de considerar a natureza como algo separado de nós ou como uma mera moldura da nossa vida. Estamos incluídos nela, somos parte dela e compenetramo-nos. As razões, pelas quais um lugar se contamina, exigem uma análise do funcionamento da sociedade, da sua economia, do seu comportamento, das suas maneiras de entender a realidade. Dada a amplitude das mudanças, já não é possível encontrar uma resposta específica e independente para cada parte do problema. É fundamental buscar soluções integrais que considerem as interacções dos sistemas naturais entre si e com os sistemas sociais. Não há duas crises separadas: uma ambiental e outra social; mas uma única e complexa crise sócio-ambiental. As directrizes para a solução requerem uma abordagem integral para combater a pobreza, devolver a dignidade aos excluídos e, simultaneamente, cuidar da natureza."}, {"n": 140, "t": "Devido à quantidade e variedade de elementos a ter em conta na hora de determinar o impacto ambiental dum empreendimento concreto, torna-se indispensável dar aos pesquisadores um papel preponderante e facilitar a sua interacção com uma ampla liberdade académica. Esta pesquisa constante deveria permitir reconhecer também como as diferentes criaturas se relacionam, formando aquelas unidades maiores que hoje chamamos «ecossistemas». Temo-los em conta não só para determinar qual é o seu uso razoável, mas também porque possuem um valor intrínseco, independente de tal uso. Assim como cada organismo é bom e admirável em si mesmo pelo facto de ser uma criatura de Deus, o mesmo se pode dizer do conjunto harmónico de organismos num determinado espaço, funcionando como um sistema. Embora não tenhamos consciência disso, dependemos desse conjunto para a nossa própria existência. Convém recordar que os ecossistemas intervêm na retenção do dióxido de carbono, na purificação da água, na contraposição a doenças e pragas, na composição do solo, na decomposição dos resíduos, e muitíssimos outros serviços que esquecemos ou ignoramos. Quando se dão conta disto, muitas pessoas voltam a tomar consciência de que vivemos e agimos a partir duma realidade que nos foi previamente dada, que é anterior às nossas capacidades e à nossa existência. Por isso, quando se fala de «uso sustentável», é preciso incluir sempre uma consideração sobre a capacidade regenerativa de cada ecossistema nos seus diversos sectores e aspectos."}, {"n": 141, "t": "Além disso, o crescimento económico tende a gerar automatismos e a homogeneizar, a fim de simplificar os processos e reduzir os custos. Por isso, é necessária uma ecologia económica, capaz de induzir a considerar a realidade de forma mais ampla. Com efeito, «a protecção do meio ambiente deverá constituir parte integrante do processo de desenvolvimento e não poderá ser considerada isoladamente».[114] Mas, ao mesmo tempo, torna-se actual a necessidade imperiosa do humanismo, que faz apelo aos distintos saberes, incluindo o económico, para uma visão mais integral e integradora. Hoje, a análise dos problemas ambientais é inseparável da análise dos contextos humanos, familiares, laborais, urbanos, e da relação de cada pessoa consigo mesma, que gera um modo específico de se relacionar com os outros e com o meio ambiente. Há uma interacção entre os ecossistemas e entre os diferentes mundos de referência social e, assim, se demonstra mais uma vez que «o todo é superior à parte».[115]"}, {"n": 142, "t": "Se tudo está relacionado, também o estado de saúde das instituições duma sociedade tem consequências no ambiente e na qualidade de vida humana: «toda a lesão da solidariedade e da amizade cívica provoca danos ambientais».[116] Neste sentido, a ecologia social é necessariamente institucional e progressivamente alcança as diferentes dimensões, que vão desde o grupo social primário, a família, até à vida internacional, passando pela comunidade local e a nação. Dentro de cada um dos níveis sociais e entre eles, desenvolvem-se as instituições que regulam as relações humanas. Tudo o que as danifica comporta efeitos nocivos, como a perda da liberdade, a injustiça e a violência. Vários países são governados por um sistema institucional precário, à custa do sofrimento do povo e para benefício daqueles que lucram com este estado de coisas. Tanto dentro da administração do Estado, como nas diferentes expressões da sociedade civil, ou nas relações dos habitantes entre si, registam-se, com demasiada frequência, comportamentos ilegais. As leis podem estar redigidas de forma correcta, mas muitas vezes permanecem letra morta. Poder-se-á, assim, esperar que a legislação e as normativas relativas ao meio ambiente sejam realmente eficazes? Sabemos, por exemplo, que países dotados duma legislação clara sobre a protecção das florestas continuam a ser testemunhas mudas da sua frequente violação. Além disso, o que acontece numa região influi, directa ou indirectamente, nas outras regiões. Assim, por exemplo, o consumo de drogas nas sociedades opulentas provoca uma constante ou crescente procura de produtos que provêm de regiões empobrecidas, onde se corrompem comportamentos, se destroem vidas e se acaba por degradar o meio ambiente."}, {"h": "2. Ecologia cultural", "lvl": 1}, {"n": 143, "t": "A par do património natural, encontra-se igualmente ameaçado um património histórico, artístico e cultural. Faz parte da identidade comum de um lugar, servindo de base para construir uma cidade habitável. Não se trata de destruir e criar novas cidades hipoteticamente mais ecológicas, onde nem sempre resulta desejável viver. É preciso integrar a história, a cultura e a arquitectura dum lugar, salvaguardando a sua identidade original. Por isso, a ecologia envolve também o cuidado das riquezas culturais da humanidade, no seu sentido mais amplo. Mais directamente, pede que se preste atenção às culturas locais, quando se analisam questões relacionadas com o meio ambiente, fazendo dialogar a linguagem técnico-científica com a linguagem popular. É a cultura — entendida não só como os monumentos do passado, mas especialmente no seu sentido vivo, dinâmico e participativo — que não se pode excluir na hora de repensar a relação do ser humano com o meio ambiente."}, {"n": 144, "t": "A visão consumista do ser humano, incentivada pelos mecanismos da economia globalizada actual, tende a homogeneizar as culturas e a debilitar a imensa variedade cultural, que é um tesouro da humanidade. Por isso, pretender resolver todas as dificuldades através de normativas uniformes ou por intervenções técnicas, leva a negligenciar a complexidade das problemáticas locais, que requerem a participação activa dos habitantes. Os novos processos em gestação nem sempre se podem integrar dentro de modelos estabelecidos do exterior, mas hão-de ser provenientes da própria cultura local. Assim como a vida e o mundo são dinâmicos, assim também o cuidado do mundo deve ser flexível e dinâmico. As soluções meramente técnicas correm o risco de tomar em consideração sintomas que não correspondem às problemáticas mais profundas. É preciso assumir a perspectiva dos direitos dos povos e das culturas, dando assim provas de compreender que o desenvolvimento dum grupo social supõe um processo histórico no âmbito dum contexto cultural e requer constantemente o protagonismo dos actores sociais locais a partir da sua própria cultura. Nem mesmo a noção da qualidade de vida se pode impor, mas deve ser entendida dentro do mundo de símbolos e hábitos próprios de cada grupo humano."}, {"n": 145, "t": "Muitas formas de intensa exploração e degradação do meio ambiente podem esgotar não só os meios locais de subsistência, mas também os recursos sociais que consentiram um modo de viver que sustentou, durante longo tempo, uma identidade cultural e um sentido da existência e da convivência social. O desaparecimento duma cultura pode ser tanto ou mais grave do que o desaparecimento duma espécie animal ou vegetal. A imposição dum estilo hegemónico de vida ligado a um modo de produção pode ser tão nocivo como a alteração dos ecossistemas."}, {"n": 146, "t": "Neste sentido, é indispensável prestar uma atenção especial às comunidades aborígenes com as suas tradições culturais. Não são apenas uma minoria entre outras, mas devem tornar-se os principais interlocutores, especialmente quando se avança com grandes projectos que afectam os seus espaços. Com efeito, para eles, a terra não é um bem económico, mas dom gratuito de Deus e dos antepassados que nela descansam, um espaço sagrado com o qual precisam de interagir para manter a sua identidade e os seus valores. Eles, quando permanecem nos seus territórios, são quem melhor os cuida. Em várias partes do mundo, porém, são objecto de pressões para que abandonem suas terras e as deixem livres para projectos extractivos e agro-pecuários que não prestam atenção à degradação da natureza e da cultura."}, {"h": "3. Ecologia da vida quotidiana", "lvl": 1}, {"n": 147, "t": "Para se poder falar de autêntico progresso, será preciso verificar que se produza uma melhoria global na qualidade de vida humana; isto implica analisar o espaço onde as pessoas transcorrem a sua existência. Os ambientes onde vivemos influem sobre a nossa maneira de ver a vida, sentir e agir. Ao mesmo tempo, no nosso quarto, na nossa casa, no nosso lugar de trabalho e no nosso bairro, usamos o ambiente para exprimir a nossa identidade. Esforçamo-nos por nos adaptar ao ambiente e, quando este aparece desordenado, caótico ou cheio de poluição visiva e acústica, o excesso de estímulos põe à prova as nossas tentativas de desenvolver uma identidade integrada e feliz."}, {"n": 148, "t": "Admirável é a criatividade e generosidade de pessoas e grupos que são capazes de dar a volta às limitações do ambiente, modificando os efeitos adversos dos condicionalismos e aprendendo a orientar a sua existência no meio da desordem e precariedade. Por exemplo, nalguns lugares onde as fachadas dos edifícios estão muito deterioradas, há pessoas que cuidam com muita dignidade o interior das suas habitações, ou que se sentem bem pela cordialidade e amizade das pessoas. A vida social positiva e benfazeja dos habitantes enche de luz um ambiente à primeira vista inabitável. É louvável a ecologia humana que os pobres conseguem desenvolver, no meio de tantas limitações. A sensação de sufocamento, produzida pelos aglomerados residenciais e pelos espaços com alta densidade populacional, é contrastada se se desenvolvem calorosas relações humanas de vizinhança, se se criam comunidades, se as limitações ambientais são compensadas na interioridade de cada pessoa que se sente inserida numa rede de comunhão e pertença. Deste modo, qualquer lugar deixa de ser um inferno e torna-se o contexto duma vida digna."}, {"n": 149, "t": "Inversamente está provado que a penúria extrema vivida nalguns ambientes privados de harmonia, magnanimidade e possibilidade de integração, facilita o aparecimento de comportamentos desumanos e a manipulação das pessoas por organizações criminosas. Para os habitantes de bairros periféricos muito precários, a experiência diária de passar da superlotação ao anonimato social, que se vive nas grandes cidades, pode provocar uma sensação de desenraizamento que favorece comportamentos anti-sociais e violência. Todavia tenho a peito reiterar que o amor é mais forte. Muitas pessoas, nestas condições, são capazes de tecer laços de pertença e convivência que transformam a superlotação numa experiência comunitária, onde se derrubam os muros do eu e superam as barreiras do egoísmo. Esta experiência de salvação comunitária é o que muitas vezes suscita reacções criativas para melhorar um edifício ou um bairro.[117]"}, {"n": 150, "t": "Dada a relação entre os espaços urbanizados e o comportamento humano, aqueles que projectam edifícios, bairros, espaços públicos e cidades precisam da contribuição dos vários saberes que permitem compreender os processos, o simbolismo e os comportamentos das pessoas. Não é suficiente a busca da beleza no projecto, porque tem ainda mais valor servir outro tipo de beleza: a qualidade de vida das pessoas, a sua harmonia com o ambiente, o encontro e ajuda mútua. Por isso também, é tão importante que o ponto de vista dos habitantes do lugar contribua sempre para a análise da planificação urbanista."}, {"n": 151, "t": "É preciso cuidar dos espaços comuns, dos marcos visuais e das estruturas urbanas que melhoram o nosso sentido de pertença, a nossa sensação de enraizamento, o nosso sentimento de «estar em casa» dentro da cidade que nos envolve e une. É importante que as diferentes partes duma cidade estejam bem integradas e que os habitantes possam ter uma visão de conjunto em vez de se encerrarem num bairro, renunciando a viver a cidade inteira como um espaço próprio partilhado com os outros. Toda a intervenção na paisagem urbana ou rural deveria considerar que os diferentes elementos do lugar formam um todo, sentido pelos habitantes como um contexto coerente com a sua riqueza de significados. Assim, os outros deixam de ser estranhos e podemos senti-los como parte de um «nós» que construímos juntos. Pela mesma razão, tanto no meio urbano como no rural, convém preservar alguns espaços onde se evitem intervenções humanas que os alterem constantemente."}, {"n": 152, "t": "A falta de habitação é grave em muitas partes do mundo, tanto nas áreas rurais como nas grandes cidades, nomeadamente porque os orçamentos estatais em geral cobrem apenas uma pequena parte da procura. E não só os pobres, mas uma grande parte da sociedade encontra sérias dificuldades para ter uma casa própria. A propriedade da casa tem muita importância para a dignidade das pessoas e o desenvolvimento das famílias. Trata-se duma questão central da ecologia humana. Se num lugar concreto já se desenvolveram aglomerados caóticos de casas precárias, trata-se primariamente de urbanizar estes bairros, não de erradicar e expulsar os habitantes. Mas, quando os pobres vivem em subúrbios poluídos ou aglomerados perigosos, «no caso de ter de se proceder à sua deslocação, para não acrescentar mais sofrimento ao que já padecem, é necessário fornecer-lhes uma adequada e prévia informação, oferecer-lhes alternativas de alojamentos dignos e envolver directamente os interessados».[118] Ao mesmo tempo, a criatividade deveria levar à integração dos bairros precários numa cidade acolhedora: «Como são belas as cidades que superam a desconfiança doentia e integram os que são diferentes, fazendo desta integração um novo factor de progresso! Como são encantadoras as cidades que, já no seu projecto arquitectónico, estão cheias de espaços que unem, relacionam, favorecem o reconhecimento do outro!»[119]"}, {"n": 153, "t": "Nas cidades, a qualidade de vida está largamente relacionada com os transportes, que muitas vezes são causa de grandes tribulações para os habitantes. Nelas, circulam muitos carros utilizados por uma ou duas pessoas, pelo que o tráfico torna-se intenso, eleva-se o nível de poluição, consomem-se enormes quantidades de energia não-renovável e torna-se necessário a construção de mais estradas e parques de estacionamento que prejudicam o tecido urbano. Muitos especialistas estão de acordo sobre a necessidade de dar prioridade ao transporte público. Mas é difícil que algumas medidas consideradas necessárias sejam pacificamente acolhidas pela sociedade, sem uma melhoria substancial do referido transporte, que, em muitas cidades, comporta um tratamento indigno das pessoas devido à superlotação, ao desconforto, ou à reduzida frequência dos serviços e à insegurança."}, {"n": 154, "t": "O reconhecimento da dignidade peculiar do ser humano contrasta frequentemente com a vida caótica que têm de fazer as pessoas nas nossas cidades. Mas isto não deveria levar a esquecer o estado de abandono e desleixo que sofrem também alguns habitantes das áreas rurais, onde não chegam os serviços essenciais e há trabalhadores reduzidos a situações de escravidão, sem direitos nem expectativas duma vida mais dignificante."}, {"n": 155, "t": "A ecologia humana implica também algo de muito profundo que é indispensável para se poder criar um ambiente mais dignificante: a relação necessária da vida do ser humano com a lei moral inscrita na sua própria natureza. Bento XVI dizia que existe uma «ecologia do homem», porque «também o homem possui uma natureza, que deve respeitar e não pode manipular como lhe apetece».[120] Nesta linha, é preciso reconhecer que o nosso corpo nos põe em relação directa com o meio ambiente e com os outros seres vivos. A aceitação do próprio corpo como dom de Deus é necessária para acolher e aceitar o mundo inteiro como dom do Pai e casa comum; pelo contrário, uma lógica de domínio sobre o próprio corpo transforma-se numa lógica, por vezes subtil, de domínio sobre a criação. Aprender a aceitar o próprio corpo, a cuidar dele e a respeitar os seus significados é essencial para uma verdadeira ecologia humana. Também é necessário ter apreço pelo próprio corpo na sua feminilidade ou masculinidade, para se poder reconhecer a si mesmo no encontro com o outro que é diferente. Assim, é possível aceitar com alegria o dom específico do outro ou da outra, obra de Deus criador, e enriquecer-se mutuamente. Portanto, não é salutar um comportamento que pretenda «cancelar a diferença sexual, porque já não sabe confrontar-se com ela».[121]"}, {"h": "4. O princípio do bem comum", "lvl": 1}, {"n": 156, "t": "A ecologia integral é inseparável da noção de bem comum, princípio este que desempenha um papel central e unificador na ética social. É «o conjunto das condições da vida social que permitem, tanto aos grupos como a cada membro, alcançar mais plena e facilmente a própria perfeição».[122]"}, {"n": 157, "t": "O bem comum pressupõe o respeito pela pessoa humana enquanto tal, com direitos fundamentais e inalienáveis orientados para o seu desenvolvimento integral. Exige também os dispositivos de bem-estar e segurança social e o desenvolvimento dos vários grupos intermédios, aplicando o princípio da subsidiariedade. Entre tais grupos, destaca-se de forma especial a família enquanto célula basilar da sociedade. Por fim, o bem comum requer a paz social, isto é, a estabilidade e a segurança de uma certa ordem, que não se realiza sem uma atenção particular à justiça distributiva, cuja violação gera sempre violência. Toda a sociedade - e, nela, especialmente o Estado — tem obrigação de defender e promover o bem comum."}, {"n": 158, "t": "Nas condições actuais da sociedade mundial, onde há tantas desigualdades e são cada vez mais numerosas as pessoas descartadas, privadas dos direitos humanos fundamentais, o princípio do bem comum torna-se imediatamente, como consequência lógica e inevitável, um apelo à solidariedade e uma opção preferencial pelos mais pobres. Esta opção implica tirar as consequências do destino comum dos bens da terra, mas — como procurei mostrar na exortação apostólica Evangelii gaudium [123] — exige acima de tudo contemplar a imensa dignidade do pobre à luz das mais profundas convicções de fé. Basta observar a realidade para compreender que, hoje, esta opção é uma exigência ética fundamental para a efectiva realização do bem comum."}, {"h": "5. A justiça intergeneracional", "lvl": 1}, {"n": 159, "t": "A noção de bem comum engloba também as gerações futuras. As crises económicas internacionais mostraram, de forma atroz, os efeitos nocivos que traz consigo o desconhecimento de um destino comum, do qual não podem ser excluídos aqueles que virão depois de nós. Já não se pode falar de desenvolvimento sustentável sem uma solidariedade intergeneracional. Quando pensamos na situação em que se deixa o planeta às gerações futuras, entramos noutra lógica: a do dom gratuito, que recebemos e comunicamos. Se a terra nos é dada, não podemos pensar apenas a partir dum critério utilitarista de eficiência e produtividade para lucro individual. Não estamos a falar duma atitude opcional, mas duma questão essencial de justiça, pois a terra que recebemos pertence também aqueles que hão-de vir. Os bispos de Portugal exortaram a assumir este dever de justiça: «O ambiente situa-se na lógica da recepção. É um empréstimo que cada geração recebe e deve transmitir à geração seguinte».[124] Uma ecologia integral possui esta perspectiva ampla."}, {"n": 160, "t": "Que tipo de mundo queremos deixar a quem vai suceder-nos, às crianças que estão a crescer? Esta pergunta não toca apenas o meio ambiente de maneira isolada, porque não se pode pôr a questão de forma fragmentária. Quando nos interrogamos acerca do mundo que queremos deixar, referimo-nos sobretudo à sua orientação geral, ao seu sentido, aos seus valores. Se não pulsa nelas esta pergunta de fundo, não creio que as nossas preocupações ecológicas possam alcançar efeitos importantes. Mas, se esta pergunta é posta com coragem, leva-nos inexoravelmente a outras questões muito directas: Com que finalidade passamos por este mundo? Para que viemos a esta vida? Para que trabalhamos e lutamos? Que necessidade tem de nós esta terra? Por isso, já não basta dizer que devemos preocupar-nos com as gerações futuras; exige-se ter consciência de que é a nossa própria dignidade que está em jogo. Somos nós os primeiros interessados em deixar um planeta habitável para a humanidade que nos vai suceder. Trata-se de um drama para nós mesmos, porque isto chama em causa o significado da nossa passagem por esta terra."}, {"n": 161, "t": "As previsões catastróficas já não se podem olhar com desprezo e ironia. Às próximas gerações, poderíamos deixar demasiadas ruínas, desertos e lixo. O ritmo de consumo, desperdício e alteração do meio ambiente superou de tal maneira as possibilidades do planeta, que o estilo de vida actual - por ser insustentável — só pode desembocar em catástrofes, como aliás já está a acontecer periodicamente em várias regiões. A atenuação dos efeitos do desequilíbrio actual depende do que fizermos agora, sobretudo se pensarmos na responsabilidade que nos atribuirão aqueles que deverão suportar as piores consequências."}, {"n": 162, "t": "A dificuldade em levar a sério este desafio tem a ver com uma deterioração ética e cultural, que acompanha a deterioração ecológica. O homem e a mulher deste mundo pós-moderno correm o risco permanente de se tornar profundamente individualistas, e muitos problemas sociais de hoje estão relacionados com a busca egoísta duma satisfação imediata, com as crises dos laços familiares e sociais, com as dificuldades em reconhecer o outro. Muitas vezes há um consumo excessivo e míope dos pais que prejudica os próprios filhos, que sentem cada vez mais dificuldade em comprar casa própria e fundar uma família. Além disso esta falta de capacidade para pensar seriamente nas futuras gerações está ligada com a nossa incapacidade de alargar o horizonte das nossas preocupações e pensar naqueles que permanecem excluídos do desenvolvimento. Não percamos tempo a imaginar os pobres do futuro, é suficiente que recordemos os pobres de hoje, que poucos anos têm para viver nesta terra e não podem continuar a esperar. Por isso, «para além de uma leal solidariedade entre as gerações, há que reafirmar a urgente necessidade moral de uma renovada solidariedade entre os indivíduos da mesma geração».[125]"}]}, {"id": "c5", "title": "Capítulo V", "sub": "Algumas linhas de orientação e acção", "short": "V", "items": [{"n": 163, "t": "Procurei examinar a situação actual da humanidade, tanto nas brechas do planeta que habitamos, como nas causas mais profundamente humanas da degradação ambiental. Embora esta contemplação da realidade em si mesma já nos indique a necessidade duma mudança de rumo e sugira algumas acções, procuremos agora delinear grandes percursos de diálogo que nos ajudem a sair da espiral de autodestruição onde estamos a afundar."}, {"h": "1. O diálogo sobre o meio ambiente na política internacional", "lvl": 1}, {"n": 164, "t": "Desde meados do século passado e superando muitas dificuldades, foi-se consolidando a tendência de conceber o planeta como pátria e a humanidade como povo que habita uma casa comum. Um mundo interdependente não significa unicamente compreender que as consequências danosas dos estilos de vida, produção e consumo afectam a todos, mas principalmente procurar que as soluções sejam propostas a partir duma perspectiva global e não apenas para defesa dos interesses de alguns países. A interdependência obriga-nos a pensar num único mundo, num projecto comum. Mas, a mesma inteligência que foi utilizada para um enorme desenvolvimento tecnológico não consegue encontrar formas eficazes de gestão internacional para resolver as graves dificuldades ambientais e sociais. Para enfrentar os problemas de fundo, que não se podem resolver com acções de países isolados, torna-se indispensável um consenso mundial que leve, por exemplo, a programar uma agricultura sustentável e diversificada, desenvolver formas de energia renováveis e pouco poluidoras, fomentar uma maior eficiência energética, promover uma gestão mais adequada dos recursos florestais e marinhos, garantir a todos o acesso à água potável."}, {"n": 165, "t": "Sabemos que a tecnologia baseada nos combustíveis fósseis — altamente poluentes, sobretudo o carvão mas também o petróleo e, em menor medida, o gás - deve ser, progressivamente e sem demora, substituída. Enquanto aguardamos por um amplo desenvolvimento das energias renováveis, que já deveria ter começado, é legítimo optar pela alternativa menos danosa ou recorrer a soluções transitórias. Todavia, na comunidade internacional, não se consegue suficiente acordo sobre a responsabilidade de quem deve suportar os maiores custos da transição energética. Nas últimas décadas, as questões ambientais deram origem a um amplo debate público, que fez crescer na sociedade civil espaços de notável compromisso e generosa dedicação. A política e a indústria reagem com lentidão, longe de estar à altura dos desafios mundiais. Neste sentido, pode-se dizer que, enquanto a humanidade do período pós-industrial talvez fique recordada como uma das mais irresponsáveis da história, espera-se que a humanidade dos inícios do século XXI possa ser lembrada por ter assumido com generosidade as suas graves responsabilidades."}, {"n": 166, "t": "O movimento ecológico mundial já percorreu um longo caminho, enriquecido pelo esforço de muitas organizações da sociedade civil. Não seria possível mencioná-las todas aqui, nem repassar a história das suas contribuições. Mas, graças a tanta dedicação, as questões ambientais têm estado cada vez mais presentes na agenda pública e tornaram-se um convite permanente a pensar a longo prazo. Apesar disso, as cimeiras mundiais sobre o meio ambiente dos últimos anos não corresponderam às expectativas, porque não alcançaram, por falta de decisão política, acordos ambientais globais realmente significativos e eficazes."}, {"n": 167, "t": "Dentre elas, há que recordar a Cimeira da Terra, celebrada em 1992 no Rio de Janeiro. Lá se proclamou que «os seres humanos constituem o centro das preocupações relacionadas com o desenvolvimento sustentável».[126] Retomando alguns conteúdos da Declaração de Estocolmo (1972), sancionou, entre outras coisas, a cooperação internacional no cuidado do ecossistema de toda a terra, a obrigação de quem contaminar assumir economicamente os custos derivados, o dever de avaliar o impacto ambiental de toda e qualquer obra ou projecto. Propôs o objectivo de estabilizar as concentrações de gases com efeito de estufa na atmosfera para inverter a tendência do aquecimento global. Também elaborou uma agenda com um programa de acção e uma convenção sobre biodiversidade, declarou princípios em matéria florestal. Embora tal cimeira marcasse um passo em frente e fosse verdadeiramente profética para a sua época, os acordos tiveram um baixo nível de implementação, porque não se estabeleceram adequados mecanismos de controle, revisão periódica e sanção das violações. Os princípios enunciados continuam a requerer caminhos eficazes e ágeis de realização prática."}, {"n": 168, "t": "Como experiências positivas, pode-se mencionar, por exemplo, a Convenção de Basileia sobre os resíduos perigosos, com um sistema de notificação, níveis estipulados e controles, e também a Convenção vinculante sobre o comércio internacional das espécies da fauna e da flora selvagens ameaçadas de extinção, que prevê missões de verificação do seu efectivo cumprimento. Graças à Convenção de Viena para a protecção da camada de ozono e a respectiva implementação através do Protocolo de Montreal e as suas emendas, o problema da diminuição da referida camada parece ter entrado numa fase de solução."}, {"n": 169, "t": "No cuidado da biodiversidade e no contraste à desertificação, os avanços foram muito menos significativos. Relativamente às mudanças climáticas, os progressos são, infelizmente, muito escassos. A redução de gases com efeito de estufa requer honestidade, coragem e responsabilidade, sobretudo dos países mais poderosos e mais poluentes. A Conferência das Nações Unidas sobre o Desenvolvimento Sustentável, chamada Rio+20 (Rio de Janeiro 2012), emitiu uma Declaração Final extensa mas ineficaz. As negociações internacionais não podem avançar significativamente por causa das posições dos países que privilegiam os seus interesses nacionais sobre o bem comum global. Aqueles que hão-de sofrer as consequências que tentamos dissimular, recordarão esta falta de consciência e de responsabilidade. Durante o período de elaboração desta encíclica, o debate adquiriu particular intensidade. Nós, crentes, não podemos deixar de rezar a Deus pela evolução positiva nos debates actuais, para que as gerações futuras não sofram as consequências de demoras imprudentes."}, {"n": 170, "t": "Algumas das estratégias para a baixa emissão de gases poluentes apostam na internacionalização dos custos ambientais, com o perigo de impor aos países de menores recursos pesados compromissos de redução de emissões comparáveis aos dos países mais industrializados. A imposição destas medidas penaliza os países mais necessitados de desenvolvimento. Assim, acrescenta-se uma nova injustiça sob a capa do cuidado do meio ambiente. Como sempre, a corda quebra pelo ponto mais fraco. Uma vez que os efeitos das mudanças climáticas se farão sentir durante muito tempo, mesmo que agora sejam tomadas medidas rigorosas, alguns países com escassos recursos precisarão de ajuda para se adaptar a efeitos que já estão a produzir-se e afectam as suas economias. É verdade que há responsabilidades comuns, mas diferenciadas, pelo simples motivo —- como disseram os bispos da Bolívia — que «os países que foram beneficiados por um alto grau de industrialização, à custa duma enorme emissão de gases com efeito de estufa, têm maior responsabilidade em contribuir para a solução dos problemas que causaram».[127]"}, {"n": 171, "t": "A estratégia de compra-venda de «créditos de emissão» pode levar a uma nova forma de especulação, que não ajudaria a reduzir a emissão global de gases poluentes. Este sistema parece ser uma solução rápida e fácil, com a aparência dum certo compromisso com o meio ambiente, mas que não implica de forma alguma uma mudança radical à altura das circunstâncias. Pelo contrário, pode tornar-se um diversivo que permite sustentar o consumo excessivo de alguns países e sectores."}, {"n": 172, "t": "Para os países pobres, as prioridades devem ser a erradicação da miséria e o desenvolvimento social dos seus habitantes; ao mesmo tempo devem examinar o nível escandaloso de consumo de alguns sectores privilegiados da sua população e contrastar melhor a corrupção. Sem dúvida, devem também desenvolver formas menos poluentes de produção de energia, mas para isso precisam de contar com a ajuda dos países que cresceram muito à custa da actual poluição do planeta. O aproveitamento directo da energia solar, tão abundante, exige que se estabeleçam mecanismos e subsídios tais, que os países em vias de desenvolvimento possam ter acesso à transferência de tecnologias, assistência técnica e recursos financeiros, mas sempre prestando atenção às condições concretas, pois «nem sempre se avalia adequadamente a compatibilidade dos sistemas com o contexto para o qual são projectados».[128] Os custos seriam baixos se comparados com os riscos das mudanças climáticas. Em todo o caso, trata-se primariamente duma decisão ética, fundada na solidariedade de todos os povos."}, {"n": 173, "t": "Urgem acordos internacionais que se cumpram, dada a escassa capacidade das instâncias locais para intervirem de maneira eficaz. As relações entre os Estados devem salvaguardar a soberania de cada um, mas também estabelecer caminhos consensuais para evitar catástrofes locais que acabariam por danificar a todos. São necessários padrões reguladores globais que imponham obrigações e impeçam acções inaceitáveis, como o facto de empresas ou países poderosos descarregarem, sobre outros países, resíduos e indústrias altamente poluentes."}, {"n": 174, "t": "Mencionemos também o sistema de governança dos oceanos. Com efeito, embora tenha havido várias convenções internacionais e regionais, a fragmentação e a falta de severos mecanismos de regulamentação, controle e sanção acabam por minar todos os esforços. O problema crescente dos resíduos marinhos e da protecção das áreas marinhas para além das fronteiras nacionais continua a representar um desafio especial. Em definitivo, precisamos de um acordo sobre os regimes de governança para toda a gama dos chamados bens comuns globais."}, {"n": 175, "t": "A lógica que dificulta a tomada de decisões drásticas para inverter a tendência ao aquecimento global é a mesma que não permite cumprir o objectivo de erradicar a pobreza. Precisamos duma reacção global mais responsável, que implique enfrentar, contemporaneamente, a redução da poluição e o desenvolvimento dos países e regiões pobres. O século XXI, mantendo um sistema de governança próprio de épocas passadas, assiste a uma perda de poder dos Estados nacionais, sobretudo porque a dimensão económico-financeira, de carácter transnacional, tende a prevalecer sobre a política. Neste contexto, torna-se indispensável a maturação de instituições internacionais mais fortes e eficazmente organizadas, com autoridades designadas de maneira imparcial por meio de acordos entre os governos nacionais e dotadas de poder de sancionar. Como afirmou Bento XVI, na linha desenvolvida até agora pela doutrina social da Igreja, «para o governo da economia mundial, para sanar as economias atingidas pela crise de modo a prevenir o agravamento da mesma e consequentes maiores desequilíbrios, para realizar um oportuno e integral desarmamento, a segurança alimentar e a paz, para garantir a salvaguarda do ambiente e para regulamentar os fluxos migratórios urge a presença de uma verdadeira Autoridade política mundial, delineada já pelo meu predecessor, [São] João XXIII».[129] Nesta perspectiva, a diplomacia adquire uma importância inédita, chamada a promover estratégias internacionais para prevenir os problemas mais graves que acabam por afectar a todos."}, {"h": "2. O diálogo para novas políticas nacionais e locais", "lvl": 1}, {"n": 176, "t": "Há vencedores e vencidos não só entre os países, mas também dentro dos países pobres, onde se devem identificar as diferentes responsabilidades. Por isso, as questões relacionadas com o meio ambiente e com o desenvolvimento económico já não se podem olhar apenas a partir das diferenças entre os países, mas exigem que se preste atenção às políticas nacionais e locais."}, {"n": 177, "t": "Perante a possibilidade duma utilização irresponsável das capacidades humanas, são funções inadiáveis de cada Estado planificar, coordenar, vigiar e sancionar dentro do respectivo território. Como pode a sociedade organizar e salvaguardar o seu futuro num contexto de constantes inovações tecnológicas? Um factor que actua como moderador efectivo é o direito, que estabelece as regras para as condutas permitidas à luz do bem comum. Os limites que uma sociedade sã, madura e soberana deve impor têm a ver com previsão e precaução, regulamentações adequadas, vigilância sobre a aplicação das normas, contraste da corrupção, acções de controle operacional sobre o aparecimento de efeitos não desejados dos processos de produção, e oportuna intervenção perante riscos incertos ou potenciais. Existe uma crescente jurisprudência que visa reduzir os efeitos poluentes dos empreendimentos. Mas a estrutura política e institucional não existe apenas para evitar malversações, mas para incentivar as boas práticas, estimular a criatividade que busca novos caminhos, facilitar as iniciativas pessoais e colectivas."}, {"n": 178, "t": "O drama duma política focalizada nos resultados imediatos, apoiada também por populações consumistas, torna necessário produzir crescimento a curto prazo. Respondendo a interesses eleitorais, os governos não se aventuram facilmente a irritar a população com medidas que possam afectar o nível de consumo ou pôr em risco investimentos estrangeiros. A construção míope do poder frena a inserção duma agenda ambiental com visão ampla na agenda pública dos governos. Esquece-se, assim, que «o tempo é superior ao espaço»[130] e que sempre somos mais fecundos quando temos maior preocupação por gerar processos do que por dominar espaços de poder. A grandeza política mostra-se quando, em momentos difíceis, se trabalha com base em grandes princípios e pensando no bem comum a longo prazo. O poder político tem muita dificuldade em assumir este dever num projecto de nação."}, {"n": 179, "t": "Nalguns lugares, estão a desenvolver-se cooperativas para a exploração de energias renováveis, que consentem o auto-abastecimento local e até mesmo a venda da produção em excesso. Este exemplo simples indica que, enquanto a ordem mundial existente se revela impotente para assumir responsabilidades, a instância local pode fazer a diferença. Com efeito, aqui é possível gerar uma maior responsabilidade, um forte sentido de comunidade, uma especial capacidade de solicitude e uma criatividade mais generosa, um amor apaixonado pela própria terra, tal como se pensa naquilo que se deixa aos filhos e netos. Estes valores têm um enraizamento muito profundo nas populações aborígenes. Dado que o direito por vezes se mostra insuficiente devido à corrupção, requer-se uma decisão política sob pressão da população. A sociedade, através de organismos não-governamentais e associações intermédias, deve forçar os governos a desenvolver normativas, procedimentos e controles mais rigorosos. Se os cidadãos não controlam o poder político — nacional, regional e municipal —, também não é possível combater os danos ambientais. Além disso, as legislações municipais podem ser mais eficazes, se houver acordos entre populações vizinhas para sustentarem as mesmas políticas ambientais."}, {"n": 180, "t": "Não se pode pensar em receitas uniformes, porque há problemas e limites específicos de cada país ou região. Também é verdade que o realismo político pode exigir medidas e tecnologias de transição, desde que estejam acompanhadas pelo projecto e a aceitação de compromissos graduais vinculativos. Ao mesmo tempo, porém, a nível nacional e local, há sempre muito que fazer, como, por exemplo, promover formas de poupança energética. Isto implica favorecer modalidades de produção industrial com a máxima eficiência energética e menor utilização de matérias-primas, retirando do mercado os produtos pouco eficazes do ponto de vista energético ou mais poluentes. Podemos mencionar também uma boa gestão dos transportes ou técnicas de construção e restruturação de edifícios que reduzam o seu consumo energético e o seu nível de poluição. Além disso, a acção política local pode orientar-se para a alteração do consumo, o desenvolvimento duma economia de resíduos e reciclagem, a protecção de determinadas espécies e a programação duma agricultura diversificada com a rotação de culturas. É possível favorecer a melhoria agrícola de regiões pobres, através de investimentos em infra-estruturas rurais, na organização do mercado local ou nacional, em sistemas de irrigação, no desenvolvimento de técnicas agrícolas sustentáveis. Podem-se facilitar formas de cooperação ou de organização comunitária que defendam os interesses dos pequenos produtores e salvaguardem da predação os ecossistemas locais. É tanto o que se pode fazer!"}, {"n": 181, "t": "Indispensável é a continuidade, porque não se podem modificar as políticas relativas às alterações climáticas e à protecção ambiental todas as vezes que muda um governo. Os resultados requerem muito tempo e comportam custos imediatos com efeitos que não poderão ser exibidos no período de vida dum governo. Por isso, sem a pressão da população e das instituições, haverá sempre relutância a intervir, e mais ainda quando houver urgências a resolver. Para um político, assumir estas responsabilidades com os custos que implicam não corresponde à lógica eficientista e imediatista actual da economia e da política, mas, se ele tiver a coragem de o fazer, poderá novamente reconhecer a dignidade que Deus lhe deu como pessoa e deixará, depois da sua passagem por esta história, um testemunho de generosa responsabilidade. Importa dar um lugar preponderante a uma política salutar, capaz de reformar as instituições, coordená-las e dotá-las de bons procedimentos, que permitam superar pressões e inércias viciosas. Todavia é preciso acrescentar que os melhores dispositivos acabam por sucumbir, quando faltam as grandes metas, os valores, uma compreensão humanista e rica de significado, capazes de conferir a cada sociedade uma orientação nobre e generosa."}, {"h": "3. Diálogo e transparência nos processos decisórios", "lvl": 1}, {"n": 182, "t": "A previsão do impacto ambiental dos empreendimentos e projectos requer processos políticos transparentes e sujeitos a diálogo, enquanto a corrupção, que esconde o verdadeiro impacto ambiental dum projecto em troca de favores, frequentemente leva a acordos ambíguos que fogem ao dever de informar e a um debate profundo."}, {"n": 183, "t": "Um estudo de impacto ambiental não deveria ser posterior à elaboração dum projecto produtivo ou de qualquer política, plano ou programa. Há-de inserir-se desde o princípio e elaborar-se de forma interdisciplinar, transparente e independente de qualquer pressão económica ou política. Deve aparecer unido à análise das condições de trabalho e dos possíveis efeitos na saúde física e mental das pessoas, na economia local, na segurança. Assim os resultados económicos poder-se-ão prever de forma mais realista, tendo em conta os cenários possíveis e, eventualmente, antecipando a necessidade dum investimento maior para resolver efeitos indesejáveis que possam ser corrigidos. É sempre necessário alcançar consenso entre os vários actores sociais, que podem trazer diferentes perspectivas, soluções e alternativas. Mas, no debate, devem ter um lugar privilegiado os moradores locais, aqueles mesmos que se interrogam sobre o que desejam para si e para os seus filhos e podem ter em consideração as finalidades que transcendem o interesse económico imediato. É preciso abandonar a ideia de «intervenções» sobre o meio ambiente, para dar lugar a políticas pensadas e debatidas por todas as partes interessadas. A participação requer que todos sejam adequadamente informados sobre os vários aspectos e os diferentes riscos e possibilidades, e não se reduza à decisão inicial sobre um projecto, mas implique também acções de controle ou monitoramento constante. É necessário haver sinceridade e verdade nas discussões científicas e políticas, sem se limitar a considerar o que é permitido ou não pela legislação."}, {"n": 184, "t": "Quando surgem eventuais riscos para o meio ambiente que afectam o bem comum presente e futuro, esta situação exige «que as decisões sejam baseadas num confronto entre riscos e benefícios previsíveis para cada opção alternativa possível».[131] Isto vale sobretudo quando um projecto pode causar um incremento na exploração dos recursos naturais, nas emissões ou descargas, na produção de resíduos, ou então uma mudança significativa na paisagem, no habitat de espécies protegidas ou num espaço público. Alguns projectos, não apoiados por uma análise bem cuidada, podem afectar profundamente a qualidade de vida dum lugar, devido a questões muito diferentes entre si, como, por exemplo, uma poluição acústica não prevista, a redução do horizonte visual, a perda de valores culturais, os efeitos do uso da energia nuclear. A cultura consumista, que dá prioridade ao curto prazo e aos interesses privados, pode favorecer análises demasiado rápidas ou consentir a ocultação de informação."}, {"n": 185, "t": "Em qualquer discussão sobre um empreendimento, dever-se-ia pôr uma série de perguntas, para poder discernir se o mesmo levará a um desenvolvimento verdadeiramente integral: Para que fim? Por qual motivo? Onde? Quando? De que maneira? A quem ajuda? Quais são os riscos? A que preço? Quem paga as despesas e como o fará? Neste exame, há questões que devem ter prioridade. Por exemplo, sabemos que a água é um recurso escasso e indispensável, sendo um direito fundamental que condiciona o exercício doutros direitos humanos. Isto está, sem dúvida, acima de toda a análise de impacto ambiental duma região."}, {"n": 186, "t": "Na Declaração do Rio, de 1992, afirma-se que, «quando existem ameaças de danos graves ou irreversíveis, a falta de certezas científicas absolutas não poderá constituir um motivo para adiar a adopção de medidas eficazes»[132] que impeçam a degradação do meio ambiente. Este princípio de precaução permite a protecção dos mais fracos, que dispõem
