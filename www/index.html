/* ---------- share / copy ---------- */
function citation(k,excerpt){const {p,s,n}=parseKey(k);let t=curly(stripNotes(excerpt||textOf(p,s,n))).trim();
  return `${t}\n— ${refLong(p,s,n)}`}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){};ta.remove();return ok}}
async function shareText(t){
  try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;
    if(P){await P.share({text:t,dialogTitle:'Compartilhar citação'});return}
    if(navigator.share){await navigator.share({text:t});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  if(await copyText(t))toast('Citação copiada para compartilhar');
}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2000)}

/* ---------- sheet ---------- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),sbody=document.getElementById('sheetbody');
let sheetOpen=false,onSheetClose=null;
function openSheet(html,onClose){sbody.innerHTML=html;sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');sheetOpen=true;onSheetClose=onClose||null;history.pushState({sheet:1},'');setTimeout(()=>{const f=sheet.querySelector('button');f&&f.focus({preventScroll:true})},50)}
function closeSheet(fromPop){if(!sheetOpen)return;sheet.classList.remove('on');scrim.classList.remove('on');sheetOpen=false;onSheetClose&&onSheetClose();onSheetClose=null;if(!fromPop)history.back()}
scrim.addEventListener('click',()=>closeSheet());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('popstate',()=>{if(sheetOpen)closeSheet(true)});

function verseSheet(k,el){
  const {p,s,n}=parseKey(k);const fav=isFav(k);const it=itemOf(p,s,n);
  openSheet(`<p class="pv"${it.poem?' style="white-space:pre-line"':''}>${fmtText(it.t).replace(/<button class="fn"[^>]*>\d+<\/button>/g,'')}</p><div class="pvref">${refShort(p,s,n)}</div>
  <div class="row">
    <button data-sa="fav" class="${fav?'on':''}"><svg class="ic"><use href="#i-mark${fav?'f':''}"/></svg>${fav?'Remover':'Guardar'}</button>
    <button data-sa="copy"><svg class="ic"><use href="#i-copy"/></svg>Copiar</button>
    <button data-sa="share"><svg class="ic"><use href="#i-share"/></svg>Compartilhar</button>
  </div>`,()=>el&&el.classList.remove('sel'));
  sbody.onclick=async e=>{const a=e.target.closest('[data-sa]');if(!a)return;
    if(a.dataset.sa==='fav'){toggleFav(k);closeSheet()}
    if(a.dataset.sa==='copy'){closeSheet();if(await copyText(citation(k)))toast('Citação copiada')}
    if(a.dataset.sa==='share'){closeSheet();shareText(citation(k))}};
}
function noteSheet(n){openSheet(`<div class="notelbl">Nota ${n}</div><p class="note">${esc(curly(NOTES[n]||''))}</p>`);sbody.onclick=null}
function controlsHTML(){
  return `<div class="setgroup"><h3>Aparência</h3>
   <div class="opts two">${['claro','escuro'].map(t=>`<button class="opt tp-${t}" data-th="${t}" aria-pressed="${settings.theme===t}"><span class="sw"></span>${{claro:'Claro',escuro:'Escuro'}[t]}</button>`).join('')}</div></div>
   <div class="setgroup"><h3>Tamanho do texto</h3>
   <div class="opts three">${Object.entries(SIZES).map(([k,v])=>`<button class="opt sz" data-sz="${k}" aria-pressed="${settings.size===k}"><span class="aa" style="font-size:${v.px+3}px">Aa</span>${v.label}</button>`).join('')}</div>
   <p class="sample">Louvado sejas, meu Senhor, pela nossa irmã, a mãe terra.</p></div>`}
function handleControls(e,redraw){const t=e.target.closest('[data-th]'),z=e.target.closest('[data-sz]');
  if(t){settings.theme=t.dataset.th;applySettings();redraw()}
  if(z){settings.size=z.dataset.sz;applySettings();redraw()}}
function settingsSheet(){const draw=()=>{sbody.innerHTML=controlsHTML()};openSheet('');draw();sbody.onclick=e=>handleControls(e,draw)}
function renderSettings(){const el=document.getElementById('setbody');
  const draw=()=>{el.innerHTML=controlsHTML()+`<div class="setgroup"><h3>Sobre</h3><p class="about">Escritos de Santa Ângela Merici na tradução das Religiosas Ursulinas da União Romana. Laudato Si’ na versão em português publicada pela Santa Sé (vatican.va).</p></div>`};
  draw();el.onclick=e=>handleControls(e,draw)}

/* ---------- home (shelf) ---------- */
function dayIndex(){const d=new Date();const st=new Date(d.getFullYear(),0,0);return Math.floor((d-st)/864e5)+d.getFullYear()*366}
function prettyQuote(t){t=curly(stripNotes(t)).trim().replace(/[,;:]$/,'.');if(!/[.!?”»]$/.test(t))t+='.';return t.charAt(0).toUpperCase()+t.slice(1)}
function renderHome(){
  const D=EXTRA.daily[dayIndex()%EXTRA.daily.length];const k=D.k;const {p,s,n}=parseKey(k);const fav=isFav(k);
  document.getElementById('today').innerHTML=`<p class="lbl">Palavra de hoje</p>
   <blockquote>${esc(prettyQuote(D.x||textOf(p,s,n)))}</blockquote>
   <div class="foot"><a class="ref" href="#/ler/${p}/${s}/${n}">${refShort(p,s,n)}</a>
   <div class="acts"><button class="iconbtn" data-today="fav" aria-label="${fav?'Remover das guardadas':'Guardar citação'}"><svg class="ic"><use href="#i-mark${fav?'f':''}"/></svg></button>
   <button class="iconbtn" data-today="share" aria-label="Compartilhar citação"><svg class="ic"><use href="#i-share"/></svg></button></div></div>`;
  document.getElementById('today').onclick=e=>{const a=e.target.closest('[data-today]');if(!a)return;
    if(a.dataset.today==='fav'){toggleFav(k);renderHome()}else shareText(citation(k,D.x))};
  const last=store.get('last',null);const c=document.getElementById('continue');
  if(last&&last.p&&sec(last.p,last.s)){const S=sec(last.p,last.s);const n=last.n&&S.byN[last.n]?last.n:S.items.find(i=>i.n).n;
    c.innerHTML=`<button class="continue" data-go="#/ler/${last.p}/${last.s}/${n}"><div class="t"><b>Continuar a leitura</b><span>${VOL[PARTS[last.p].vol].title}: ${S.title}, ${refShort(last.p,last.s,n)}</span></div><svg class="ic"><use href="#i-next"/></svg></button>`}
  else c.innerHTML='';
  document.getElementById('shelf').innerHTML=VOLS.map(V=>`<button class="book-btn" data-go="#/livro/${V.id}" aria-label="Abrir ${V.full}">${V.cover}</button>`).join('');
  document.getElementById('shelflbl').innerHTML=VOLS.map(V=>`<button class="book-meta" data-go="#/livro/${V.id}" tabindex="-1" aria-hidden="true"><b>${V.title}</b><span>${V.author}</span></button>`).join('');
}

/* ---------- book page ---------- */
function range(S){const ns=S.items.filter(i=>i.n&&/^\d+$/.test(i.n)).map(i=>+i.n);return ns.length?`${ns[0]}–${ns[ns.length-1]}`:''}
function renderBook(id){
  const V=VOL[id];if(!V){location.hash='#/';return}
  document.getElementById('bk-where').textContent=V.full;
  let h=`<header class="bookhead">${V.cover}<div><h1>${V.title}</h1><div class="by">${V.author}</div></div></header>`;
  if(id==='escritos'){
    h+=['rec','leg'].map(pid=>{const B=PARTS[pid];return `<section class="book"><h2>${B.title}</h2><div class="to">${B.to}</div><p>${B.blurb}</p>
     <div class="secs">${B.sections.map(S=>`<button data-go="#/ler/${B.id}/${S.id}" class="${S.id==='p'||S.id==='u'?'wide':''}" aria-label="${S.title}">${S.id==='p'?'Prólogo':S.id==='u'?(B.id==='rec'?'Última':'Último'):S.short}</button>`).join('')}</div></section>`}).join('');
    h+=`<button class="linkrow" data-go="#/advertencia">Advertência das tradutoras<svg class="ic"><use href="#i-next"/></svg></button>`;
  } else {
    h+=`<p class="bookintro">Carta encíclica do Papa Francisco sobre o cuidado da casa comum, assinada em 24 de maio de 2015.</p><div class="toc">`+
      PARTS.ls.sections.map(S=>`<button data-go="#/ler/ls/${S.id}"><div>${S.sub?`<small>${S.title}</small><span>${S.sub}</span>`:`<span>${S.title}</span>`}</div><em>${range(S)}</em></button>`).join('')+`</div>`;
  }
  document.getElementById('bookbody').innerHTML=h;
}

/* ---------- reader ---------- */
let cur=null,obs=null;
function renderReader(p,s,n){
  const P=PARTS[p],S=sec(p,s);if(!S){location.hash='#/';return}
  const changed=!cur||cur.p!==p||cur.s!==s;cur={p,s};
  if(changed){
    const V=VOL[P.vol];
    document.getElementById('rd-book').textContent=p==='ls'?V.full:`${P.title} ${P.to}`;
    document.getElementById('rd-title').textContent=S.title;
    document.getElementById('rd-sub').textContent=S.sub||'';
    document.getElementById('where').textContent=p==='ls'?`Laudato Si’: ${S.title}`:`${P.title}: ${S.title}`;
    const box=document.getElementById('rd-verses');box.classList.toggle('long',p==='ls');
    box.innerHTML=S.items.map(it=>{
      if(it.h)return it.lvl===1?`<h3>${esc(it.h)}</h3>`:`<h4>${esc(it.h)}</h4>`;
      if(it.sign)return `<p class="signoff">${esc(it.sign)}<b>${esc(it.by)}</b></p>`;
      const k=keyOf(p,s,it.n);
      return `<div class="v${it.poem?' poem':''}${isFav(k)?' saved':''}" data-k="${k}" id="v${it.n}" tabindex="0" role="button" aria-label="${it.poem?'Estrofe':'Parágrafo '+it.n}. Toque para opções"><span class="n">${it.poem?'':it.n}</span><p class="tx">${it.poem?it.t.split('\n').map(l=>`<span class="ln">${esc(l)}</span>`).join(''):fmtText(it.t)}</p></div>`}).join('');
    const prev=P.sections[S.idx-1],next=P.sections[S.idx+1];
    const lbl=x=>x.sub?`${x.title}`:x.title;
    document.getElementById('rd-pager').innerHTML=(prev?`<button data-go="#/ler/${p}/${prev.id}"><small>Anterior</small><span>${lbl(prev)}</span></button>`:'')+(next?`<button class="next" data-go="#/ler/${p}/${next.id}"><small>Próxima</small><span>${lbl(next)}</span></button>`:'');
    setupObserver(p,s);
  }
  requestAnimationFrame(()=>{
    const el=n&&document.getElementById('v'+n);
    if(el){const y=el.getBoundingClientRect().top+scrollY-110;scrollTo({top:Math.max(0,y)});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
    else if(changed)scrollTo({top:0});
  });
  store.set('last',{p,s,n:n||(S.items.find(i=>i.n)||{}).n});
}
function setupObserver(p,s){
  obs&&obs.disconnect();let tm;
  obs=new IntersectionObserver(()=>{clearTimeout(tm);tm=setTimeout(()=>{if(!cur||cur.p!==p||cur.s!==s)return;
    const top=[...document.querySelectorAll('#rd-verses .v')].find(el=>el.getBoundingClientRect().bottom>90);
    if(top)store.set('last',{p,s,n:top.id.slice(1)})},400)},{threshold:[0,1]});
  document.querySelectorAll('#rd-verses .v').forEach(el=>obs.observe(el));
}
document.getElementById('rd-verses').addEventListener('click',e=>{
  const f=e.target.closest('.fn');if(f){e.stopPropagation();noteSheet(f.dataset.fn);return}
  const el=e.target.closest('.v');if(!el)return;
  if(getSelection&&String(getSelection()).length>2)return;
  el.classList.add('sel');verseSheet(el.dataset.k,el)});
document.getElementById('rd-verses').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('v')){e.preventDefault();e.target.click()}});
addEventListener('scroll',()=>{document.querySelectorAll('.readbar').forEach(r=>r.classList.toggle('scrolled',scrollY>60))},{passive:true});

document.getElementById('adv').innerHTML=EXTRA.adv.map(x=>x.h?`<h3>${x.h}</h3>`:x.h2?`<h4>${x.h2}</h4>`:x.sign?`<p class="sign">${x.sign}</p>`:`<p>${x.p}</p>`).join('');

/* ---------- search ---------- */
const INDEX=[];Object.values(PARTS).forEach(P=>P.sections.forEach(S=>S.items.forEach(it=>{if(it.n){const t=stripNotes(it.t);INDEX.push({p:P.id,vol:P.vol,s:S.id,n:it.n,t,f:fold(t)})}})));
const THEMES=[
 ['Amor',['amor','amar','ama,','amem','amarem','amado']],['Unidade',['unid','concordia','um so coracao','um so querer','juntas']],
 ['Esperança',['esperanc','esperem','espere']],['Casa comum',['casa comum']],['Criação',['criacao','criatura']],['Pobres',['pobre']],
 ['Cuidado',['cuidar','cuidado']],['Humildade',['humild','humilh']],['Caridade',['caridade']],['Oração',['oracao','oracoes','rezem','rezar','clamem','louvado']],
 ['Mansidão',['suave','afave','ternura','meiga','mitis']],['Liberdade',['livre arbitrio','forcar ninguem','querer forcar','te forco','liberdade']],
 ['Alegria',['alegria','regozij','rejubil','jubilo']],['Água',['agua']],['Jesus Cristo',['jesus cristo','jesus','amado']],['Maria',['madona','maria']],
 ['Paz',['paz']],['Conversão',['conversao','converter']]
];
let scope='all',themeActive=null;
const qEl=document.getElementById('q'),sres=document.getElementById('sresults'),sbox=document.getElementById('sbox');
const isW=c=>c&&/[a-z0-9]/.test(c);
function occ(f,term){const r=[];let i=0;while((i=f.indexOf(term,i))>-1){if(!isW(f[i-1]))r.push(i);i+=1}return r}
const has=(f,t)=>occ(f,t).length>0;
function highlight(t,terms){
  const f=fold(t);const marks=[];terms.forEach(term=>{if(term)occ(f,term).forEach(i=>marks.push([i,i+term.length]))});
  if(!marks.length)return esc(curly(t));
  marks.sort((a,b)=>a[0]-b[0]);const m=[];marks.forEach(r=>{const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push(r.slice())});
  let out='',p=0;m.forEach(([a,b])=>{out+=esc(t.slice(p,a))+'<mark>'+esc(t.slice(a,b))+'</mark>';p=b});out+=esc(t.slice(p));
  return out.replace(/"([^"]*)"/g,'“$1”');
}
function snippet(t,terms){ // trim long paragraphs around first match
  if(t.length<420)return highlight(t,terms);
  const f=fold(t);let first=Infinity;terms.forEach(x=>{const o=occ(f,x);if(o.length)first=Math.min(first,o[0])});
  if(first===Infinity)first=0;let a=Math.max(0,first-140);if(a>0){const sp=t.indexOf(' ',a);a=sp>0?sp+1:a}
  let b=Math.min(t.length,a+380);if(b<t.length){const sp=t.lastIndexOf(' ',b);b=sp>a?sp:b}
  return (a>0?'… ':'')+highlight(t.slice(a,b),terms)+(b<t.length?' …':'');
}
function parseRefQuery(q){
  const f=fold(q).trim();
  let m=f.match(/^(ls|laudato si'?|laudato si’)\s*,?\s*(\d{1,3})$/);
  if(m){const n=m[2];const S=PARTS.ls.sections.find(S=>S.byN[n]);return S?{p:'ls',s:S.id,n}:null}
  m=f.match(/^(rec|recomendac\w*|leg|legado\w*|test\w*)\s*(prol\w*|ult\w*|\d+)?\s*[,:. ]?\s*(\d+)?$/);
  if(!m)return null;const p=/^rec/.test(m[1])?'rec':'leg';
  const s=m[2]?(/^p/.test(m[2])?'p':/^u/.test(m[2])?'u':m[2]):null;
  if(!s||!sec(p,s))return null;const n=m[3]&&sec(p,s).byN[m[3]]?m[3]:null;return {p,s,n};
}
function resultRow(x,terms){const S=sec(x.p,x.s);const where=x.p==='ls'?(S.sub?S.title:S.title):S.title;
  return `<button class="res" data-go="#/ler/${x.p}/${x.s}/${x.n}"><div class="r">${refShort(x.p,x.s,x.n)} <em>${where}</em></div><div class="q">${terms?snippet(x.t,terms):esc(curly(x.t.length>420?x.t.slice(0,x.t.lastIndexOf(' ',380))+' …':x.t))}</div></button>`}
function runSearch(raw,themeTerms){
  const q=raw.trim();sbox.classList.toggle('has',!!q);
  if(!q&&!themeTerms){renderThemes();return}
  let terms,mode='and';
  if(themeTerms){terms=themeTerms.map(fold);mode='or'}
  else{
    const r=parseRefQuery(q);
    if(r){const S=sec(r.p,r.s);const n=r.n||S.items.find(i=>i.n).n;const x=INDEX.find(x=>x.p===r.p&&x.s===r.s&&x.n===n);
      sres.innerHTML=`<div class="results"><p class="count">Referência</p>${resultRow(x)}</div>`;return}
    const phrases=[];const rest=fold(q).replace(/"([^"]+)"|“([^”]+)”/g,(_,a,b)=>{phrases.push((a||b).trim());return ' '});
    terms=phrases.concat(rest.split(/\s+/).filter(w=>w.length>1));
    if(!terms.length){renderThemes();return}
  }
  const hits=INDEX.filter(x=>(scope==='all'||x.vol===scope)&&(mode==='and'?terms.every(t=>has(x.f,t)):terms.some(t=>has(x.f,t))));
  if(!hits.length){sres.innerHTML=`<p class="empty">Nenhuma citação encontrada para “${esc(q)}”${scope!=='all'?' neste livro':''}. Tente outra palavra${scope!=='all'?' ou busque em toda a estante':''}.</p>`;return}
  sres.innerHTML=`<div class="results"><p class="count">${hits.length} ${hits.length===1?'citação':'citações'}</p>`+hits.slice(0,300).map(x=>resultRow(x,terms)).join('')+'</div>';
}
function renderThemes(){sres.innerHTML=`<div class="themes"><h3>Temas</h3><div class="chips">${THEMES.map((t,i)=>`<button data-theme-i="${i}">${t[0]}</button>`).join('')}</div>
  <p class="empty" style="font-size:17px">Busque por palavras (“caridade”, “casa comum”), por uma frase entre aspas ou por referência, como Rec 5,31, Leg Últ 12 ou LS 49.</p></div>`}
let deb;qEl.addEventListener('input',()=>{themeActive=null;clearTimeout(deb);deb=setTimeout(()=>runSearch(qEl.value),120)});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')qEl.blur()});
document.getElementById('qclear').onclick=()=>{qEl.value='';themeActive=null;runSearch('');qEl.focus()};
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('[data-scope]');if(!b)return;scope=b.dataset.scope;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));runSearch(qEl.value,themeActive)};
sres.addEventListener('click',e=>{const t=e.target.closest('[data-theme-i]');if(!t)return;const th=THEMES[+t.dataset.themeI];
  qEl.value=th[0];themeActive=th[1];runSearch(th[0],th[1])});

/* ---------- saved ---------- */
function renderSaved(){
  const el=document.getElementById('savedlist');
  const list=favs.filter(k=>{const {p,s,n}=parseKey(k);return itemOf(p,s,n)});
  if(!list.length){el.innerHTML=`<p class="empty">Ainda não há citações guardadas. Durante a leitura, toque em um trecho e escolha Guardar.</p>`;return}
  el.innerHTML=`<p class="count" style="font-size:15px;color:var(--muted);margin:0 0 6px">${list.length} ${list.length===1?'citação':'citações'}</p>`+list.map(k=>{const {p,s,n}=parseKey(k);const t=stripNotes(textOf(p,s,n));
    return `<div class="savedrow"><button class="open res" style="border:0;padding:0" data-go="#/ler/${p}/${s}/${n}"><div class="r">${refShort(p,s,n)} <em>${VOL[PARTS[p].vol].title}</em></div><div class="q" style="white-space:pre-line">${esc(curly(t))}</div></button>
    <div><button class="iconbtn" data-share="${k}" aria-label="Compartilhar"><svg class="ic"><use href="#i-share"/></svg></button><button class="iconbtn" data-unfav="${k}" aria-label="Remover das guardadas"><svg class="ic"><use href="#i-x"/></svg></button></div></div>`}).join('');
}
document.getElementById('savedlist').addEventListener('click',e=>{const u=e.target.closest('[data-unfav]'),s=e.target.closest('[data-share]');
  if(u){toggleFav(u.dataset.unfav);renderSaved()}if(s)shareText(citation(s.dataset.share))});

/* ---------- routing ---------- */
const views=['home','book','read','adv','search','saved','settings'];
function show(v,tab){views.forEach(x=>document.getElementById('v-'+x).classList.toggle('on',x===v));
  document.getElementById('tabbar').classList.toggle('hide',!tab);
  document.querySelectorAll('.tabbar a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
let prevRoute='',navCount=0;
function route(){
  if(sheetOpen)closeSheet(true);
  const h=location.hash.replace(/^#\/?/,'');const a=h.split('/');
  if(a[0]==='ler'){show('read',null);renderReader(a[1],a[2],a[3]?decodeURIComponent(a[3]):null)}
  else{cur=null;
    if(a[0]==='livro'){show('book',null);renderBook(a[1]);scrollTo(0,0)}
    else if(a[0]==='busca'){show('search','search');if(!qEl.value)renderThemes();scrollTo(0,0)}
    else if(a[0]==='guardadas'){show('saved','saved');renderSaved();scrollTo(0,0)}
    else if(a[0]==='advertencia'){show('adv',null);scrollTo(0,0)}
    else if(a[0]==='ajustes'){show('settings','settings');renderSettings();scrollTo(0,0)}
    else{show('home','home');renderHome();if(prevRoute)document.getElementById('today').classList.remove('intro');scrollTo(0,0)}
  }
  prevRoute=h||'home';
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='settings')settingsSheet();
  if(a.dataset.act==='back'){if(navCount>0)history.back();else location.hash='#/'}
});
window.addEventListener('hashchange',()=>{navCount++;route()});
/* migrate old saved keys (rec/leg) — same format, nothing to do */
applySettings();route();
</script>
