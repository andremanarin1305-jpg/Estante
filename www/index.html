:root{
  --fs:19px;
  --sans:'Alegreya Sans',system-ui,sans-serif;
  --serif:'Alegreya',Georgia,serif;
  --safe-t:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  --safe-b:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --col:640px;
}
[data-theme=claro]{--bg:#EEF0EC;--surface:#F8F9F6;--ink:#1D2230;--muted:#5C6270;--rule:#D3D7CF;--rubric:#A3262A;--lapis:#2C4A8A;--tint:rgba(44,74,138,.10);--mark:rgba(163,38,42,.14)}
[data-theme=sepia]{--bg:#EFE4CF;--surface:#F7EEDD;--ink:#35291D;--muted:#76664F;--rule:#D9C9AC;--rubric:#9A2B22;--lapis:#3A5788;--tint:rgba(58,87,136,.12);--mark:rgba(154,43,34,.16)}
[data-theme=escuro]{--bg:#12151C;--surface:#1A1E27;--ink:#DCE0E8;--muted:#8D94A3;--rule:#2A303C;--rubric:#E5806F;--lapis:#93ABE2;--tint:rgba(147,171,226,.13);--mark:rgba(229,128,111,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:3px;border-radius:6px}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.page{max-width:var(--col);margin:0 auto;padding:calc(var(--safe-t) + 20px) 22px calc(var(--safe-b) + 96px)}
.page.reading{padding-bottom:calc(var(--safe-b) + 40px)}
.view{display:none}.view.on{display:block}

/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.iconbtn:active{background:var(--tint)}
.readbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:calc(-1 * (var(--safe-t) + 20px)) -22px 0;padding:calc(var(--safe-t) + 6px) 10px 6px;border-bottom:1px solid transparent;transition:border-color .2s}
.readbar.scrolled{border-bottom-color:var(--rule)}
.readbar .where{flex:1;min-width:0;text-align:center;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.readbar.scrolled .where{opacity:1}

/* home */
.masthead{margin:8px 0 34px}
.masthead .who{font-size:16px;color:var(--muted);letter-spacing:.01em}
.masthead h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:58px;line-height:.95;margin:2px 0 0;letter-spacing:-.01em}
.today{margin:0 0 40px}
.today .lbl{font-size:15px;color:var(--muted);margin:0 0 12px}
.today blockquote{margin:0;font-family:var(--serif);font-size:24px;line-height:1.42}
.today blockquote::first-letter{float:left;font-weight:700;font-style:normal;color:var(--rubric);font-size:3.05em;line-height:.86;margin:.06em .1em 0 0}
.today .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ref{font-family:var(--sans);font-weight:500;font-size:15px;color:var(--lapis);text-decoration:none;padding:6px 0}
.acts{display:flex;gap:2px;margin-right:-10px}
@media (prefers-reduced-motion:no-preference){
  .today.intro blockquote::first-letter{animation:ink 1.1s ease-out both}
  .today.intro blockquote{animation:rise .9s .15s ease-out both}
}
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.continue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin:0 0 40px;background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.continue .t{flex:1;min-width:0}
.continue .t b{display:block;font-weight:500;font-size:16px}
.continue .t span{color:var(--muted);font-size:15px}
.continue svg{color:var(--lapis)}

.book{padding:26px 0 30px;border-top:1px solid var(--rule)}
.book h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:34px;line-height:1.05;margin:0}
.book .to{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--muted);margin:2px 0 10px}
.book p{margin:0 0 18px;color:var(--muted);font-size:16px;max-width:34em}
.secs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.secs button{aspect-ratio:1/1;border-radius:12px;background:var(--surface);border:1px solid var(--rule);font-family:var(--serif);font-size:19px;display:grid;place-items:center}
.secs button:active{background:var(--tint)}
.secs button.wide{grid-column:span 2;aspect-ratio:auto;font-style:italic}
.linkrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 0;border-top:1px solid var(--rule);font-family:var(--serif);font-style:italic;font-size:21px;text-align:left}
.linkrow svg{color:var(--muted)}
.credit{color:var(--muted);font-size:14px;margin:18px 0 0;max-width:30em}

/* reader */
.sechead{margin:18px 0 26px}
.sechead .bk{font-size:16px;color:var(--muted)}
.sechead h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:38px;line-height:1.05;margin:2px 0 0}
.verses{font-family:var(--serif);font-size:var(--fs);line-height:1.62}
.v{display:grid;grid-template-columns:1.25em 1fr;column-gap:.6em;padding:.16em .5em .16em .2em;margin:0 -.5em 0 -.45em;border-radius:10px;cursor:pointer;position:relative;transition:background .25s}
.v .n{font-family:var(--sans);font-weight:500;font-size:.68em;color:var(--rubric);text-align:right;padding-top:.36em;user-select:none}
.v .tx{margin:0}
.v.sel{background:var(--tint)}
.v.saved .n::before{content:"";display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--lapis);margin-right:.35em;vertical-align:.12em}
.v.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,35%{background:var(--mark)}100%{background:transparent}}
.lat{font-style:italic}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.pager button{text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--rule);background:var(--surface);min-height:72px}
.pager button.next{text-align:right;grid-column:2}
.pager small{display:block;color:var(--muted);font-size:14px}
.pager span{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.2}

.prose{font-family:var(--serif);font-size:var(--fs);line-height:1.62}
.prose p{margin:0 0 1em;text-indent:1.2em}
.prose h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.3em;margin:1.6em 0 .5em;line-height:1.2}
.prose h4{font-family:var(--sans);font-weight:700;font-size:.85em;margin:1.3em 0 .4em;color:var(--rubric)}
.prose .sign{text-align:right;font-style:italic;color:var(--muted)}

/* search */
.title2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:40px;line-height:1;margin:8px 0 18px}
.searchbox{position:relative}
.searchbox input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 46px 14px 46px;outline:none;-webkit-appearance:none;appearance:none}
.searchbox input:focus{border-color:var(--lapis)}
.searchbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:22px;height:22px}
.searchbox .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none}
.searchbox.has .clear{display:grid}
.seg{display:flex;gap:6px;margin:12px 0 0}
.seg button{padding:8px 14px;border-radius:999px;border:1px solid var(--rule);font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.themes{margin-top:30px}
.themes h3,.count{font-size:15px;color:var(--muted);font-weight:400;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-family:var(--serif);font-style:italic;font-size:19px;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--rule)}
.chips button:active{background:var(--tint)}
.results{margin-top:24px}
.res{display:block;width:100%;text-align:left;padding:16px 0;border-top:1px solid var(--rule)}
.res .r{font-weight:500;color:var(--lapis);font-size:15px}
.res .r em{font-style:normal;color:var(--muted);font-weight:400}
.res .q{font-family:var(--serif);font-size:18px;line-height:1.5;margin-top:4px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;margin:28px 0;max-width:24em}

.savedrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border-top:1px solid var(--rule);padding:14px 0}
.savedrow .open{text-align:left}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding-bottom:var(--safe-b)}
.tabbar nav{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:13px}
.tabbar a[aria-current=page]{color:var(--ink)}
.tabbar a[aria-current=page] .ic{stroke-width:2.1}
.tabbar.hide{display:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:var(--col);margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 22px calc(var(--safe-b) + 22px);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.sheet.on{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 14px}
.sheet .pv{font-family:var(--serif);font-size:19px;line-height:1.5;margin:0 0 6px}
.sheet .pvref{color:var(--lapis);font-weight:500;font-size:15px;margin-bottom:16px}
.sheet .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet .row button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:14px;background:var(--bg);font-size:15px}
.sheet .row button.on{color:var(--lapis)}
.sheet h3{font-size:15px;color:var(--muted);font-weight:400;margin:6px 0 10px}
.sizer{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sizer button{width:52px;height:46px;border-radius:12px;background:var(--bg);font-family:var(--serif)}
.sizer .sample{flex:1;text-align:center;font-family:var(--serif);font-size:var(--fs)}
.themepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.themepick button{padding:14px 6px;border-radius:12px;border:2px solid transparent;font-family:var(--serif);font-size:17px}
.themepick button[aria-pressed=true]{border-color:var(--lapis)}
.tp-claro{background:#EEF0EC;color:#1D2230}.tp-sepia{background:#EFE4CF;color:#35291D}.tp-escuro{background:#12151C;color:#DCE0E8}
.about{color:var(--muted);font-size:14px;line-height:1.5;margin:0}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:700px){.masthead h1{font-size:72px}.secs{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- shelf ---- */
.shelf{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:0 6px;margin:6px 0 0}
.shelf::after{content:"";position:absolute;left:-10px;right:-10px;bottom:-12px;height:12px;border-radius:2px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);box-shadow:0 10px 18px -12px rgba(0,0,0,.35)}
.book-btn{display:block;text-align:left;width:100%}
.cover{position:relative;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),6px 8px 16px -8px rgba(0,0,0,.45);transition:transform .2s}
.book-btn:active .cover{transform:translateY(-4px)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.08) 60%,rgba(0,0,0,.05));z-index:2}
.cover .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:16% 12% 12% 16%}
.cv-esc{background:#ECE5D6;color:#2A2620}
.cv-esc .frame{position:absolute;inset:7% 7% 7% 10%;border:1px solid #A3262A;outline:1px solid #A3262A;outline-offset:3px}
.cv-esc .au{font-family:var(--sans);font-size:clamp(10px,3vw,14px);color:#6E6455;position:relative}
.cv-esc .ti{margin-top:auto;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(24px,7.6vw,38px);line-height:1;position:relative;white-space:nowrap}
.cv-esc .ti b{font-style:normal;font-weight:700;color:#A3262A}
.cv-ls{background:#2F4A36;color:#EDE8D8}
.cv-ls .sun{position:absolute;width:74%;aspect-ratio:1;border-radius:50%;border:1px solid #C9A75A;right:-20%;top:24%;opacity:.9}
.cv-ls .sun::after{content:"";position:absolute;inset:16%;border-radius:50%;border:1px solid rgba(201,167,90,.55)}
.cv-ls .au{font-family:var(--sans);font-size:clamp(10px,3vw,14px);color:#C9C3AE;position:relative}
.cv-ls .ti{margin-top:auto;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(28px,9.4vw,44px);line-height:.92;position:relative}
.cv-ls .st{font-family:var(--serif);font-style:italic;font-size:clamp(11px,3.2vw,15px);color:#C9C3AE;margin-top:8px;line-height:1.25;position:relative}
.shelflbl{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:0 6px;margin-top:30px}
.book-meta{text-align:left}
.book-meta b{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;line-height:1.15}
.book-meta span{color:var(--muted);font-size:15px}
.shelfwrap{margin:0 0 56px}
.shelfwrap h2{font-size:15px;color:var(--muted);font-weight:400;margin:0 0 16px}

/* book page */
.bookhead{margin:10px 0 30px;display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:end}
.bookhead .cover{width:96px;box-shadow:4px 6px 12px -6px rgba(0,0,0,.45)}
.bookhead .cover .in{padding:16% 10% 10% 16%}
.bookhead .cover .au,.bookhead .cover .st{display:none}
.bookhead .cover .ti{font-size:21px}
.bookhead h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:40px;line-height:1;margin:0}
.bookhead .by{color:var(--muted);font-size:16px;margin-top:6px}
.toc{border-top:1px solid var(--rule)}
.toc button{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--rule)}
.toc small{display:block;color:var(--muted);font-size:15px}
.toc span{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.2}
.toc em{font-style:normal;color:var(--muted);font-size:15px;white-space:nowrap}
.bookintro{color:var(--muted);font-size:16px;margin:0 0 22px;max-width:34em}

/* reader extras */
.sechead .sub{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted);margin-top:6px;line-height:1.25}
.verses h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.22em;line-height:1.25;margin:1.6em 0 .6em}
.verses h4{font-family:var(--sans);font-weight:700;font-size:.8em;color:var(--rubric);margin:1.4em 0 .4em}
.verses.long .v{margin-bottom:.55em}
.v.poem{grid-template-columns:1.25em 1fr}
.v.poem .ln{display:block;padding-left:1.2em;text-indent:-1.2em}
.fn{font-family:var(--sans);font-size:.62em;font-weight:500;color:var(--lapis);vertical-align:.55em;line-height:1;padding:2px 3px;margin-left:1px;border-radius:4px}
.fn:active{background:var(--tint)}
.signoff{font-family:var(--serif);font-style:italic;color:var(--muted);margin:2em 0 0;text-align:right;font-size:.9em}
.signoff b{display:block;font-weight:500;color:var(--ink);margin-top:.4em}
.note{font-family:var(--serif);font-size:18px;line-height:1.5;margin:0 0 4px}
.notelbl{color:var(--lapis);font-weight:500;font-size:15px;margin-bottom:8px}
.setgroup{margin:0 0 30px}
.setgroup h3{font-size:15px;color:var(--muted);font-weight:400;margin:0 0 10px}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 14px;border-radius:14px;border:2px solid var(--rule);font-size:15px}
.opt[aria-pressed=true]{border-color:var(--lapis)}
.opt .sw{width:44px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.tp-claro .sw{background:linear-gradient(135deg,#EEF0EC 50%,#1D2230 50%)}.tp-escuro .sw{background:linear-gradient(135deg,#12151C 50%,#DCE0E8 50%)}
.opt.tp-claro,.opt.tp-escuro{background:var(--surface);color:var(--ink)}
.sz{background:var(--surface)}.sz .aa{font-family:var(--serif);line-height:1;height:26px;display:flex;align-items:flex-end}
.setgroup .sample{font-family:var(--serif);font-size:var(--fs);line-height:1.5;margin:16px 0 0;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--rule)}
.tabbar a{font-size:12px}
</style>
</head>

<script>
const ESC = {"rec": [{"id": "p", "title": "Prólogo", "short": "Pról", "verses": ["Irmã Ângela, indigna serva de Jesus Cristo,", "a suas diletas filhas e irmãs, as coronelas da Companhia de Santa Úrsula:", "A fortaleza e a verdadeira consolação do Espírito Santo estejam com todas vocês,", "a fim de que possam sustentar e executar, viril e fielmente, o empreendimento que assumiram,", "e, ao mesmo tempo, esperar a grande recompensa que Deus lhes preparou, se fizerem esforços, cada qual de seu lado, para serem fiéis e cheias de solicitude para com as esposas dEle,", "que lhes foram confiadas, a fim de que as guardem e velem por elas, como pastoras vigilantíssimas e boas ministras.", "Então, como devem pedir a Deus que as ilumine, que as dirija, e lhes ensine o que devem fazer, por amor a Ele, acerca de semelhante encargo", "não pode haver outro mais digno do que este: serem guardiãs das esposas do Altíssimo.", "Eis porque devem, também, considerar de que forma devem apreciá-las,", "porque, quanto mais as apreciarem, mais as amarão; quanto mais as amarem, mais cuidado e vigilância terão para com elas.", "E ser-lhes-á impossível não pensar nelas, dia e noite, e não tê-las, todas, e cada uma, gravadas no coração, porque o verdadeiro amor assim faz e opera.", "E este cargo não deve ser para vocês um peso; pelo contrário, devem agradecer muito a Deus ter-se dignado fazer de sorte que vocês sejam dessas a quem Ele pede de afadigar-se, para governar e salvaguardar semelhante tesouro que é seu.", "Graça certamente grande e ventura inestimável, se quiserem reconhecê-las.", "Não percam o ânimo por não saber, nem por não poder fazer o que se exige, com razão, para um governo tão singular.", "Tenham esperança e fé firme em Deus, pois Ele as ajudará em todas as coisas.", "Rezem, se humilhem sob o grande poder de Deus, porque, sem dúvida alguma, Ele, tendo-lhes confiado semelhante empreendimento, também lhes dará as forças necessárias para executá-lo, contanto que não falte a cooperação do seu lado.", "Atuem, mexam-se, creiam, esforcem-se, esperem, clamem a Deus, do fundo do coração;", "e, sem dúvida alguma, verão coisas admiráveis, orientando-se tudo para o louvor e glória de Sua Majestade e para o bem das almas.", "E entre outras coisas que, mediante a graça de Deus, haverão de fazer,", "peço a todas, ou melhor; suplico-lhes, por amor da paixão de Jesus Cristo e da Madona, que se esforcem de pôr em prática estas poucas recomendações,", "que lhes deixo para serem executadas depois de minha morte; elas serão, para vocês, um memorial de, pelo menos, uma parte da minha vontade e do meu desejo.", "E, nisso, reconhecerei se vocês têm a peito dar-me prazer.", "Porque, fiquem sabendo, agora eu estou mais viva do que quando estava nesta vida;", "e vejo mais, prezo e aprecio melhor as coisas boas que, continuamente, vejo-as fazer,", "e agora, quero e posso ajudá-las mais e fazer-lhes o bem, de todo jeito."]}, {"id": "1", "title": "Primeira Recomendação", "short": "1ª", "verses": ["Por conseguinte, em primeiro lugar, minhas filhas e irmãs muito queridas no Sangue de Jesus Cristo,", "eu lhes recomendo que se esforcem, com a ajuda de Deus, de adquirir e de plantar em si mesmas este bom conceito e este humilde sentimento: não se julguem dignas de ser superioras e coronelas.", "Pelo contrário, considerem-se como ministras e servas, pensando que têm mais necessidade de servi-las do que elas de serem servidas ou governadas por vocês;", "e que Deus bem poderia provê-las de outros instrumentos ainda melhores do que vocês.", "Mas, em sua misericórdia, quis servir-se de vocês como instrumentos, para seu melhor bem, a fim de que possam merecer mais da infinita bondade dele, e para que Ele tenha motivo de recompensá-las.", "Aprendam de Nosso Senhor, que, enquanto esteve neste mundo, foi como um servo, obedecendo ao Pai eterno até a morte.", "E por isso ele disse: \"Ego fui in vobis non tanquam qui recumbit, sed qui ministrat\"; isto é: Eu estive entre vós, não como aquele que é servido, mas como aquele que serve.", "E São Gregório, embora fosse Papa, denominava-se, contudo, servo dos servos de Deus.", "Assim, ele exercia o ofício de superior e de papa; no coração, porém, ele se reputava como menor que os outros, e como o servo dos servos de Deus, recordando-se da locução evangélica: \"Qui maior est inter vos, fiat sicut minor\".", "Assim também vocês, sejam superioras desta maneira e, em conseqüência, reconheçam-se e julguem-se menores do que suas filhas.", "Porque, assim fazendo, o próprio Deus as exaltará depois, na medida em que tiverem se rebaixado.", "De fato, não é inutilmente nem sem motivo, que o coração de um verdadeiro e prudente servo de Deus se humilha e aniquila, em si mesmo, o sentimento de seu próprio valor e a complacência em sua própria reputação;", "de fato, ele espera e aguarda de Deus outro gozo, uma glória e uma honra mais verdadeiras;", "pois crê firmemente aquilo que diz o Evangelho: \"qui se humiliat, exaltabitur\"; isto é: quem se humilha, será exaltado."]}, {"id": "2", "title": "Segundo Preceito", "short": "2º", "verses": ["Sejam afáveis e humanas para com suas queridas filhas.", "E esforcem-se por ser guiadas unicamente pelo amor de Deus e zelo das almas, quando as admoestarem e as aconselharem, ou quando as exortarem a algum bem e as desviarem de algum mal.", "Pois obterão mais com ternura e afabilidade do que com severidade e ásperas repreensões;", "as quais devem ser reservadas somente aos casos de necessidade;", "e, ainda: que sejam levados em conta o lugar, o tempo e o temperamento das pessoas.", "Mas a caridade, que dirige todas as coisas para a honra de Deus e utilidade das almas, ensina bem tal discernimento,", "e sensibiliza o coração para ser, conforme o lugar e o tempo, ora afável, ora severo, e pouco ou muito, conforme as necessidades.", "Se virem alguma pusilânime e tímida, e inclinada ao desânimo, confortem-na, inspirem-lhe ânimo, prometam-lhe o bem da misericórdia de Deus, dilatem-lhe o coração com todas as consolações.", "Se, pelo contrário, virem outra presunçosa, de consciência lassa, pouco timorata, a essa inspirem-lhe temor;", "lembrem-lhe o rigor da justiça de Deus,", "e quanto o pecado é coisa sutil, e como vivemos no meio de ciladas, e como temos sempre razão de permanecer no temor, como diz a Escritura: \"Beatus qui semper est pavidus\"; isto é: Feliz aquele que permanece no temor."]}, {"id": "3", "title": "Terceiro Preceito", "short": "3º", "verses": ["Sejam submissas às madres principais que lhes deixo em meu lugar, como é justo.", "E o que vocês fazem, façam-no obedecendo-lhes, e não seguindo seu próprio parecer.", "Porque lhes obedecendo, obedecerão a mim mesma; e obedecendo a mim, obedecerão a Jesus Cristo,", "que, por sua imensa bondade, elegeu-me para ser mãe, viva e morta, de tão nobre Companhia, ainda que, de minha parte, eu fosse muito indigna,", "e, tendo-me eleito, deu-me também a graça de poder governá-la segundo sua vontade.", "Agora, se acontecer que vocês tenham uma razão justa de contradizê-las, ou de repreendê-las, façam-no com jeito e reverência.", "E se elas não quiserem ceder, tenham paciência.", "E saibam que é justo amar as mães se elas são boas, e suportá-las se elas são ranzinzas.", "E abstenham-se, absolutamente, de queixar-se, de murmurar, de falar mal delas, nem com outras pessoas, nem com suas filhas.", "Mas, em toda parte, conservem a honra e a reverência às suas madres, considerando que, se Deus manda honrar os pais e as mães carnais, com maior razão devem ser estimadas as mães espirituais.", "Portanto, façam de modo que elas sejam sempre amadas e respeitadas, especialmente entre suas filhas.", "E pensem que, se elas são boas, vocês não as merecem; e que se elas são más, vocês mereceriam ainda piores.", "Contudo, se vocês têm no coração algo que lhes desagrada, nelas, poderão, muito bem e sem escrúpulo, falar disso, em segredo, com alguma pessoa boa e fiel em todos os sentidos e pontos de vista.", "Saibam, porém, que lá onde vocês virem, claramente, que a salvação e a honestidade de suas filhas estão em perigo, não devem, absolutamente, nisso consentir, nem tolerar, nem ter respeito algum,", "mas tudo isso sempre com bom conselho e maturidade de julgamento."]}, {"id": "4", "title": "Quarta Recomendação", "short": "4ª", "verses": ["Serão solícitas e vigilantes para conhecer e entender o comportamento de suas filhas, e para estar a par das suas necessidades espirituais e temporais.", "E, inclusive, a proverem-nas, caso tenham possibilidade para isso; pois devem dar às Matronas o mínimo de incômodo e de estorvo possível.", "Mas, se não puderem provê-las, recorram às madres principais, e rapidamente, e sem hesitação alguma, exponham-lhes as necessidades de suas ovelhinhas.", "E, se virem que elas demoram a atender, insistam;", "e, neste caso, sejam, de minha parte, até importunas e amolantes.", "Se, porventura, por causa de vocês e de sua negligência, alguma perecesse, Deus lhes pediria conta rigorosa no dia do juízo.", "Porque vocês devem saber e ter certo isto: que Ele jamais deixará de prover as necessidades delas, tanto corporais como espirituais, contanto que, do lado de vocês, nada falte.", "Porque se foi Deus que plantou esta Companhia, jamais Ele a abandonará.", "Por isso é que a Sagrada Escritura diz: \"Nunquam vidi iustum derelectum, nec semen eius quaerens panem\"; isto é: Nunca vi o justo ser abandonado, nem sua descendência mendigar."]}, {"id": "5", "title": "Quinta Recomendação", "short": "5ª", "verses": ["Freqüentemente, caso tenham tempo e possibilidade, especialmente nos dias de festa, por gentileza vão visitar suas filhas e irmãs queridas,", "e cumprimentá-las, ver como estão passando, confortá-las, incentivá-las a perseverar na vida começada;", "convidá-las a desejar as alegrias e os bens celestes, a suspirar pelas alegres e novas festas do Céu, estes ditosos e eternos triunfos;", "e, doravante, abandonar totalmente o amor deste mundo miserável e traidor, onde jamais há repouso, nem contentamento verdadeiro,", "mas somente sonhos vãos, ou árduos trabalhos, e tudo que é infeliz e mesquinho.", "Lembrem-lhes que se comportem bem nas casas, com bom senso, com prudência e modéstia,", "que sejam, em tudo, polidas e sóbrias.", "Comam e bebam, não por prazer e para saciar o apetite, mas somente pela necessidade de sustentar a natureza, a fim de servir melhor a Deus.", "Sejam sóbrias também no dormir, dormindo apenas quanto requer a necessidade,", "e igualmente no rir, devem ser polidas e sóbrias.", "No ouvir, comprazam-se em ouvir somente coisas convenientes e lícitas, e necessárias.", "No falar, sejam suas palavras sensatas e ponderadas; e não agressivas, nem duras, mas humanas e conducentes à concórdia e à caridade.", "Digam-lhes que dêem o bom exemplo, onde quer que se encontrem.", "E que sejam, para todos, um bom odor de virtude.", "E que sejam obedientes e submissas a seus superiores.", "E que procurem introduzir paz e concórdia onde estiverem.", "Acima de tudo, que sejam humildes e afáveis.", "E que todo comportamento, as ações e as palavras delas sejam impregnadas de caridade, e que suportem tudo com paciência, pois é com essas duas virtudes, especialmente, que se esmaga a cabeça do diabo.", "E quando as visitarem, eu lhes dou esta incumbência de cumprimentá-las e apertar-lhes a mão, também, de minha parte.", "E digam-lhes que sejam unidas e vivam juntas, na concórdia, tendo todas um só querer, e mantendo-se sob a obediência da Regra, pois isto é fundamental.", "Que honrem Jesus Cristo, a quem elas prometeram a virgindade e o próprio ser inteiramente.", "Que ponham a esperança e o amor em Deus só, e não numa pessoa viva.", "Confortem-nas, animem-nas, que elas permaneçam de bom grado.", "E transmitam-lhes esta boa nova que eu lhes anuncio da parte de Jesus Cristo e da Madona:", "quanto devem elas rejubilar-se, e fazer festa, porque no Céu está preparada, para todas, para cada uma, uma coroa de glória e de alegria,", "contanto que permaneçam firmes e constantes no seu propósito.", "E se esforcem por observar a Regra.", "E, disso, que elas não duvidem jamais.", "Com certeza, elas terão, às vezes, tribulações ou dificuldades, todavia isso passará depressa e se mudará em alegria e gáudio.", "E depois, o sofrimento deste mundo é um nada, em relação aos bens que estão no Paraíso.", "Que elas tenham ainda isto por certíssimo: que jamais serão abandonadas em suas necessidades. Deus as proverá admiravelmente.", "Que elas não percam a esperança.", "Quantos senhores, rainhas e outras altas personagens existem que, não obstante as riquezas e o poder que têm, não poderão achar um verdadeiro refrigério numa necessidade extrema!", "E todavia, essas pobrezinhas encontrarão consolo e reconforto.", "Dir-lhes-ão ainda que, agora, eu estou mais viva do que quando me viam corporalmente,", "e que, agora, eu as vejo e as conheço melhor.", "E que posso e quero ajudá-las mais.", "E que estou, continuamente, entre elas com meu Amado, ou melhor — nosso Amado, de todas nós,", "contanto que elas creiam, e não percam a coragem e a esperança.", "Alarguem, portanto, para elas, a medida das promessas, que jamais hão de falhar, especialmente para aquelas que vocês virem desoladas, hesitantes e pusilânimes.", "Digam-lhes que desejem me ver não na terra, mas no Céu, onde está nosso amor.", "Que elas depositem suas esperanças no alto, e não na terra.", "Que tenham Jesus Cristo como seu único tesouro, pois aí estará também o amor;", "e é mister procurá-lo não neste mundo, mas no mais alto dos Céus, à destra do Pai, como diz o Apóstolo: \"Si consurrexistis cum Christi, quae sursum sunt quaerite, quae sursum sunt sapite, et non quae super terram\"."]}, {"id": "6", "title": "Sexto Preceito", "short": "6º", "verses": ["Vivam e procedam de tal modo que suas queridas filhas possam espelhar-se em vocês.", "E aquilo que querem que elas façam, façam-no primeiramente.", "Como poderiam adverti-las ou repreendê-las por algum defeito que vocês ainda tivessem?", "Ou então, aconselhá-las e induzi-las a alguma virtude que, primeiramente, vocês não possuíssem?", "Ou que, pelo menos, juntamente com elas, começassem a praticar?", "Façam, portanto, de modo que, a exemplo de vocês, também, elas se decidam e se animem a viver virtuosamente.", "Procurem amoldar-se a elas em toda atitude honesta e virtuosa que lhes convenha e lhes seja possível, especialmente naquilo que se refere ao comportamento, à freqüência da Confissão e da Comunhão, e a outras obras semelhantes.", "Pois é coisa justa e conveniente que as mães sejam exemplo e espelho para as filhas, especialmente na honestidade, no procedimento, e em outras maneiras e atitudes exteriores, em público."]}, {"id": "7", "title": "Sétima Recomendação", "short": "7ª", "verses": ["Saibam que devem defender e resguardar suas ovelhas dos lobos e dos ladrões; isto é: de duas sortes de pessoas pestíferas: as pessoas mundanas ou falsos religiosos com suas ciladas, e os heréticos.", "Primeiramente, pois, no que diz respeito aos encontros mundanos, resguardem-se, especialmente, da intimidade com rapazes, e também com outros homens, mesmo que espirituais;", "porque a intimidade espiritual demasiada com homens degenera, quase sempre, em intimidade carnal.", "Quanto possível, não as deixem freqüentar mulheres ociosas, a quem desagrada viver castamente,", "e que, de bom grado, se deleitam em ouvir falar de coisas frívolas e de prazeres mundanos.", "Fiquem atentas, para que nenhum confessor, ou outro religioso, não as desvie de qualquer boa resolução,", "ou do jejum,", "ou do firme propósito de virgindade,", "ou da estima desta Regra divinamente ordenada,", "ou de outras coisas boas semelhantes.", "Porque muitos deles, sob pretexto de bons conselhos, costumam desviar a mente de muitas pobrezinhas das boas intenções e resoluções.", "Quanto a preservá-las das opiniões pestíferas dos heréticos, se ouvirem dizer que algum pregador, ou outra pessoa, tem fama de herético,", "ou de pregar novidades alheias ao uso comum da Igreja,", "e contrárias ao que vocês receberam de nós,", "então, com muito jeito, impeçam suas filhas de ouvir semelhantes pessoas.", "Porque sucede, muitas vezes, que sejam plantadas, na mente, certas sementes daninhas, que depois é muito penoso desplantar.", "Por conseguinte, vocês também, não tenham intimidade com eles.", "Deixem-nos de lado.", "Considerem cada um como bom,", "mas, sejam prudentes, para o próprio bem de vocês.", "Pois é melhor seguir o certo, sem perigo, do que o incerto com perigo.", "Sigam o antigo caminho e costume da Igreja, estabelecidos e confirmados por tantos Santos, pela inspiração do Espírito Santo. E levem uma vida nova.", "Relativamente às outras opiniões que surgem atualmente, e que surgirão, deixem-nas cair como coisas que não as atingem.", "Mas rezem, e mandem rezar, a fim de que Deus não abandone sua Igreja, mas digne-se reformá-la como lhe apraz,", "e conforme o que Ele vê ser melhor para nós,", "e para sua maior honra e glória.", "Com efeito, nesses tempos perigosos e pestíferos não terão outro recurso a não ser o de refugiar-se aos pés de Jesus Cristo,", "porque, se Ele as governar e instruir, serão bem instruídas, como diz o Profeta: \"Beatus, quem tu erudieris\"; isto é: Feliz quem tu, Senhor, tiveres instruído.", "Então, humilhem-se sob sua mão poderosa, e serão iluminadas, gritando com o Profeta: \"Ilumina oculos meos ne unquam obdormiam in morte\"."]}, {"id": "8", "title": "Oitava Recomendação", "short": "8ª", "verses": ["Amem suas filhas, igualmente, sem preferência por esta ou por aquela,", "porque todas são criaturas de Deus. E vocês não sabem o que Ele quer fazer delas.", "De fato, como podem saber se aquelas que lhes parecem as mais insignificantes e as mais desprovidas, não vão tornar-se as mais generosas e as mais aceitas por sua majestade?", "Além disso, quem pode julgar os corações e os pensamentos secretos no íntimo da criatura?", "Assim sendo, abracem-nas e suportem-nas, todas, igualmente, porque não lhes compete julgar as servas de Deus: Ele sabe muito bem aquilo que quer fazer delas.", "Ele que (como diz a Escritura) pode transformar pedras em filhos celestes.", "Cumpram vocês seu dever, corrigindo-as com amor e caridade, se as virem cair em algum erro, em conseqüência da fragilidade humana;", "e assim, não cessarão de podar esta vinha que lhes está confiada.", "E depois, deixem Deus agir; Ele fará coisas admiráveis em tempo oportuno, e quando lhe aprouver."]}, {"id": "u", "title": "Última Recomendação", "short": "Últ", "verses": ["A última palavra que lhes dirijo — suplicando-lhes até com meu sangue — é que vivam na concórdia, unidas, juntas, todas com um só coração e um só querer.", "Sejam ligadas uma à outra pelo vínculo da caridade, estimando-se, ajudando-se, suportando-vos em Jesus Cristo.", "Porque, se todas se esforçarem por ser assim, sem dúvida, o Senhor Deus estará no meio de vocês;", "terão em seu favor a Madona,", "os Apóstolos,", "todos os Santos,", "os Anjos", "e, finalmente, todo o Céu, e todo o Universo.", "Porque Deus assim ordenou, de toda eternidade: que aqueles que estão unidos no bem, para honra dEle, terão prosperidade completa, e tudo que fizerem terá bom êxito, visto que têm, a seu favor, o próprio Deus e todas as suas criaturas.", "Vejam, pois, a importância desta união e concórdia.", "E por isso, desejem-na,", "procurem-na,", "abracem-na,", "retenham-na com todas as suas forças;", "pois eu lhes digo que, estando todas assim unidas de coração, juntas, serão como uma rocha fortíssima, ou uma torre inexpugnável,", "contra todas as adversidades,", "e perseguições,", "e ciladas diabólicas.", "E mais: eu lhes afianço que toda graça, que pedirem a Deus, lhes será concedida infalivelmente.", "E eu estarei sempre no meio de vocês, ajudando suas orações.", "Incentivem, pois, suas filhas a prosseguir ardorosamente este empreendimento começado.", "E, juntas, regozijem-se, porque sem dúvida alguma, o que lhes digo se realizará.", "Além da enorme e inapreciável graça que meu Amado, ou melhor, nosso Amado, lhes concederá no momento supremo da morte,", "porque, nas grandes necessidades, é que se reconhece a amizade verdadeira.", "E creiam firmemente que, nessa hora, de modo especial, reconhecerão que eu sou uma amiga fiel.", "Agora, deixo-as; fiquem consoladas, e tenham viva fé e esperança.", "Antes, porém, quero que sejam abençoadas: In nomine Patris, et Filii, et Spiritus Sancti. Amen."]}], "leg": [{"id": "p", "title": "Prólogo", "short": "Pról", "verses": ["Irmã Ângela, indigna serva de Jesus Cristo,", "à Condessa Senhora Lucrécia, Madre principal da Companhia de Santa Úrsula, e às demais governadoras e madres, as nobres matronas: Senhora Genepra de Luciagi, Senhora Maria de Avogadri, Senhora Verônica di Bucci, Senhora Orsolina di Gavardi, Senhora Giovanna di Monti, Senhora Isabetta da Prato, Senhora Lionela di Pedeciochi, Senhora Catarina di Mei.", "A eterna bênção esteja sobre todas, concedida pelo onipotente Deus, em nome do Pai, do Filho e do Espírito Santo. Amém.", "Minhas irmãs e madres venerandas, muito amadas no Sangue de Jesus Cristo,", "já que Deus quis, em seu eterno conselho, eleger, fora da vaidade do mundo, muitas mulheres, especialmente virgens, isto é, esta nossa Companhia,", "e já que lhe aprouve, em sua infinita bondade, servir-se de mim como instrumento seu para esta obra tão grandiosa,", "embora da minha parte fosse eu uma serva muito incapaz e muito inútil,", "Ele também, em sua habitual bondade, deu-me e concedeu tal graça e dom, para que eu pudesse governá-la segundo a sua vontade,", "e prover suas necessidades e seu trabalho, especialmente naquilo que contribui para dirigi-las e mantê-las na vida para a qual foram eleitas.", "E entre os recursos bons e necessários que Deus preparou para mim, as senhoras são um dos principais,", "as senhoras que foram achadas dignas de ser verdadeiras e amorosas mães de tão nobre família,", "entregue em suas mãos,", "a fim de que tenham com ela o cuidado e a solicitude que teriam, se elas tivessem saído do próprio corpo das senhoras, e até mais.", "A este respeito, eu queria que abrissem um pouco os olhos da inteligência, para considerar a grande graça, e sorte, para as senhoras,", "a saber: que Deus se dignou fazê-las mães de tantas virgens,", "e colocar-lhes, entre as mãos, as próprias esposas dele.", "Oh! Como devem agradecer-lhe,", "e, ao mesmo tempo, pedir-lhe", "que, assim como se dignou pô-las à frente de tão nobre rebanho,", "digne-se, também, dar-lhes uma sabedoria e uma aptidão tais, que as senhoras possam realizar obra digna de louvor diante dEle;", "e colocar toda aptidão e força no cumprimento de seu dever.", "Consequentemente, é necessário que tomem uma firme deliberação de submeter-se, totalmente, à vontade de Deus,", "e, com uma fé firme e inabalável, receber, dEle mesmo, aquilo que terão de realizar por seu amor.", "E nisso, (aconteça o que acontecer) perseverar até o fim.", "Mas, acima de tudo, peço e suplico a todas, pela Paixão e pelo Sangue de Jesus Cristo, derramado por nosso amor,", "que ponham em prática, com toda solicitude possível, estas poucas recomendações,", "que, pela graça de Deus, vocês verão adiante expostas, uma a uma.", "Porque, partindo agora desta vida,", "e deixando-as em meu lugar e como minhas herdeiras,", "estas recomendações serão como legados que, na minha suprema vontade, lhes deixo, para serem executados fielmente."]}, {"id": "1", "title": "Primeiro Legado", "short": "1º", "verses": ["Primeiramente então, minhas prezadíssimas madres e irmãs em Jesus Cristo,", "esforcem-se, com a ajuda de Deus, por adquirir e conservar em si tais convicções e tão bons sentimentos,", "que sejam motivadas para esta solicitude e este governo, somente pelo amor de Deus e pelo zelo único da salvação das almas.", "Porque, estando todas as suas obras e todos os atos de seu governo, assim enraizados nessa dupla caridade, não poderão produzir senão frutos bons e salutares.", "De fato — como disse nosso Salvador — \"Bona arbor non potest malos fructus facere\". A árvore boa, diz Ele, isto é, o coração e o espírito impregnados de caridade, não podem produzir senão obras boas e salutares.", "Por isso, dizia também Santo Agostinho: \"Ama, et fac quod vis\"; isto é: Tem amor e caridade, e depois faze o que te apraz.", "Como se dissesse claramente: a caridade não pode pecar."]}, {"id": "2", "title": "Segundo Legado", "short": "2º", "verses": ["Depois, suplico-lhes que tomem conta e tenham esculpidas, na mente e no coração, todas as suas filhas, uma por uma,", "não apenas os nomes,", "mas também a condição, a natureza e a situação, de cada uma, e tudo que lhes concerne.", "Isso não lhes será difícil, se as abraçarem com vívida caridade.", "De fato, observa-se que as mães consangüíneas, mesmo que tivessem mil filhos e filhas, tê-los-iam todos, totalmente, gravados no coração, um a um,", "porque assim opera o verdadeiro amor.", "Parece até que quanto mais numerosos são, mais crescem o amor e o interesse por cada um deles.", "Com maior razão, as mães espirituais podem e devem fazer o mesmo,", "visto que o amor espiritual é, incomparavelmente, mais poderoso que o amor natural.", "Portanto, minhas prezadíssimas madres, se amarem suas queridas filhas com ardente e entranhada caridade,", "ser-lhes-á impossível não as ter, todas, gravadas na memória e no coração, cada uma em particular."]}, {"id": "3", "title": "Terceiro Legado", "short": "3º", "verses": ["Terceiro: peço-lhes, por gentileza, que se esforcem para orientar suas filhas com amor, com mão suave e meiga,", "e não imperiosamente, nem com aspereza;", "mas, em todos os casos, procurem ser afáveis.", "Prestem atenção a Jesus Cristo, que diz: \"Discite a me, quia mitis sum et humilis corde\"; aprendei de mim, diz ele, que sou manso e humilde de coração.", "E de Deus, lê-se: \"Disponit omnia suaviter\"; isto é: ordena e governa todas as coisas suavemente.", "E diz ainda Jesus Cristo: \"Jungum meum suave, et onus meum leve\", quer dizer: Meu jugo é suave, e meu fardo, leve.", "As senhoras devem, pois, esforçar-se para fazer o mesmo, e usar toda afabilidade possível.", "E, sobretudo, evitem querer forçar,", "porque Deus deu, a cada um, o livre arbítrio,", "e Ele não quer forçar ninguém,", "mas apenas propõe, convida e aconselha,", "como o faz também pela boca de São João, dizendo: \"Suadeo tibi emere coronam immarcescibilem\"; isto é: eu te aconselho a comprar a coroa imperecível. Eu te aconselho, diz Ele, e não: eu te forço.", "Não digo, porém, que às vezes não se deva, usar de repreensões e de severidade,", "em lugar e tempo oportunos, conforme a importância, a condição e a necessidade das pessoas;", "mas devemos agir impulsionadas, unicamente, pela caridade e pelo zelo das almas."]}, {"id": "4", "title": "Quarto Legado", "short": "4º", "verses": ["Quarto: com avidez e abertura, as senhoras devem aplicar a inteligência e a solicitude, a fim de que suas queridas filhas sejam adornadas de todas as virtudes,", "e de maneiras nobres e belas,", "a fim de que possam agradar a Jesus Cristo, o Esposo delas.", "E, particularmente, devem estar atentas e vigilantes, a fim de que elas se conservem íntegras e castas,", "e que, em todos os atos e gestos, procedam com honestidade e prudência,", "e façam tudo com paciência e caridade.", "Ora, vê-se como as mães consangüíneas dedicam tanto cuidado e esforço, para enfeitar, adornar e embelezar, de modos diversos, as filhas segundo a natureza, a fim de que elas possam agradar a seus esposos da terra;", "e quanto mais importantes e nobres são eles, mais elas se esmeram com toda diligência possível, para torná-las cada vez mais atraentes, especialmente naquilo que percebem ser mais apreciado por eles.", "E elas têm e põem toda sua alegria nisto: em serem mães de moças que agradam muito a esposos tão gentis;", "pois esperam, também, por causa e por meio das filhas, granjear o amor e cair na graça dos genros.", "Quanto mais devem as senhoras fazer, em relação a essas celestes filhas suas,", "que são esposas, não de esposos terrestres, corruptíveis, e, finalmente, putrefatos,", "mas do imortal Filho do Deus eterno.", "Oh! Que beleza e dignidade novas ser governadora e mãe das Esposas do Rei dos reis e do Senhor dos senhores,", "e, de certo modo, tornar-se a sogra do Filho de Deus;", "e assim, por meio das filhas, conquistar a graça e o amor do Altíssimo!", "Felizardas serão as senhoras, se estiverem prontas e atentas para reconhecer a novidade e a singularidade de semelhante sorte!"]}, {"id": "5", "title": "Quinto Legado", "short": "5º", "verses": ["Quinto: fiquem de sobreaviso, quando tiverem aconselhado e advertido alguma, com amor, três vezes ou, no máximo, quatro, a respeito de uma falta notável,", "e virem que ela não quer obedecer,", "então, deixem-na de lado,", "e não mandem mais as coronelas nem outras visitadoras vê-la;", "sobretudo, porque pode acontecer que a pobrezinha, vendo-se assim abandonada e relegada, seja levada ao arrependimento,", "e deseje mais que nunca ficar na Companhia", "e aí perseverar.", "Aliás, Deus também expulsou Adão do paraíso, a fim de que, desta forma, entrando em si, ele viesse a fazer penitência.", "Por conseguinte, se a culpada, descontente de seu erro, quiser voltar, deve ser recebida,", "mas com esta condição: que ela peça perdão às senhoras e, também, à sua coronela.", "E, por penitência, seja-lhe imposto um dia de jejum a pão e água, uma sexta-feira."]}, {"id": "6", "title": "Sexto Legado", "short": "6º", "verses": ["Sexto: serão precavidas quando virem que uma demora muito a renunciar a bugigangas ou a outras bagatelas semelhantes, que, aliás, têm pouca importância;", "não alimentem muita esperança que ela persevere na Companhia.", "Porque, se ela não quer fazer o mais fácil, pior será quanto ao mais difícil.", "Aqui, porém, é mister ser prudente, porque pode suceder que uma pessoa tenha colocado toda a força do seu afeto numa ninharia, de modo que, tendo-se vencido nesse ponto, nenhum outro lhe será demasiado difícil."]}, {"id": "7", "title": "Sétimo Legado", "short": "7º", "verses": ["Sétimo: encontrem um jeito de todas se reunirem com as coronelas duas vezes ou, pelo menos, uma vez, por mês,", "e assim juntas trocarem idéias", "e fazerem um bom exame do governo.", "E especialmente a respeito do que as coronelas lhes relatarem sobre o procedimento de suas filhas,", "e sobre suas necessidades e carências, tanto espirituais", "como materiais.", "E prover a cada coisa, conforme o Espírito Santo lhes inspirar."]}, {"id": "8", "title": "Oitavo Legado", "short": "8º", "verses": ["Oitavo: deverão ter a preocupação de reunir suas queridas filhas, de vez em quando, no local que lhes parecer mais adequado e mais cômodo.", "E assim (caso encontrem uma pessoa capacitada), farão com que lhes seja dirigido um sermãozinho e uma exortação;", "para que, desta forma também, elas possam encontrar-se juntas, como irmãs queridas,", "refletindo, assim juntas, sobre coisas espirituais, congratular-se,", "e juntas se animarem,", "o que, para elas, não será de pequena vantagem."]}, {"id": "9", "title": "Nono Legado", "short": "9º", "verses": ["Nono: saberão que, se não fosse coisa útil e conveniente que a Companhia tivesse alguma renda, Deus não teria começado a provê-la disso.", "Advirto-as, porém: sejam prudentes a este respeito,", "e sejam boas e verdadeiras mães,", "e a renda que tiverem, empreguem-na para o bem e desenvolvimento da Companhia, conforme lhes ditarem a discrição e o amor materno.", "Sobre este assunto, não quero que procurem conselhos lá fora;", "decidam as senhoras mesmas, entre si,", "conforme a caridade e o Espírito Santo as iluminarem e lhes ditarem,", "orientando tudo para o bem e o proveito de suas queridas filhas,", "tanto para incentivar e induzir aquelas que já estão na Companhia a um amor maior e à obrigação de fazer o bem,", "como para atrair ainda outras.", "Porque a verdadeira finalidade, agradável a Deus, da esmola e da amabilidade é a seguinte: desviar, por este meio, a criatura do mal e do vício,", "e encaminhá-la para o bem e os bons costumes,", "ou, pelo menos, para um maior crescimento espiritual.", "Porque, desta maneira, as pessoas são compradas, obrigadas, e quase que forçadas a fazer aquilo que a gente quer.", "Realmente, quando uma jovem, por exemplo, recebe e aceita um presente, um donativo de uma pessoa que lhe é desconhecida, fica como que obrigada a condescender com a vontade da mesma,", "e não lhe parece mais possível dizer-lhe não.", "Assim também, nem mais nem menos, com os presentes e as esmolas, atraem-se as pessoas à prática do bem, e, de certo modo, a isto são forçadas; sentem-se como que obrigadas a agir bem.", "Sigam, igualmente, este caminho, e não poderão falhar."]}, {"id": "10", "title": "Décimo Legado", "short": "10º", "verses": ["Décimo: peço-lhes, de todo coração, que sejam cheias de solicitude e de vigilância, como pastoras atentas, para com este celeste rebanho,", "entregue em suas mãos,", "a fim de que, entre suas ovelhas, não nasça a cizânia da discórdia ou outro escândalo,", "e, especialmente, para que elas não se manchem com o veneno de alguma opinião herética, nestes tempos pestíferos.", "E considerem que o demônio jamais dorme, porém, de mil maneiras, procura nossa ruína.", "Assim sendo, estejam de sobreaviso,", "e, sobretudo, tenham cuidado que elas sejam unidas de coração e de vontade, como se lê dos Apóstolos e dos outros cristãos da Igreja primitiva: \"Erat autem eorum cor unum\"; isto é: tinham todos um só coração.", "Do mesmo modo, as senhoras, também, se esforcem de ser assim com suas queridas filhas,", "porque, quanto mais unidas forem, mais Jesus Cristo estará no meio de todas, como um pai e bom pastor.", "E não haverá outro sinal que se está na graça do Senhor, a não ser o de amar-se e estar unidas juntas,", "pois Ele próprio diz: \"In hoc cognoscet mundus quod estis mei discipuli, si diligeretis invicem\", isto é: nisto o mundo conhecerá que sois meus discípulos, se vos amardes mutuamente.", "Portanto, amar-se mutuamente e viver em concórdia, juntamente, são o sinal certo de que se caminha pela via boa e agradável a Deus.", "Assim sendo, minhas irmãs e madres, fiquem atentas a este respeito, porque é, aqui, que o demônio lhes armará ciladas sob a aparência de bem.", "Por conseguinte, assim que perceberem até mesmo uma sombra de semelhante peste, imediatamente atalhem-na, conforme Deus as iluminar.", "E, por nada deste mundo, não deixem crescer tal semente na Companhia,", "porque esta peste seria, também, um mau exemplo para a cidade e outras regiões.", "Porque, lá onde existe divergência de vontade, existe, inevitavelmente, discórdia;", "lá onde há discórdia, há, indubitavelmente, ruína, como diz o Salvador: \"Omne regnum in seipsum divisum desolabitur\"; isto é: todo governo em desacordo consigo mesmo irá à ruína."]}, {"id": "u", "title": "Último Legado", "short": "Últ", "verses": ["Por último: tenham um cuidado muito grande, a fim de que as boas prescrições dadas, especialmente as que estão na Regra, sejam observadas com extrema diligência.", "E se, conforme os tempos e as necessidades for necessário tomar novas decisões ou modificar algo, façam-no com prudência e com bom conselho.", "E que sempre o seu principal refúgio seja de reunirem-se aos pés de Jesus Cristo;", "e aí, todas, com todas as suas filhas, façam fervorosíssimas orações.", "Porque assim, sem dúvida alguma, Jesus Cristo estará no meio de todas, e as esclarecerá e as instruirá, como verdadeiro e bom Mestre, sobre o que terão de fazer.", "Tenham isto por certo: que esta Regra foi diretamente plantada por sua santa mão,", "e que Ele, jamais, abandonará esta Companhia, enquanto o mundo durar.", "Porque, se foi Ele que a plantou, quem, pois, poderá desplantá-la?", "Creiam isto,", "não duvidem,", "tenham fé firme que assim será.", "Eu sei o que digo.", "Felizes aqueles que, realmente, dela se ocuparem.", "Se observarem, fielmente, todas estas coisas e outras semelhantes, como o Espírito Santo lhes ditar, de acordo com os tempos e as circunstâncias, regozijem-se, prossigam de boa vontade.", "Eis que uma grande recompensa lhes será preparada.", "E onde estiverem as filhas, lá estarão também as mães.", "Fiquem tranqüilas, não duvidem; queremos vê-las no céu, no meio de nós,", "porque assim quererá também Aquele que nos ama — a todas.", "E quem poderia resistir a Ele,", "cuja luz e cujo esplendor de verdade as envolverão no momento da morte,", "e as livrarão das mãos do inimigo?", "Por conseguinte, perseverem fielmente e com alegria na obra começada.", "E preservem-se, preservem-se, repito, da tibieza,", "pois que, cada promessa que lhes faço será plenamente cumprida.", "Agora, eu me vou,", "e vocês, nesse ínterim, façam o que deve ser feito,", "Antes, porém, abraço-as e a todas dou o beijo da paz,", "suplicando a Deus que as abençoe: In nomine Patris, et Filii, et Spiritus Sancti. Amen."]}]};
const LS = {"sections": [{"id": "intro", "title": "Introdução", "short": "Intro", "items": [{"n": 1, "t": "«Laudato si’, mi’ Signore — Louvado sejas, meu Senhor», cantava São Francisco de Assis. Neste gracioso cântico, recordava-nos que a nossa casa comum se pode comparar ora a uma irmã, com quem partilhamos a existência, ora a uma boa mãe, que nos acolhe nos seus braços: «Louvado sejas, meu Senhor, pela nossa irmã, a mãe terra, que nos sustenta e governa e produz variados frutos com flores coloridas e verduras».[1]"}, {"n": 2, "t": "Esta irmã clama contra o mal que lhe provocamos por causa do uso irresponsável e do abuso dos bens que Deus nela colocou. Crescemos a pensar que éramos seus proprietários e dominadores, autorizados a saqueá-la. A violência, que está no coração humano ferido pelo pecado, vislumbra-se nos sintomas de doença que notamos no solo, na água, no ar e nos seres vivos. Por isso, entre os pobres mais abandonados e maltratados, conta-se a nossa terra oprimida e devastada, que «geme e sofre as dores do parto» (Rm 8, 22). Esquecemo-nos de que nós mesmos somos terra (cf. Gn 2,7). O nosso corpo é constituído pelos elementos do planeta; o seu ar permite-nos respirar, e a sua água vivifica-nos e restaura-nos."}, {"h": "Nada deste mundo nos é indiferente", "lvl": 2}, {"n": 3, "t": "Mais de cinquenta anos atrás, quando o mundo estava oscilando sobre o fio duma crise nuclear, o Santo Papa João XXIII escreveu uma encíclica na qual não se limitava a rejeitar a guerra, mas quis transmitir uma proposta de paz. Dirigiu a sua mensagem Pacem in terris a todo o mundo católico, mas acrescentava: e a todas as pessoas de boa vontade. Agora, à vista da deterioração global do ambiente, quero dirigir-me a cada pessoa que habita neste planeta. Na minha exortação Evangelii gaudium, escrevi aos membros da Igreja, a fim de os mobilizar para um processo de reforma missionária ainda pendente. Nesta encíclica, pretendo especialmente entrar em diálogo com todos acerca da nossa casa comum."}, {"n": 4, "t": "Oito anos depois da Pacem in terris, em 1971, o Beato Papa Paulo VI referiu-se à problemática ecológica, apresentando-a como uma crise que é «consequência dramática» da actividade descontrolada do ser humano: «Por motivo de uma exploração inconsiderada da natureza, [o ser humano] começa a correr o risco de a destruir e de vir a ser, também ele, vítima dessa degradação».[2] E, dirigindo-se à FAO, falou da possibilidade duma «catástrofe ecológica sob o efeito da explosão da civilização industrial», sublinhando a «necessidade urgente duma mudança radical no comportamento da humanidade», porque «os progressos científicos mais extraordinários, as invenções técnicas mais assombrosas, o desenvolvimento económico mais prodigioso, se não estiverem unidos a um progresso social e moral, voltam-se necessariamente contra o homem».[3]"}, {"n": 5, "t": "São João Paulo II debruçou-se, com interesse sempre maior, sobre este tema. Na sua primeira encíclica, advertiu que o ser humano parece «não dar-se conta de outros significados do seu ambiente natural, para além daqueles que servem somente para os fins de um uso ou consumo imediatos».[4] Mais tarde, convidou a uma conversão ecológica global.[5] Entretanto fazia notar o pouco empenho que se põe em «salvaguardar as condições morais de uma autêntica ecologia humana».[6] A destruição do ambiente humano é um facto muito grave, porque, por um lado, Deus confiou o mundo ao ser humano e, por outro, a própria vida humana é um dom que deve ser protegido de várias formas de degradação. Toda a pretensão de cuidar e melhorar o mundo requer mudanças profundas «nos estilos de vida, nos modelos de produção e de consumo, nas estruturas consolidadas de poder, que hoje regem as sociedades».[7] O progresso humano autêntico possui um carácter moral e pressupõe o pleno respeito pela pessoa humana, mas deve prestar atenção também ao mundo natural e «ter em conta a natureza de cada ser e as ligações mútuas entre todos, num sistema ordenado».[8] Assim, a capacidade do ser humano transformar a realidade deve desenvolver-se com base na doação originária das coisas por parte de Deus.[9]"}, {"n": 6, "t": "O meu predecessor, Bento XVI, renovou o convite a «eliminar as causas estruturais das disfunções da economia mundial e corrigir os modelos de crescimento que parecem incapazes de garantir o respeito do meio ambiente».[10] Lembrou que o mundo não pode ser analisado concentrando-se apenas sobre um dos seus aspectos, porque «o livro da natureza é uno e indivisível», incluindo, entre outras coisas, O ambiente, a vida, a sexualidade, a família, as relações sociais. É que «a degradação da natureza está estreitamente ligada à cultura que molda a convivência humana».[11] O Papa Bento XVI propôs-nos reconhecer que o ambiente natural está cheio de chagas causadas pelo nosso comportamento irresponsável; o próprio ambiente social tem as suas chagas. Mas, fundamentalmente, todas elas se ficam a dever ao mesmo mal, isto é, à ideia de que não existem verdades indiscutíveis a guiar a nossa vida, pelo que a liberdade humana não tem limites. Esquece-se que «o homem não é apenas uma liberdade que se cria por si própria. O homem não se cria a si mesmo. Ele é espírito e vontade, mas é também natureza».[12] Com paterna solicitude, convidou-nos a reconhecer que a criação resulta comprometida «onde nós mesmos somos a última instância, onde o conjunto é simplesmente nossa propriedade e onde o consumimos somente para nós mesmos. E o desperdício da criação começa onde já não reconhecemos qualquer instância acima de nós, mas vemo-nos unicamente a nós mesmos».[13]"}, {"h": "Unidos por uma preocupação comum", "lvl": 2}, {"n": 7, "t": "Estas contribuições dos Papas recolhem a reflexão de inúmeros cientistas, filósofos, teólogos e organizações sociais que enriqueceram o pensamento da Igreja sobre estas questões. Mas não podemos ignorar que, também fora da Igreja Católica, noutras Igrejas e Comunidades cristãs - bem como noutras religiões — se tem desenvolvido uma profunda preocupação e uma reflexão valiosa sobre estes temas que a todos nos estão a peito. Apenas para dar um exemplo particularmente significativo, quero retomar brevemente parte da contribuição do amado Patriarca Ecuménico Bartolomeu, com quem partilhamos a esperança da plena comunhão eclesial."}, {"n": 8, "t": "O Patriarca Bartolomeu tem-se referido particularmente à necessidade de cada um se arrepender do próprio modo de maltratar o planeta, porque «todos, na medida em que causamos pequenos danos ecológicos», somos chamados a reconhecer «a nossa contribuição — pequena ou grande - para a desfiguração e destruição do ambiente». [14] Sobre este ponto, ele pronunciou-se repetidamente, de maneira firme e encorajadora, convidando-nos a reconhecer os pecados contra a criação: «Quando os seres humanos destroem a biodiversidade na criação de Deus; quando os seres humanos comprometem a integridade da terra e contribuem para a mudança climática, desnudando a terra das suas florestas naturais ou destruindo as suas zonas húmidas; quando os seres humanos contaminam as águas, o solo, o ar... tudo isso é pecado».[15] Porque «um crime contra a natureza é um crime contra nós mesmos e um pecado contra Deus».[16]"}, {"n": 9, "t": "Ao mesmo tempo Bartolomeu chamou a atenção para as raízes éticas e espirituais dos problemas ambientais, que nos convidam a encontrar soluções não só na técnica mas também numa mudança do ser humano; caso contrário, estaríamos a enfrentar apenas os sintomas. Propôs-nos passar do consumo ao sacrifício, da avidez à generosidade, do desperdício à capacidade de partilha, numa ascese que «significa aprender a dar, e não simplesmente renunciar. É um modo de amar, de passar pouco a pouco do que eu quero àquilo de que o mundo de Deus precisa. É libertação do medo, da avidez, da dependência».[17] Além disso nós, cristãos, somos chamados a «aceitar o mundo como sacramento de comunhão, como forma de partilhar com Deus e com o próximo numa escala global. É nossa humilde convicção que o divino e o humano se encontram no menor detalhe da túnica inconsútil da criação de Deus, mesmo no último grão de poeira do nosso planeta».[18]"}, {"h": "São Francisco de Assis", "lvl": 2}, {"n": 10, "t": "Não quero prosseguir esta encíclica sem invocar um modelo belo e motivador. Tomei o seu nome por guia e inspiração, no momento da minha eleição para Bispo de Roma. Acho que Francisco é o exemplo por excelência do cuidado pelo que é frágil e por uma ecologia integral, vivida com alegria e autenticidade. É o santo padroeiro de todos os que estudam e trabalham no campo da ecologia, amado também por muitos que não são cristãos. Manifestou uma atenção particular pela criação de Deus e pelos mais pobres e abandonados. Amava e era amado pela sua alegria, a sua dedicação generosa, o seu coração universal. Era um místico e um peregrino que vivia com simplicidade e numa maravilhosa harmonia com Deus, com os outros, com a natureza e consigo mesmo. Nele se nota até que ponto são inseparáveis a preocupação pela natureza, a justiça para com os pobres, o empenhamento na sociedade e a paz interior."}, {"n": 11, "t": "O seu testemunho mostra-nos também que uma ecologia integral requer abertura para categorias que transcendem a linguagem das ciências exactas ou da biologia e nos põem em contacto com a essência do ser humano. Tal como acontece a uma pessoa quando se enamora por outra, a reacção de Francisco, sempre que olhava o sol, a lua ou os minúsculos animais, era cantar, envolvendo no seu louvor todas as outras criaturas. Entrava em comunicação com toda a criação, chegando mesmo a pregar às flores «convidando-as a louvar o Senhor, como se gozassem do dom da razão».[19] A sua reacção ultrapassava de longe uma mera avaliação intelectual ou um cálculo económico, porque, para ele, qualquer criatura era uma irmã, unida a ele por laços de carinho. Por isso, sentia-se chamado a cuidar de tudo o que existe. São Boaventura, seu discípulo, contava que ele, «enchendo-se da maior ternura ao considerar a origem comum de todas as coisas, dava a todas as criaturas — por mais desprezíveis que parecessem - o doce nome de irmãos e irmãs».[20] Esta convicção não pode ser desvalorizada como romantismo irracional, pois influi nas opções que determinam o nosso comportamento. Se nos aproximarmos da natureza e do meio ambiente sem esta abertura para a admiração e o encanto, se deixarmos de falar a língua da fraternidade e da beleza na nossa relação com o mundo, então as nossas atitudes serão as do dominador, do consumidor ou de um mero explorador dos recursos naturais, incapaz de pôr um limite aos seus interesses imediatos. Pelo contrário, se nos sentirmos intimamente unidos a tudo o que existe, então brotarão de modo espontâneo a sobriedade e a solicitude. A pobreza e a austeridade de São Francisco não eram simplesmente um ascetismo exterior, mas algo de mais radical: uma renúncia a fazer da realidade um mero objecto de uso e domínio."}, {"n": 12, "t": "Por outro lado, São Francisco, fiel à Sagrada Escritura, propõe-nos reconhecer a natureza como um livro esplêndido onde Deus nos fala e transmite algo da sua beleza e bondade: «Na grandeza e na beleza das criaturas, contempla-se, por analogia, o seu Criador» (Sab 13, 5) e «o que é invisível n'Ele — o seu eterno poder e divindade — tornou-se visível à inteligência, desde a criação do mundo, nas suas obras» (Rm 1, 20). Por isso, Francisco pedia que, no convento, se deixasse sempre uma parte do horto por cultivar para aí crescerem as ervas silvestres, a fim de que, quem as admirasse, pudesse elevar o seu pensamento a Deus, autor de tanta beleza.[21] O mundo é algo mais do que um problema a resolver; é um mistério gozoso que contemplamos na alegria e no louvor."}, {"h": "O meu apelo", "lvl": 2}, {"n": 13, "t": "O urgente desafio de proteger a nossa casa comum inclui a preocupação de unir toda a família humana na busca de um desenvolvimento sustentável e integral, pois sabemos que as coisas podem mudar. O Criador não nos abandona, nunca recua no seu projecto de amor, nem Se arrepende de nos ter criado. A humanidade possui ainda a capacidade de colaborar na construção da nossa casa comum. Desejo agradecer, encorajar e manifestar apreço a quantos, nos mais variados sectores da actividade humana, estão a trabalhar para garantir a protecção da casa que partilhamos. Uma especial gratidão é devida àqueles que lutam, com vigor, por resolver as dramáticas consequências da degradação ambiental na vida dos mais pobres do mundo. Os jovens exigem de nós uma mudança; interrogam-se como se pode pretender construir um futuro melhor, sem pensar na crise do meio ambiente e nos sofrimentos dos excluídos."}, {"n": 14, "t": "Lanço um convite urgente a renovar o diálogo sobre a maneira como estamos a construir o futuro do planeta. Precisamos de um debate que nos una a todos, porque o desafio ambiental, que vivemos, e as suas raízes humanas dizem respeito e têm impacto sobre todos nós. O movimento ecológico mundial já percorreu um longo e rico caminho, tendo gerado numerosas agregações de cidadãos que ajudaram na consciencialização. Infelizmente, muitos esforços na busca de soluções concretas para a crise ambiental acabam, com frequência, frustrados não só pela recusa dos poderosos, mas também pelo desinteresse dos outros. As atitudes que dificultam os caminhos de solução, mesmo entre os crentes, vão da negação do problema à indiferença, à resignação acomodada ou à confiança cega nas soluções técnicas. Precisamos de nova solidariedade universal. Como disseram os bispos da África do Sul, «são necessários os talentos e o envolvimento de todos para reparar o dano causado pelos humanos sobre a criação de Deus».[22] Todos podemos colaborar, como instrumentos de Deus, no cuidado da criação, cada um a partir da sua cultura, experiência, iniciativas e capacidades."}, {"n": 15, "t": "Espero que esta carta encíclica, que se insere no magistério social da Igreja, nos ajude a reconhecer a grandeza, a urgência e a beleza do desafio que temos pela frente. Em primeiro lugar, farei uma breve resenha dos vários aspectos da actual crise ecológica, com o objectivo de assumir os melhores frutos da pesquisa científica actualmente disponível, deixar-se tocar por ela em profundidade e dar uma base concreta ao percurso ético e espiritual seguido. A partir desta panorâmica, retomarei algumas argumentações que derivam da tradição judaico-cristã, a fim de dar maior coerência ao nosso compromisso com o meio ambiente. Depois procurarei chegar às raízes da situação actual, de modo a individuar não apenas os seus sintomas, mas também as causas mais profundas. Poderemos assim propor uma ecologia que, nas suas várias dimensões, integre o lugar específico que o ser humano ocupa neste mundo e as suas relações com a realidade que o rodeia. À luz desta reflexão, quereria dar mais um passo, verificando algumas das grandes linhas de diálogo e de acção que envolvem seja cada um de nós seja a política internacional. Finalmente, convencido — como estou — de que toda a mudança tem necessidade de motivações e dum caminho educativo, proporei algumas linhas de maturação humana inspiradas no tesouro da experiência espiritual cristã."}, {"n": 16, "t": "Embora cada capítulo tenha a sua temática própria e uma metodologia específica, o sucessivo retoma por sua vez, a partir duma nova perspectiva, questões importantes abordadas nos capítulos anteriores. Isto diz respeito especialmente a alguns eixos que atravessam a encíclica inteira. Por exemplo: a relação íntima entre os pobres e a fragilidade do planeta, a convicção de que tudo está estreitamente interligado no mundo, a crítica do novo paradigma e das formas de poder que derivam da tecnologia, o convite a procurar outras maneiras de entender a economia e o progresso, o valor próprio de cada criatura, o sentido humano da ecologia, a necessidade de debates sinceros e honestos, a grave responsabilidade da política internacional e local, a cultura do descarte e a proposta dum novo estilo de vida. Estes temas nunca se dão por encerrados nem se abandonam, mas são constantemente retomados e enriquecidos."}]}, {"id": "c1", "title": "Capítulo I", "sub": "O que está a acontecer à nossa casa", "short": "I", "items": [{"n": 17, "t": "As reflexões teológicas ou filosóficas sobre a situação da humanidade e do mundo podem soar como uma mensagem repetida e vazia, se não forem apresentadas novamente a partir dum confronto com o contexto actual no que este tem de inédito para a história da humanidade. Por isso, antes de reconhecer como a fé traz novas motivações e exigências face ao mundo de que fazemos parte, proponho que nos detenhamos brevemente a considerar o que está a acontecer à nossa casa comum."}, {"n": 18, "t": "A contínua aceleração das mudanças na humanidade e no planeta junta-se, hoje, à intensificação dos ritmos de vida e trabalho, que alguns, em espanhol, designam por «rapidación». Embora a mudança faça parte da dinâmica dos sistemas complexos, a velocidade que hoje lhe impõem as acções humanas contrasta com a lentidão natural da evolução biológica. A isto vem juntar-se o problema de que os objectivos desta mudança rápida e constante não estão necessariamente orientados para o bem comum e para um desenvolvimento humano sustentável e integral. A mudança é algo desejável, mas torna-se preocupante quando se transforma em deterioração do mundo e da qualidade de vida de grande parte da humanidade."}, {"n": 19, "t": "Depois dum tempo de confiança irracional no progresso e nas capacidades humanas, uma parte da sociedade está a entrar numa etapa de maior consciencialização. Nota-se uma crescente sensibilidade relativamente ao meio ambiente e ao cuidado da natureza, e cresce uma sincera e sentida preocupação pelo que está a acontecer ao nosso planeta. Façamos uma resenha, certamente incompleta, das questões que hoje nos causam inquietação e já não se podem esconder debaixo do tapete. O objectivo não é recolher informações ou satisfazer a nossa curiosidade, mas tomar dolorosa consciência, ousar transformar em sofrimento pessoal aquilo que acontece ao mundo e, assim, reconhecer a contribuição que cada um lhe pode dar."}, {"h": "1. Poluição e mudanças climáticas", "lvl": 1}, {"h": "Poluição, resíduos e cultura do descarte", "lvl": 2}, {"n": 20, "t": "Existem formas de poluição que afectam diariamente as pessoas. A exposição aos poluentes atmosféricos produz uma vasta gama de efeitos sobre a saúde, particularmente dos mais pobres, e provocam milhões de mortes prematuras. Adoecem, por exemplo, por causa da inalação de elevadas quantidades de fumo produzido pelos combustíveis utilizados para cozinhar ou aquecer-se. A isto vem juntar-se a poluição que afecta a todos, causada pelo transporte, pelos fumos da indústria, pelas descargas de substâncias que contribuem para a acidificação do solo e da água, pelos fertilizantes, insecticidas, fungicidas, pesticidas e agro-tóxicos em geral. Na realidade a tecnologia, que, ligada à finança, pretende ser a única solução dos problemas, é incapaz de ver o mistério das múltiplas relações que existem entre as coisas e, por isso, às vezes resolve um problema criando outros."}, {"n": 21, "t": "Devemos considerar também a poluição produzida pelos resíduos, incluindo os perigosos presentes em variados ambientes. Produzem-se anualmente centenas de milhões de toneladas de resíduos, muitos deles não biodegradáveis: resíduos domésticos e comerciais, detritos de demolições, resíduos clínicos, electrónicos e industriais, resíduos altamente tóxicos e radioactivos. A terra, nossa casa, parece transformar-se cada vez mais num imenso depósito de lixo. Em muitos lugares do planeta, os idosos recordam com saudade as paisagens de outrora, que agora vêem submersas de lixo. Tanto os resíduos industriais como os produtos químicos utilizados nas cidades e nos campos podem produzir um efeito de bioacumulação nos organismos dos moradores nas áreas limítrofes, que se verifica mesmo quando é baixo o nível de presença dum elemento tóxico num lugar. Muitas vezes só se adoptam medidas quando já se produziram efeitos irreversíveis na saúde das pessoas."}, {"n": 22, "t": "Estes problemas estão intimamente ligados à cultura do descarte, que afecta tanto os seres humanos excluídos como as coisas que se convertem rapidamente em lixo. Note-se, por exemplo, como a maior parte do papel produzido se desperdiça sem ser reciclado. Custa-nos a reconhecer que o funcionamento dos ecossistemas naturais é exemplar: as plantas sintetizam substâncias nutritivas que alimentam os herbívoros; estes, por sua vez, alimentam os carnívoros que fornecem significativas quantidades de resíduos orgânicos, que dão origem a uma nova geração de vegetais. Ao contrário, o sistema industrial, no final do ciclo de produção e consumo, não desenvolveu a capacidade de absorver e reutilizar resíduos e escórias. Ainda não se conseguiu adoptar um modelo circular de produção que assegure recursos para todos e para as gerações futuras e que exige limitar, o mais possível, o uso dos recursos não-renováveis, moderando o seu consumo, maximizando a eficiência no seu aproveitamento, reutilizando e reciclando-os. A resolução desta questão seria uma maneira de contrastar a cultura do descarte que acaba por danificar o planeta inteiro, mas nota-se que os progressos neste sentido são ainda muito escassos."}, {"h": "O clima como bem comum", "lvl": 2}, {"n": 23, "t": "O clima é um bem comum, um bem de todos e para todos. A nível global, é um sistema complexo, que tem a ver com muitas condições essenciais para a vida humana. Há um consenso científico muito consistente, indicando que estamos perante um preocupante aquecimento do sistema climático. Nas últimas décadas, este aquecimento foi acompanhado por uma elevação constante do nível do mar, sendo difícil não o relacionar ainda com o aumento de acontecimentos meteorológicos extremos, embora não se possa atribuir uma causa cientificamente determinada a cada fenómeno particular. A humanidade é chamada a tomar consciência da necessidade de mudanças de estilos de vida, de produção e de consumo, para combater este aquecimento ou, pelo menos, as causas humanas que o produzem ou acentuam. É verdade que há outros factores (tais como o vulcanismo, as variações da órbita e do eixo terrestre, o ciclo solar), mas numerosos estudos científicos indicam que a maior parte do aquecimento global das últimas décadas é devida à alta concentração de gases com efeito de estufa (dióxido de carbono, metano, óxido de azoto, e outros) emitidos sobretudo por causa da actividade humana. Concentrando-se na atmosfera, estes gases dificultam a evasão do calor que a luz do sol produz sobre a superfície da terra. Isto é particularmente agravado pelo modelo de desenvolvimento baseado no uso intensivo de combustíveis fósseis, que está no centro do sistema energético mundial. E incidiu também a prática crescente de mudar a utilização do solo, principalmente o desflorestamento para finalidade agrícola."}, {"n": 24, "t": "Por sua vez, o aquecimento influi sobre o ciclo do carbono. Cria um ciclo vicioso que agrava ainda mais a situação e que incidirá sobre a disponibilidade de recursos essenciais como a água potável, a energia e a produção agrícola das áreas mais quentes e provocará a extinção de parte da biodiversidade do planeta. O derretimento das calotas polares e dos glaciares a grande altitude ameaça com uma libertação, de alto risco, de gás metano, e a decomposição da matéria orgânica congelada poderia acentuar ainda mais a emissão de dióxido de carbono. Entretanto a perda das florestas tropicais piora a situação, pois estas ajudam a mitigar a mudança climática. A poluição produzida pelo dióxido de carbono aumenta a acidez dos oceanos e compromete a cadeia alimentar marinha. Se a tendência actual se mantiver, este século poderá ser testemunha de mudanças climáticas inauditas e duma des
