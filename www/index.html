 de poucos meios para se defender e fornecer provas irrefutáveis. Se a informação objectiva leva a prever um dano grave e irreversível, mesmo que não haja uma comprovação indiscutível, seja o projecto que for deverá suspender-se ou modificar-se. Assim, inverte-se o ónus da prova, já que, nestes casos, é preciso fornecer uma demonstração objectiva e contundente de que a actividade proposta não vai gerar danos graves ao meio ambiente ou às pessoas que nele habitam."}, {"n": 187, "t": "Isto não implica opor-se a toda e qualquer inovação tecnológica que permita melhorar a qualidade de vida duma população. Mas, em todo o caso, deve permanecer de pé que a rentabilidade não pode ser o único critério a ter em conta e, na hora em que aparecessem novos elementos de juízo a partir de ulteriores dados informativos, deveria haver uma nova avaliação com a participação de todas as partes interessadas. O resultado do debate pode ser a decisão de não avançar num projecto, mas poderia ser também a sua modificação ou a elaboração de propostas alternativas."}, {"n": 188, "t": "Há discussões sobre problemas relativos ao meio ambiente, onde é difícil chegar a um consenso. Repito uma vez mais que a Igreja não pretende definir as questões científicas nem substituir-se à política, mas convido a um debate honesto e transparente, para que as necessidades particulares ou as ideologias não lesem o bem comum."}, {"h": "4. Política e economia em diálogo para a plenitude humana", "lvl": 1}, {"n": 189, "t": "A política não deve submeter-se à economia, e esta não deve submeter-se aos ditames e ao paradigma eficientista da tecnocracia. Pensando no bem comum, hoje precisamos imperiosamente que a política e a economia, em diálogo, se coloquem decididamente ao serviço da vida, especialmente da vida humana. A salvação dos bancos a todo o custo, fazendo pagar o preço à população, sem a firme decisão de rever e reformar o sistema inteiro, reafirma um domínio absoluto da finança que não tem futuro e só poderá gerar novas crises depois duma longa, custosa e aparente cura. A crise financeira dos anos 2007 e 2008 era a ocasião para o desenvolvimento duma nova economia mais atenta aos princípios éticos e para uma nova regulamentação da actividade financeira especulativa e da riqueza virtual. Mas não houve uma reacção que fizesse repensar os critérios obsoletos que continuam a governar o mundo. A produção não é sempre racional, e muitas vezes está ligada a variáveis económicas que atribuem aos produtos um valor que não corresponde ao seu valor real. Isto leva frequentemente a uma superprodução dalgumas mercadorias, com um impacto ambiental desnecessário, que simultaneamente danifica muitas economias regionais. [133] Habitualmente, a bolha financeira é também uma bolha produtiva. Em suma, o que não se enfrenta com energia é o problema da economia real, aquela que torna possível, por exemplo, que se diversifique e melhore a produção, que as empresas funcionem adequadamente, que as pequenas e médias empresas se desenvolvam e criem postos de trabalho."}, {"n": 190, "t": "Neste contexto, sempre se deve recordar que «a protecção ambiental não pode ser assegurada somente com base no cálculo financeiro de custos e benefícios. O ambiente é um dos bens que os mecanismos de mercado não estão aptos a defender ou a promover adequadamente».[134] Mais uma vez repito que convém evitar uma concepção mágica do mercado, que tende a pensar que os problemas se resolvem apenas com o crescimento dos lucros das empresas ou dos indivíduos. Será realista esperar que quem está obcecado com a maximização dos lucros se detenha a considerar os efeitos ambientais que deixará às próximas gerações? Dentro do esquema do ganho não há lugar para pensar nos ritmos da natureza, nos seus tempos de degradação e regeneração, e na complexidade dos ecossistemas que podem ser gravemente alterados pela intervenção humana. Além disso, quando se fala de biodiversidade, no máximo pensa-se nela como um reservatório de recursos económicos que poderia ser explorado, mas não se considera seriamente o valor real das coisas, o seu significado para as pessoas e as culturas, os interesses e as necessidades dos pobres."}, {"n": 191, "t": "Quando se colocam estas questões, alguns reagem acusando os outros de pretender parar, irracionalmente, o progresso e o desenvolvimento humano. Mas temos de nos convencer que, reduzir um determinado ritmo de produção e consumo, pode dar lugar a outra modalidade de progresso e desenvolvimento. Os esforços para um uso sustentável dos recursos naturais não são gasto inútil, mas um investimento que poderá proporcionar outros benefícios económicos a médio prazo. Se não temos vista curta, podemos descobrir que pode ser muito rentável a diversificação duma produção mais inovadora e com menor impacto ambiental. Trata-se de abrir caminho a oportunidades diferentes, que não implicam frenar a criatividade humana nem o seu sonho de progresso, mas orientar esta energia por novos canais."}, {"n": 192, "t": "Por exemplo, um percurso de desenvolvimento produtivo mais criativo e melhor orientado poderia corrigir a disparidade entre o excessivo investimento tecnológico no consumo e o escasso investimento para resolver os problemas urgentes da humanidade; poderia gerar formas inteligentes e rentáveis de reutilização, recuperação funcional e reciclagem; poderia melhorar a eficiência energética das cidades... A diversificação produtiva oferece à inteligência humana possibilidades muito amplas de criar e inovar, ao mesmo tempo que protege o meio ambiente e cria mais oportunidades de trabalho. Esta seria uma criatividade capaz de fazer reflorescer a nobreza do ser humano, porque é mais dignificante usar a inteligência, com audácia e responsabilidade, para encontrar formas de desenvolvimento sustentável e equitativo, no quadro duma concepção mais ampla da qualidade de vida. Ao contrário, é menos dignificante e criativo e mais superficial insistir na criação de formas de espoliação da natureza só para oferecer novas possibilidades de consumo e de ganho imediato."}, {"n": 193, "t": "Assim, se nalguns casos o desenvolvimento sustentável implicará novas modalidades para crescer, noutros casos — face ao crescimento ganancioso e irresponsável, que se verificou ao longo de muitas décadas — devemos pensar também em abrandar um pouco a marcha, pôr alguns limites razoáveis e até mesmo retroceder antes que seja tarde. Sabemos que é insustentável o comportamento daqueles que consomem e destroem cada vez mais, enquanto outros ainda não podem viver de acordo com a sua dignidade humana. Por isso, chegou a hora de aceitar um certo decréscimo do consumo nalgumas partes do mundo, fornecendo recursos para que se possa crescer de forma saudável noutras partes. Bento XVI dizia que «é preciso que as sociedades tecnologicamente avançadas estejam dispostas a favorecer comportamentos caracterizados pela sobriedade, diminuindo as próprias necessidades de energia e melhorando as condições da sua utilização».[135]"}, {"n": 194, "t": "Para que apareçam novos modelos de progresso, precisamos de «converter o modelo de desenvolvimento global»[136], e isto implica reflectir responsavelmente «sobre o sentido da economia e dos seus objectivos, para corrigir as suas disfunções e deturpações».[137] Não é suficiente conciliar, a meio termo, o cuidado da natureza com o ganho financeiro, ou a preservação do meio ambiente com o progresso. Neste campo, os meios-termos são apenas um pequeno adiamento do colapso. Trata-se simplesmente de redefinir o progresso. Um desenvolvimento tecnológico e económico, que não deixa um mundo melhor e uma qualidade de vida integralmente superior, não se pode considerar progresso. Além disso, muitas vezes a qualidade real de vida das pessoas diminui — pela deterioração do ambiente, a baixa qualidade dos produtos alimentares ou o esgotamento de alguns recursos — no contexto dum crescimento da economia. Então, muitas vezes, o discurso do crescimento sustentável torna-se um diversivo e um meio de justificação que absorve valores do discurso ecologista dentro da lógica da finança e da tecnocracia, e a responsabilidade social e ambiental das empresas reduz-se, na maior parte dos casos, a uma série de acções de publicidade e imagem."}, {"n": 195, "t": "O princípio da maximização do lucro, que tende a isolar-se de todas as outras considerações, é uma distorção conceptual da economia: desde que aumente a produção, pouco interessa que isso se consiga à custa dos recursos futuros ou da saúde do meio ambiente; se o derrube duma floresta aumenta a produção, ninguém insere no respectivo cálculo a perda que implica desertificar um território, destruir a biodiversidade ou aumentar a poluição. Por outras palavras, as empresas obtêm lucros calculando e pagando uma parte ínfima dos custos. Poder-se-ia considerar ético somente um comportamento em que «os custos económicos e sociais derivados do uso dos recursos ambientais comuns sejam reconhecidos de maneira transparente e plenamente suportados por quem deles usufrui e não por outras populações nem pelas gerações futuras».[138] A mentalidade utilitária, que fornece apenas uma análise estática da realidade em função de necessidades actuais, está presente tanto quando é o mercado que atribui os recursos como quando o faz um Estado planificador."}, {"n": 196, "t": "Qual é o lugar da política? Recordemos o princípio da subsidiariedade, que dá liberdade para o desenvolvimento das capacidades presentes a todos os níveis, mas simultaneamente exige mais responsabilidade pelo bem comum a quem tem mais poder. É verdade que, hoje, alguns sectores económicos exercem mais poder do que os próprios Estados. Mas não se pode justificar uma economia sem política, porque seria incapaz de promover outra lógica para governar os vários aspectos da crise actual. A lógica que não deixa espaço para uma sincera preocupação pelo meio ambiente é a mesma em que não encontra espaço a preocupação por integrar os mais frágeis, porque, «no modelo “do êxito” e “individualista” em vigor, parece que não faz sentido investir para que os lentos, fracos ou menos dotados possam também singrar na vida».[139]"}, {"n": 197, "t": "Precisamos duma política que pense com visão ampla e leve por diante uma reformulação integral, abrangendo num diálogo interdisciplinar os vários aspectos da crise. Muitas vezes, a própria política é responsável pelo seu descrédito, devido à corrupção e à falta de boas políticas públicas. Se o Estado não cumpre o seu papel numa região, alguns grupos económicos podem-se apresentar como benfeitores e apropriar-se do poder real, sentindo-se autorizados a não observar certas normas até se chegar às diferentes formas de criminalidade organizada, tráfico de pessoas, narcotráfico e violência muito difícil de erradicar. Se a política não é capaz de romper uma lógica perversa e perde-se também em discursos inconsistentes, continuaremos sem enfrentar os grandes problemas da humanidade. Uma estratégia de mudança real exige repensar a totalidade dos processos, pois não basta incluir considerações ecológicas superficiais enquanto não se puser em discussão a lógica subjacente à cultura actual. Uma política sã deveria ser capaz de assumir este desafio."}, {"n": 198, "t": "A política e a economia tendem a culpar-se reciprocamente a respeito da pobreza e da degradação ambiental. Mas o que se espera é que reconheçam os seus próprios erros e encontrem formas de interacção orientadas para o bem comum. Enquanto uns se afanam apenas com o ganho económico e os outros estão obcecados apenas por conservar ou aumentar o poder, o que nos resta são guerras ou acordos espúrios, onde o que menos interessa às duas partes é preservar o meio ambiente e cuidar dos mais fracos. Vale aqui também o princípio de que «a unidade é superior ao conflito».[140]"}, {"h": "5. As religiões no diálogo com as ciências", "lvl": 1}, {"n": 199, "t": "Não se pode sustentar que as ciências empíricas expliquem completamente a vida, a essência íntima de todas as criaturas e o conjunto da realidade. Isto seria ultrapassar indevidamente os seus confins metodológicos limitados. Se se reflecte dentro deste quadro restrito, desaparecem a sensibilidade estética, a poesia e ainda a capacidade da razão perceber o sentido e a finalidade das coisas.[141] Quero lembrar que «os textos religiosos clássicos podem oferecer um significado para todas as épocas, possuem uma força motivadora que abre sempre novos horizontes (...). Será razoável e inteligente relegá-los para a obscuridade, só porque nasceram no contexto duma crença religiosa?»[142] Realmente, é ingénuo pensar que os princípios éticos possam ser apresentados de modo puramente abstracto, desligados de todo o contexto, e o facto de aparecerem com uma linguagem religiosa não lhes tira valor algum no debate público. Os princípios éticos que a razão é capaz de perceber, sempre podem reaparecer sob distintas roupagens e expressos com linguagens diferentes, incluindo a religiosa."}, {"n": 200, "t": "Além disso, qualquer solução técnica que as ciências pretendam oferecer será impotente para resolver os graves problemas do mundo, se a humanidade perde o seu rumo, se esquece as grandes motivações que tornam possível a convivência social, o sacrifício, a bondade. Em todo o caso, será preciso fazer apelo aos crentes para que sejam coerentes com a sua própria fé e não a contradigam com as suas acções; será necessário insistir para que se abram novamente à graça de Deus e se nutram profundamente das próprias convicções sobre o amor, a justiça e a paz. Se às vezes uma má compreensão dos nossos princípios nos levou a justificar o abuso da natureza, ou o domínio despótico do ser humano sobre a criação, ou as guerras, a injustiça e a violência, nós, crentes, podemos reconhecer que então fomos infiéis ao tesouro de sabedoria que devíamos guardar. Muitas vezes os limites culturais de distintas épocas condicionaram esta consciência do próprio património ético e espiritual, mas é precisamente o regresso às respectivas fontes que permite às religiões responder melhor às necessidades actuais."}, {"n": 201, "t": "A maior parte dos habitantes do planeta declara-se crente, e isto deveria levar as religiões a estabelecerem diálogo entre si, visando o cuidado da natureza, a defesa dos pobres, a construção duma trama de respeito e de fraternidade. De igual modo é indispensável um diálogo entre as próprias ciências, porque cada uma costuma fechar-se nos limites da sua própria linguagem, e a especialização tende a converter-se em isolamento e absolutização do próprio saber. Isto impede de enfrentar adequadamente os problemas do meio ambiente. Torna-se necessário também um diálogo aberto e respeitador dos diferentes movimentos ecologistas, entre os quais não faltam as lutas ideológicas. A gravidade da crise ecológica obriga-nos, a todos, a pensar no bem comum e a prosseguir pelo caminho do diálogo que requer paciência, ascese e generosidade, lembrando-nos sempre que «a realidade é superior à ideia».[143]"}]}, {"id": "c6", "title": "Capítulo VI", "sub": "Educação e espiritualidade ecológicas", "short": "VI", "items": [{"n": 202, "t": "Muitas coisas devem reajustar o próprio rumo, mas antes de tudo é a humanidade que precisa de mudar. Falta a consciência duma origem comum, duma recíproca pertença e dum futuro partilhado por todos. Esta consciência basilar permitiria o desenvolvimento de novas convicções, atitudes e estilos de vida. Surge, assim, um grande desafio cultural, espiritual e educativo que implicará longos processos de regeneração."}, {"h": "1. Apontar para outro estilo de vida", "lvl": 1}, {"n": 203, "t": "Dado que o mercado tende a criar um mecanismo consumista compulsivo para vender os seus produtos, as pessoas acabam por ser arrastadas pelo turbilhão das compras e gastos supérfluos. O consumismo obsessivo é o reflexo subjectivo do paradigma tecno-económico. Está a acontecer aquilo que já assinalava Romano Guardini: o ser humano «aceita os objectos comuns e as formas habituais da vida como lhe são impostos pelos planos nacionais e pelos produtos fabricados em série e, em geral, age assim com a impressão de que tudo isto seja razoável e justo».[144] O referido paradigma faz crer a todos que são livres pois conservam uma suposta liberdade de consumir, quando na realidade apenas possui a liberdade a minoria que detém o poder económico e financeiro. Nesta confusão, a humanidade pós-moderna não encontrou uma nova compreensão de si mesma que a possa orientar, e esta falta de identidade é vivida com angústia. Temos demasiados meios para escassos e raquíticos fins."}, {"n": 204, "t": "A situação actual do mundo «gera um sentido de precariedade e insegurança, que, por sua vez, favorece formas de egoísmo colectivo».[145] Quando as pessoas se tornam auto-referenciais e se isolam na própria consciência, aumentam a sua voracidade: quanto mais vazio está o coração da pessoa, tanto mais necessita de objectos para comprar, possuir e consumir. Em tal contexto, parece não ser possível, para uma pessoa, aceitar que a realidade lhe assinale limites; neste horizonte, não existe sequer um verdadeiro bem comum. Se este é o tipo de sujeito que tende a predominar numa sociedade, as normas serão respeitadas apenas na medida em que não contradigam as necessidades próprias. Por isso, não pensemos só na possibilidade de terríveis fenómenos climáticos ou de grandes desastres naturais, mas também nas catástrofes resultantes de crises sociais, porque a obsessão por um estilo de vida consumista, sobretudo quando poucos têm possibilidades de o manter, só poderá provocar violência e destruição recíproca."}, {"n": 205, "t": "Mas nem tudo está perdido, porque os seres humanos, capazes de tocar o fundo da degradação, podem também superar-se, voltar a escolher o bem e regenerar-se, para além de qualquer condicionalismo psicológico e social que lhes seja imposto. São capazes de se olhar a si mesmos com honestidade, externar o próprio pesar e encetar caminhos novos rumo à verdadeira liberdade. Não há sistemas que anulem, por completo, a abertura ao bem, à verdade e à beleza, nem a capacidade de reagir que Deus continua a animar no mais fundo dos nossos corações. A cada pessoa deste mundo, peço para não esquecer esta sua dignidade que ninguém tem o direito de lhe tirar."}, {"n": 206, "t": "Uma mudança nos estilos de vida poderia chegar a exercer uma pressão salutar sobre quantos detêm o poder político, económico e social. Verifica-se isto quando os movimentos de consumidores conseguem que se deixe de adquirir determinados produtos e assim se tornam eficazes na mudança do comportamento das empresas, forçando-as a reconsiderar o impacto ambiental e os modelos de produção. É um facto que, quando os hábitos da sociedade afectam os ganhos das empresas, estas vêem-se pressionadas a mudar a produção. Isto lembra-nos a responsabilidade social dos consumidores. «Comprar é sempre um acto moral, para além de económico».[146] Por isso, hoje, «o tema da degradação ambiental põe em questão os comportamentos de cada um de nós».[147]"}, {"n": 207, "t": "A Carta da Terra convidava-nos, a todos, a começar de novo deixando para trás uma etapa de autodestruição, mas ainda não desenvolvemos uma consciência universal que o torne possível. Por isso, atrevo-me a propor de novo aquele considerável desafio: «Como nunca antes na história, o destino comum obriga-nos a procurar um novo início (...). Que o nosso seja um tempo que se recorde pelo despertar duma nova reverência face à vida, pela firme resolução de alcançar a sustentabilidade, pela intensificação da luta em prol da justiça e da paz e pela jubilosa celebração da vida».[148]"}, {"n": 208, "t": "Sempre é possível desenvolver uma nova capacidade de sair de si mesmo rumo ao outro. Sem tal capacidade, não se reconhece às outras criaturas o seu valor, não se sente interesse em cuidar de algo para os outros, não se consegue impor limites para evitar o sofrimento ou a degradação do que nos rodeia. A atitude basilar de se auto-transcender, rompendo com a consciência isolada e a auto-referencialidade, é a raiz que possibilita todo o cuidado dos outros e do meio ambiente; e faz brotar a reacção moral de ter em conta o impacto que possa provocar cada acção e decisão pessoal fora de si mesmo. Quando somos capazes de superar o individualismo, pode-se realmente desenvolver um estilo de vida alternativo e torna-se possível uma mudança relevante na sociedade."}, {"h": "2. Educar para a aliança entre a humanidade e o ambiente", "lvl": 1}, {"n": 209, "t": "A consciência da gravidade da crise cultural e ecológica precisa de traduzir-se em novos hábitos. Muitos estão cientes de que não basta o progresso actual e a mera acumulação de objectos ou prazeres para dar sentido e alegria ao coração humano, mas não se sentem capazes de renunciar àquilo que o mercado lhes oferece. Nos países que deveriam realizar as maiores mudanças nos hábitos de consumo, os jovens têm uma nova sensibilidade ecológica e um espírito generoso, e alguns deles lutam admiravelmente pela defesa do meio ambiente, mas cresceram num contexto de altíssimo consumo e bem-estar que torna difícil a maturação doutros hábitos. Por isso, estamos perante um desafio educativo."}, {"n": 210, "t": "A educação ambiental tem vindo a ampliar os seus objectivos. Se, no começo, estava muito centrada na informação científica e na consciencialização e prevenção dos riscos ambientais, agora tende a incluir uma crítica dos «mitos» da modernidade baseados na razão instrumental (individualismo, progresso ilimitado, concorrência, consumismo, mercado sem regras) e tende também a recuperar os distintos níveis de equilíbrio ecológico: o interior consigo mesmo, o solidário com os outros, o natural com todos os seres vivos, o espiritual com Deus. A educação ambiental deveria predispor-nos para dar este salto para o Mistério, do qual uma ética ecológica recebe o seu sentido mais profundo. Além disso, há educadores capazes de reordenar os itinerários pedagógicos duma ética ecológica, de modo que ajudem efectivamente a crescer na solidariedade, na responsabilidade e no cuidado assente na compaixão."}, {"n": 211, "t": "Às vezes, porém, esta educação, chamada a criar uma «cidadania ecológica», limita-se a informar e não consegue fazer maturar hábitos. A existência de leis e normas não é suficiente, a longo prazo, para limitar os maus comportamentos, mesmo que haja um válido controle. Para a norma jurídica produzir efeitos importantes e duradouros, é preciso que a maior parte dos membros da sociedade a tenha acolhido, com base em motivações adequadas, e reaja com uma transformação pessoal. A doação de si mesmo num compromisso ecológico só é possível a partir do cultivo de virtudes sólidas. Se uma pessoa habitualmente se resguarda um pouco mais em vez de ligar o aquecimento, embora as suas economias lhe permitam consumir e gastar mais, isso supõe que adquiriu convicções e modos de sentir favoráveis ao cuidado do ambiente. É muito nobre assumir o dever de cuidar da criação com pequenas acções diárias, e é maravilhoso que a educação seja capaz de motivar para elas até dar forma a um estilo de vida. A educação na responsabilidade ambiental pode incentivar vários comportamentos que têm incidência directa e importante no cuidado do meio ambiente, tais como evitar o uso de plástico e papel, reduzir o consumo de água, diferenciar o lixo, cozinhar apenas aquilo que razoavelmente se poderá comer, tratar com desvelo os outros seres vivos, servir-se dos transportes públicos ou partilhar o mesmo veículo com várias pessoas, plantar árvores, apagar as luzes desnecessárias... Tudo isto faz parte duma criatividade generosa e dignificante, que põe a descoberto o melhor do ser humano. Voltar - com base em motivações profundas - a utilizar algo em vez de o desperdiçar rapidamente pode ser um acto de amor que exprime a nossa dignidade."}, {"n": 212, "t": "E não se pense que estes esforços são incapazes de mudar o mundo. Estas acções espalham, na sociedade, um bem que frutifica sempre para além do que é possível constatar; provocam, no seio desta terra, um bem que sempre tende a difundir-se, por vezes invisivelmente. Além disso, o exercício destes comportamentos restitui-nos o sentimento da nossa dignidade, leva-nos a uma maior profundidade existencial, permite-nos experimentar que vale a pena a nossa passagem por este mundo."}, {"n": 213, "t": "Vários são os âmbitos educativos: a escola, a família, os meios de comunicação, a catequese, e outros. Uma boa educação escolar em tenra idade coloca sementes que podem produzir efeitos durante toda a vida. Mas, quero salientar a importância central da família, porque «é o lugar onde a vida, dom de Deus, pode ser convenientemente acolhida e protegida contra os múltiplos ataques a que está exposta, e pode desenvolver-se segundo as exigências de um crescimento humano autêntico. Contra a denominada cultura da morte, a família constitui a sede da cultura da vida».[149] Na família, cultivam-se os primeiros hábitos de amor e cuidado da vida, como, por exemplo, o uso correcto das coisas, a ordem e a limpeza, o respeito pelo ecossistema local e a protecção de todas as criaturas. A família é o lugar da formação integral, onde se desenvolvem os distintos aspectos, intimamente relacionados entre si, do amadurecimento pessoal. Na família, aprende-se a pedir licença sem servilismo, a dizer «obrigado» como expressão duma sentida avaliação das coisas que recebemos, a dominar a agressividade ou a ganância, e a pedir desculpa quando fazemos algo de mal. Estes pequenos gestos de sincera cortesia ajudam a construir uma cultura da vida compartilhada e do respeito pelo que nos rodeia."}, {"n": 214, "t": "Compete à política e às várias associações um esforço de formação das consciências da população. Naturalmente compete também a Igreja. Todas as comunidades cristãs têm um papel importante a desempenhar nesta educação. Espero também que, nos nossos Seminários e Casas Religiosas de Formação, se eduque para uma austeridade responsável, a grata contemplação do mundo, o cuidado da fragilidade dos pobres e do meio ambiente. Tendo em conta o muito que está em jogo, do mesmo modo que são necessárias instituições dotadas de poder para punir os danos ambientais, também nós precisamos de nos controlar e educar uns aos outros."}, {"n": 215, "t": "Neste contexto, «não se deve descurar nunca a relação que existe entre uma educação estética apropriada e a preservação de um ambiente sadio».[150] Prestar atenção à beleza e amá-la ajuda-nos a sair do pragmatismo utilitarista. Quando não se aprende a parar a fim de admirar e apreciar o que é belo, não surpreende que tudo se transforme em objecto de uso e abuso sem escrúpulos. Ao mesmo tempo, se se quer conseguir mudanças profundas, é preciso ter presente que os modelos de pensamento influem realmente nos comportamentos. A educação será ineficaz e os seus esforços estéreis, se não se preocupar também por difundir um novo modelo relativo ao ser humano, à vida, à sociedade e à relação com a natureza. Caso contrário, continuará a perdurar o modelo consumista, transmitido pelos meios de comunicação social e através dos mecanismos eficazes do mercado."}, {"h": "3. A conversão ecológica", "lvl": 1}, {"n": 216, "t": "A grande riqueza da espiritualidade cristã, proveniente de vinte séculos de experiências pessoais e comunitárias, constitui uma magnífica contribuição para o esforço de renovar a humanidade. Desejo propor aos cristãos algumas linhas de espiritualidade ecológica que nascem das convicções da nossa fé, pois aquilo que o Evangelho nos ensina tem consequências no nosso modo de pensar, sentir e viver. Não se trata tanto de propor ideias, como sobretudo falar das motivações que derivam da espiritualidade para alimentar uma paixão pelo cuidado do mundo. Com efeito, não é possível empenhar-se em coisas grandes apenas com doutrinas, sem uma mística que nos anima, sem «uma moção interior que impele, motiva, encoraja e dá sentido à acção pessoal e comunitária».[151] Temos de reconhecer que nós, cristãos, nem sempre recolhemos e fizemos frutificar as riquezas dadas por Deus à Igreja, nas quais a espiritualidade não está desligada do próprio corpo nem da natureza ou das realidades deste mundo, mas vive com elas e nelas, em comunhão com tudo o que nos rodeia."}, {"n": 217, "t": "Se «os desertos exteriores se multiplicam no mundo, porque os desertos interiores se tornaram tão amplos»,[152] a crise ecológica é um apelo a uma profunda conversão interior. Entretanto temos de reconhecer também que alguns cristãos, até comprometidos e piedosos, com o pretexto do realismo pragmático frequentemente se burlam das preocupações pelo meio ambiente. Outros são passivos, não se decidem a mudar os seus hábitos e tornam-se incoerentes. Falta-lhes, pois, uma conversão ecológica, que comporta deixar emergir, nas relações com o mundo que os rodeia, todas as consequências do encontro com Jesus. Viver a vocação de guardiões da obra de Deus não é algo de opcional nem um aspecto secundário da experiência cristã, mas parte essencial duma existência virtuosa."}, {"n": 218, "t": "Recordemos o modelo de São Francisco de Assis, para propor uma sã relação com a criação como dimensão da conversão integral da pessoa. Isto exige também reconhecer os próprios erros, pecados, vícios ou negligências, e arrepender-se de coração, mudar a partir de dentro. A Igreja na Austrália soube expressar a conversão em termos de reconciliação com a criação: «Para realizar esta reconciliação, devemos examinar as nossas vidas e reconhecer de que modo ofendemos a criação de Deus com as nossas acções e com a nossa incapacidade de agir. Devemos fazer a experiência duma conversão, duma mudança do coração».[153]"}, {"n": 219, "t": "Todavia, para se resolver uma situação tão complexa como esta que enfrenta o mundo actual, não basta que cada um seja melhor. Os indivíduos isolados podem perder a capacidade e a liberdade de vencer a lógica da razão instrumental e acabam por sucumbir a um consumismo sem ética nem sentido social e ambiental. Aos problemas sociais responde-se, não com a mera soma de bens individuais, mas com redes comunitárias: «As exigências desta obra serão tão grandes, que as possibilidades das iniciativas individuais e a cooperação dos particulares, formados de maneira individualista, não serão capazes de lhes dar resposta. Será necessária uma união de forças e uma unidade de contribuições».[154] A conversão ecológica, que se requer para criar um dinamismo de mudança duradoura, é também uma conversão comunitária."}, {"n": 220, "t": "Esta conversão comporta várias atitudes que se conjugam para activar um cuidado generoso e cheio de ternura. Em primeiro lugar, implica gratidão e gratuidade, ou seja, um reconhecimento do mundo como dom recebido do amor do Pai, que consequentemente provoca disposições gratuitas de renúncia e gestos generosos, mesmo que ninguém os veja nem agradeça. «Que a tua mão esquerda não saiba o que faz a tua direita (...); e teu Pai, que vê o oculto, há-de premiar-te» (Mt 6, 3-4). Implica ainda a consciência amorosa de não estar separado das outras criaturas, mas de formar com os outros seres do universo uma estupenda comunhão universal. O crente contempla o mundo, não como alguém que está fora dele, mas dentro, reconhecendo os laços com que o Pai nos uniu a todos os seres. Além disso a conversão ecológica, fazendo crescer as peculiares capacidades que Deus deu a cada crente, leva-o a desenvolver a sua criatividade e entusiasmo para resolver os dramas do mundo, oferecendo-se a Deus «como sacrifício vivo, santo e agradável» (Rm 12, 1). Não vê a sua superioridade como motivo de glória pessoal nem de domínio irresponsável, mas como uma capacidade diferente que, por sua vez, lhe impõe uma grave responsabilidade derivada da sua fé."}, {"n": 221, "t": "Ajudam a enriquecer o sentido de tal conversão várias convicções da nossa fé, desenvolvidas ao início desta encíclica, como, por exemplo, a consciência de que cada criatura reflecte algo de Deus e tem uma mensagem para nos transmitir, ou a certeza de que Cristo assumiu em Si mesmo este mundo material e agora, ressuscitado, habita no íntimo de cada ser, envolvendo-o com o seu carinho e penetrando-o com a sua luz; e ainda o reconhecimento de que Deus criou o mundo, inscrevendo nele uma ordem e um dinamismo que o ser humano não tem o direito de ignorar. Porventura uma pessoa, ouvindo no Evangelho Jesus dizer - a propósito dos pássaros - que «nenhum deles passa despercebido diante de Deus» (Lc 12, 6), será capaz de os maltratar ou causar-lhes dano? Convido todos os cristãos a explicitar esta dimensão da sua conversão, permitindo que a força e a luz da graça recebida se estendam também à relação com as outras criaturas e com o mundo que os rodeia, e suscite aquela sublime fraternidade com a criação inteira que viveu, de maneira tão elucidativa, São Francisco de Assis."}, {"h": "4. Alegria e paz", "lvl": 1}, {"n": 222, "t": "A espiritualidade cristã propõe uma forma alternativa de entender a qualidade de vida, encorajando um estilo de vida profético e contemplativo, capaz de gerar profunda alegria sem estar obcecado pelo consumo. É importante adoptar um antigo ensinamento, presente em distintas tradições religiosas e também na Bíblia. Trata-se da convicção de que «quanto menos, tanto mais». Com efeito, a acumulação constante de possibilidades para consumir distrai o coração e impede de dar o devido apreço a cada coisa e a cada momento. Pelo contrário, tornar-se serenamente presente diante de cada realidade, por mais pequena que seja, abre-nos muitas mais possibilidades de compreensão e realização pessoal. A espiritualidade cristã propõe um crescimento na sobriedade e uma capacidade de se alegrar com pouco. É um regresso à simplicidade que nos permite parar a saborear as pequenas coisas, agradecer as possibilidades que a vida oferece sem nos apegarmos ao que temos nem entristecermos por aquilo que não possuímos. Isto exige evitar a dinâmica do domínio e da mera acumulação de prazeres."}, {"n": 223, "t": "A sobriedade, vivida livre e conscientemente, é libertadora. Não se trata de menos vida, nem vida de baixa intensidade; é precisamente o contrário. Com efeito, as pessoas que saboreiam mais e vivem melhor cada momento são aquelas que deixam de debicar aqui e ali, sempre à procura do que não têm, e experimentam o que significa dar apreço a cada pessoa e a cada coisa, aprendem a familiarizar com as coisas mais simples e sabem alegrar-se com elas. Deste modo conseguem reduzir o número das necessidades insatisfeitas e diminuem o cansaço e a ansiedade. É possível necessitar de pouco e viver muito, sobretudo quando se é capaz de dar espaço a outros prazeres, encontrando satisfação nos encontros fraternos, no serviço, na frutificação dos próprios carismas, na música e na arte, no contacto com a natureza, na oração. A felicidade exige saber limitar algumas necessidades que nos entorpecem, permanecendo assim disponíveis para as múltiplas possibilidades que a vida oferece."}, {"n": 224, "t": "A sobriedade e a humildade não gozaram de positiva consideração no século passado. Mas, quando se debilita de forma generalizada o exercício dalguma virtude na vida pessoal e social, isso acaba por provocar variados desequilíbrios, mesmo ambientais. Por isso, não basta falar apenas da integridade dos ecossistemas; é preciso ter a coragem de falar da integridade da vida humana, da necessidade de incentivar e conjugar todos os grandes valores. O desaparecimento da humildade, num ser humano excessivamente entusiasmado com a possibilidade de dominar tudo sem limite algum, só pode acabar por prejudicar a sociedade e o meio ambiente. Não é fácil desenvolver esta humildade sadia e uma sobriedade feliz, se nos tornamos autónomos, se excluímos Deus da nossa vida fazendo o nosso eu ocupar o seu lugar, se pensamos ser a nossa subjectividade que determina o que é bem e o que é mal."}, {"n": 225, "t": "Por outro lado, ninguém pode amadurecer numa sobriedade feliz, se não estiver em paz consigo mesmo. E parte duma adequada compreensão da espiritualidade consiste em alargar a nossa compreensão da paz, que é muito mais do que a ausência de guerra. A paz interior das pessoas tem muito a ver com o cuidado da ecologia e com o bem comum, porque, autenticamente vivida, reflecte-se num equilibrado estilo de vida aliado com a capacidade de admiração que leva à profundidade da vida. A natureza está cheia de palavras de amor; mas, como poderemos ouvi-las no meio do ruído constante, da distracção permanente e ansiosa, ou do culto da notoriedade? Muitas pessoas experimentam um desequilíbrio profundo, que as impele a fazer as coisas a toda a velocidade para se sentirem ocupadas, numa pressa constante que, por sua vez, as leva a atropelar tudo o que têm ao seu redor. Isto tem incidência no modo como se trata o ambiente. Uma ecologia integral exige que se dedique algum tempo para recuperar a harmonia serena com a criação, reflectir sobre o nosso estilo de vida e os nossos ideais, contemplar o Criador, que vive entre nós e naquilo que nos rodeia e cuja presença «não precisa de ser criada, mas descoberta, desvendada».[155]"}, {"n": 226, "t": "Falamos aqui duma atitude do coração, que vive tudo com serena atenção, que sabe manter-se plenamente presente diante duma pessoa sem estar a pensar no que virá depois, que se entrega a cada momento como um dom divino que se deve viver em plenitude. Jesus ensinou-nos esta atitude, quando nos convidava a olhar os lírios do campo e as aves do céu, ou quando, na presença dum homem inquieto, «fitando nele o olhar, sentiu afeição por ele» (Mc 10, 21). De certeza que Ele estava plenamente presente diante de cada ser humano e de cada criatura, mostrando-nos assim um caminho para superar a ansiedade doentia que nos torna superficiais, agressivos e consumistas desenfreados."}, {"n": 227, "t": "Uma expressão desta atitude é parar e agradecer a Deus antes e depois das refeições. Proponho aos crentes que retomem este hábito importante e o vivam profundamente. Este momento da bênção da mesa, embora muito breve, recorda-nos que a nossa vida depende de Deus, fortalece o nosso sentido de gratidão pelos dons da criação, dá graças por aqueles que com o seu trabalho fornecem estes bens, e reforça a solidariedade com os mais necessitados."}, {"h": "5. Amor civil e político", "lvl": 1}, {"n": 228, "t": "O cuidado da natureza faz parte dum estilo de vida que implica capacidade de viver juntos e de comunhão. Jesus lembrou-nos que temos Deus como nosso Pai comum e que isto nos torna irmãos. O amor fraterno só pode ser gratuito, nunca pode ser uma paga a outrem pelo que realizou, nem um adiantamento pelo que esperamos venha a fazer. Por isso, é possível amar os inimigos. Esta mesma gratuidade leva-nos a amar e aceitar o vento, o sol ou as nuvens, embora não se submetam ao nosso controle. Assim podemos falar duma fraternidade universal."}, {"n": 229, "t": "É necessário voltar a sentir que precisamos uns dos outros, que temos uma responsabilidade para com os outros e o mundo, que vale a pena ser bons e honestos. Vivemos já muito tempo na degradação moral, baldando-nos à ética, à bondade, a fé, à honestidade; chegou o momento de reconhecer que esta alegre superficialidade de pouco nos serviu. Uma tal destruição de todo o fundamento da vida social acaba por colocar-nos uns contra os outros na defesa dos próprios interesses, provoca o despertar de novas formas de violência e crueldade e impede o desenvolvimento duma verdadeira cultura do cuidado do meio ambiente."}, {"n": 230, "t": "O exemplo de Santa Teresa de Lisieux convida-nos a pôr em prática o pequeno caminho do amor, a não perder a oportunidade duma palavra gentil, dum sorriso, de qualquer pequeno gesto que semeie paz e amizade. Uma ecologia integral é feita também de simples gestos quotidianos, pelos quais quebramos a lógica da violência, da exploração, do egoísmo. Pelo contrário, o mundo do consumo exacerbado é, simultaneamente, o mundo que maltrata a vida em todas as suas formas."}, {"n": 231, "t": "O amor, cheio de pequenos gestos de cuidado mútuo, é também civil e político, manifestando-se em todas as acções que procuram construir um mundo melhor. O amor à sociedade e o compromisso pelo bem comum são uma forma eminente de caridade, que toca não só as relações entre os indivíduos, mas também «as macrorrelações como relacionamentos sociais, económicos, políticos».[156] Por isso, a Igreja propôs ao mundo o ideal duma «civilização do amor».[157] O amor social é a chave para um desenvolvimento autêntico: «Para tornar a sociedade mais humana, mais digna da pessoa, é necessário revalorizar o amor na vida social - nos planos político, económico, cultural —- fazendo dele a norma constante e suprema do agir». [158] Neste contexto, juntamente com a importância dos pequenos gestos diários, o amor social impele-nos a pensar em grandes estratégias que detenham eficazmente a degradação ambiental e incentivem uma cultura do cuidado que permeie toda a sociedade. Quando alguém reconhece a vocação de Deus para intervir juntamente com os outros nestas dinâmicas sociais, deve lembrar-se que isto faz parte da sua espiritualidade, é exercício da caridade e, deste modo, amadurece e se santifica."}, {"n": 232, "t": "Nem todos são chamados a trabalhar de forma directa na política, mas no seio da sociedade floresce uma variedade inumerável de associações que intervêm em prol do bem comum, defendendo o meio ambiente natural e urbano. Por exemplo, preocupam-se com um lugar público (um edifício, uma fonte, um monumento abandonado, uma paisagem, uma praça) para proteger, sanar, melhorar ou embelezar algo que é de todos. Ao seu redor, desenvolvem-se ou recuperam-se vínculos, fazendo surgir um novo tecido social local. Assim, uma comunidade liberta-se da indiferença consumista. Isto significa também cultivar uma identidade comum, uma história que se conserva e transmite. Desta forma cuida-se do mundo e da qualidade de vida dos mais pobres, com um sentido de solidariedade que é, ao mesmo tempo, consciência de habitar numa casa comum que Deus nos confiou. Estas acções comunitárias, quando exprimem um amor que se doa, podem transformar-se em experiências espirituais intensas."}, {"h": "6. Os sinais sacramentais e o descanso celebrativo", "lvl": 1}, {"n": 233, "t": "O universo desenvolve-se em Deus, que o preenche completamente. E, portanto, há um mistério a contemplar numa folha, numa vereda, no orvalho, no rosto do pobre. [159] O ideal não é só passar da exterioridade à interioridade para descobrir a acção de Deus na alma, mas também chegar a encontrá-Lo em todas as coisas, como ensinava São Boaventura: «A contemplação é tanto mais elevada quanto mais o homem sente em si mesmo o efeito da graça divina ou quanto mais sabe reconhecer Deus nas outras criaturas».[160]"}, {"n": 234, "t": "São João da Cruz ensinava que tudo o que há de bom nas coisas e experiências do mundo «encontra-se eminentemente em Deus de maneira infinita ou, melhor, Ele é cada uma destas grandezas que se pregam».[161] E isto, não porque as coisas limitadas do mundo sejam realmente divinas, mas porque o místico experimenta a ligação íntima que há entre Deus e todos os seres vivos e, deste modo, «sente que Deus é para ele todas as coisas».[162] Quando admira a grandeza duma montanha, não pode separar isto de Deus, e percebe que tal admiração interior que ele vive, deve finalizar no Senhor: «As montanhas têm cumes, são altas, imponentes, belas, graciosas, floridas e perfumadas. Como estas montanhas, é o meu Amado para mim. Os vales solitários são tranquilos, amenos, frescos, sombreados, ricos de doces águas. Pela variedade das suas árvores e pelo canto suave das aves, oferecem grande divertimento e encanto aos sentidos e, na sua solidão e silêncio, dão refrigério e repouso: como estes vales, é o meu Amado para mim».[163]"}, {"n": 235, "t": "Os sacramentos constituem um modo privilegiado em que a natureza é assumida por Deus e transformada em mediação da vida sobrenatural. Através do culto, somos convidados a abraçar o mundo num plano diferente. A água, o azeite, o fogo e as cores são assumidas com toda a sua força simbólica e incorporam-se no louvor. A mão que abençoa é instrumento do amor de Deus e reflexo da proximidade de Cristo, que veio para Se fazer nosso companheiro no caminho da vida. A água derramada sobre o corpo da criança baptizada, é sinal de vida nova. Não fugimos do mundo, nem negamos a natureza, quando queremos encontrar-nos com Deus. Nota-se isto particularmente na espiritualidade do Oriente cristão. «A beleza, que no Oriente é um dos nomes mais queridos para exprimir a harmonia divina e o modelo da humanidade transfigurada, mostra-se em toda a parte: nas formas do templo, nos sons, nas cores, nas luzes, nos perfumes».[164] Segundo a experiência cristã, todas as criaturas do universo material encontram o seu verdadeiro sentido no Verbo encarnado, porque o Filho de Deus incorporou na sua pessoa parte do universo material, onde introduziu um gérmen de transformação definitiva: «O cristianismo não rejeita a matéria; pelo contrário, a corporeidade é valorizada plenamente no acto litúrgico, onde o corpo humano mostra sua Íntima natureza de templo do Espírito Santo e chega a unir-se a Jesus Senhor, feito também Ele corpo para a salvação do mundo».[165]"}, {"n": 236, "t": "A criação encontra a sua maior elevação na Eucaristia. A graça, que tende a manifestar-se de modo sensível, atinge uma expressão maravilhosa quando o próprio Deus, feito homem, chega ao ponto de fazer-Se comer pela sua criatura. No apogeu do mistério da Encarnação, o Senhor quer chegar ao nosso íntimo através dum pedaço de matéria. Não o faz de cima, mas de dentro, para podermos encontrá-Lo a Ele no nosso próprio mundo. Na Eucaristia, já está realizada a plenitude, sendo o centro vital do universo, centro transbordante de amor e de vida sem fim. Unido ao Filho encarnado, presente na Eucaristia, todo o cosmos dá graças a Deus. Com efeito a Eucaristia é, por si mesma, um acto de amor cósmico. «Sim, cósmico! Porque mesmo quando tem lugar no pequeno altar duma igreja da aldeia, a Eucaristia é sempre celebrada, de certo modo, sobre o altar do mundo».[166] A Eucaristia une o céu e a terra, abraça e penetra toda a criação. O mundo, saído das mãos de Deus, volta a Ele em feliz e plena adoração: no Pão Eucarístico, «a criação propende para a divinização, para as santas núpcias, para a unificação com o próprio Criador».[167] Por isso, a Eucaristia é também fonte de luz e motivação para as nossas preocupações pelo meio ambiente, e leva-nos a ser guardiões da criação inteira."}, {"n": 237, "t": "À participação na Eucaristia é especialmente importante ao domingo. Este dia, à semelhança do sábado judaico, é-nos oferecido como dia de cura das relações do ser humano com Deus, consigo mesmo, com os outros e com o mundo. O domingo é o dia da Ressurreição, o «primeiro dia» da nova criação, que tem as suas primícias na humanidade ressuscitada do Senhor, garantia da transfiguração final de toda a realidade criada. Além disso, este dia anuncia «o descanso eterno do homem, em Deus».[168] Assim, a espiritualidade cristã integra o valor do repouso e da festa. O ser humano tende a reduzir o descanso contemplativo ao âmbito do estéril e do inútil, esquecendo que deste modo se tira à obra realizada o mais importante: o seu significado. Na nossa actividade, somos chamados a incluir uma dimensão receptiva e gratuita, o que é diferente da simples inactividade. Trata-se doutra maneira de agir, que pertence à nossa essência. Assim, a acção humana é preservada não só do activismo vazio, mas também da ganância desenfreada e da consciência que se isola buscando apenas o benefício pessoal. A lei do repouso semanal impunha abster-se do trabalho no sétimo dia, «para que descansem o teu boi e o teu jumento e tomem fôlego o filho da tua serva e o estrangeiro residente» (Ex 23, 12). O repouso é uma ampliação do olhar, que permite voltar a reconhecer os direitos dos outros. Assim o dia de descanso, cujo centro é a Eucaristia, difunde a sua luz sobre a semana inteira e encoraja-nos a assumir o cuidado da natureza e dos pobres."}, {"h": "7. A Trindade e a relação entre as criaturas", "lvl": 1}, {"n": 238, "t": "O Pai é a fonte última de tudo, fundamento amoroso e comunicativo de tudo o que existe. O Filho, que O reflecte e por Quem tudo foi criado, uniu-Se a esta terra, quando foi formado no seio de Maria. O Espírito, vínculo infinito de amor, está intimamente presente no coração do universo, animando e suscitando novos caminhos. O mundo foi criado pelas três Pessoas como um único princípio divino, mas cada uma delas realiza esta obra comum segundo a própria identidade pessoal. Por isso, «quando, admirados, contemplamos o universo na sua grandeza e beleza, devemos louvar a inteira Trindade».[169]"}, {"n": 239, "t": "Para os cristãos, acreditar num Deus único que é comunhão trinitária, leva a pensar que toda a realidade contém em si mesma uma marca propriamente trinitária. São Boaventura chega a dizer que o ser humano, antes do pecado, conseguia descobrir como cada criatura «testemunha que Deus é trino». O reflexo da Trindade podia-se reconhecer na natureza, «quando esse livro não era obscuro para o homem, nem a vista do homem se tinha turvado».[170] Este santo franciscano ensina-nos que toda a criatura traz em si uma estrutura propriamente trinitária, tão real que poderia ser contemplada espontaneamente, se o olhar do ser humano não estivesse limitado, obscurecido e fragilizado. Indica-nos, assim, o desafio de tentar ler a realidade em chave trinitária."}, {"n": 240, "t": "As Pessoas divinas são relações subsistentes; e o mundo, criado segundo o modelo divino, é uma trama de relações. As criaturas tendem para Deus; e é próprio de cada ser vivo tender, por sua vez, para outra realidade, de modo que, no seio do universo, podemos encontrar uma série inumerável de relações constantes que secretamente se entrelaçam.[171] Isto convida-nos não só a admirar os múltiplos vínculos que existem entre as criaturas, mas leva-nos também a descobrir uma chave da nossa própria realização. Na verdade, a pessoa humana cresce, amadurece e santifica-se tanto mais, quanto mais se relaciona, sai de si mesma para viver em comunhão com Deus, com os outros e com todas as criaturas. Assim assume na própria existência aquele dinamismo trinitário que Deus imprimiu nela desde a sua criação. Tudo está interligado, e isto convida-nos a maturar uma espiritualidade da solidariedade global que brota do mistério da Trindade."}, {"h": "8. A Rainha de toda a criação", "lvl": 1}, {"n": 241, "t": "Maria, a mãe que cuidou de Jesus, agora cuida com carinho e preocupação materna deste mundo ferido. Assim como chorou com o coração trespassado a morte de Jesus, assim também agora Se compadece do sofrimento dos pobres crucificados e das criaturas deste mundo exterminadas pelo poder humano. Ela vive, com Jesus, completamente transfigurada, e todas as criaturas cantam a sua beleza. É a Mulher «vestida de sol, com a lua debaixo dos pés e com uma coroa de doze estrelas na cabeça» (Ap 12, 1). Elevada ao céu, é Mãe e Rainha de toda a criação. No seu corpo glorificado, juntamente com Cristo ressuscitado, parte da criação alcançou toda a plenitude da sua beleza. Maria não só conserva no seu coração toda a vida de Jesus, que «guardava» cuidadosamente (cf.Lc 2, 51), mas agora compreende também o sentido de todas as coisas. Por isso, podemos pedir-Lhe que nos ajude a contemplar este mundo com um olhar mais sapiente."}, {"n": 242, "t": "E ao lado d'Ela, na sagrada família de Nazaré, destaca-se a figura de São José. Com o seu trabalho e presença generosa, cuidou e defendeu Maria e Jesus e livrou-os da violência dos injustos, levando-os para o Egipto. No Evangelho, aparece descrito como um homem justo, trabalhador, forte; mas, da sua figura, emana também uma grande ternura, própria não de quem é fraco mas de quem é verdadeiramente forte, atento à realidade para amar e servir humildemente. Por isso, foi declarado protector da Igreja universal. Também Ele nos pode ensinar a cuidar, pode motivar-nos a trabalhar com generosidade e ternura para proteger este mundo que Deus nos confiou."}, {"h": "9. Para além do sol", "lvl": 1}, {"n": 243, "t": "No fim, encontrar-nos-emos face a face com a beleza infinita de Deus (cf.1 Cor13, 12) e poderemos ler, com jubilosa admiração, o mistério do universo, o qual terá parte connosco na plenitude sem fim. Estamos a caminhar para o sábado da eternidade, para a nova Jerusalém, para a casa comum do Céu. Diz-nos Jesus: «Eu renovo todas as coisas» (Ap 21, 5). A vida eterna será uma maravilha compartilhada, onde cada criatura, esplendorosamente transformada, ocupará o seu lugar e terá algo para oferecer aos pobres definitivamente libertados."}, {"n": 244, "t": "Na expectativa da vida eterna, unimo-nos para tomar a nosso cargo esta casa que nos foi confiada, sabendo que aquilo de bom que há nela será assumido na festa do Céu. Juntamente com todas as criaturas, caminhamos nesta terra à procura de Deus, porque, «se o mundo tem um princípio e foi criado, procura quem o criou, procura quem lhe deu início, aquele que é o seu Criador».[172] Caminhemos cantando; que as nossas lutas e a nossa preocupação por este planeta não nos tirem a alegria da esperança."}, {"n": 245, "t": "Deus, que nos chama a uma generosa entrega e a oferecer-Lhe tudo, também nos dá as forças e a luz de que necessitamos para prosseguir. No coração deste mundo, permanece presente o Senhor da vida que tanto nos ama. Não nos abandona, não nos deixa sozinhos, porque Se uniu definitivamente à nossa terra e o seu amor sempre nos leva a encontrar novos caminhos. Que Ele seja louvado!"}, {"n": 246, "t": "Depois desta longa reflexão, jubilosa e ao mesmo tempo dramática, proponho duas orações: uma que podemos partilhar todos quantos acreditam num Deus Criador Omnipotente, e outra pedindo que nós, cristãos, saibamos assumir os compromissos para com a criação que o Evangelho de Jesus nos propõe."}]}, {"id": "oracoes", "title": "Duas orações", "short": "Orações", "items": [{"poem": "Oração pela nossa terra", "id": "o1", "stanzas": [["Deus Omnipotente,", "que estais presente em todo o universo", "e na mais pequenina das vossas criaturas,", "Vós que envolveis com a vossa ternura", "tudo o que existe,", "derramai em nós a força do vosso amor", "para cuidarmos da vida e da beleza.", "Inundai-nos de paz,", "para que vivamos como irmãos e irmãs", "sem prejudicar ninguém.", "Ó Deus dos pobres,", "ajudai-nos a resgatar", "os abandonados e esquecidos desta terra", "que valem tanto aos vossos olhos.", "Curai a nossa vida,", "para que protejamos o mundo", "e não o depredemos,", "para que semeemos beleza", "e não poluição nem destruição.", "Tocai os corações", "daqueles que buscam apenas benefícios", "à custa dos pobres e da terra.", "Ensinai-nos a descobrir o valor de cada coisa,", "a contemplar com encanto,", "a reconhecer que estamos profundamente unidos", "com todas as criaturas", "no nosso caminho para a vossa luz infinita.", "Obrigado porque estais connosco todos os dias.", "Sustentai-nos, por favor, na nossa luta", "pela justiça, o amor e a paz."]]}, {"poem": "Oração cristã com a criação", "id": "o2", "stanzas": [["Nós Vos louvamos, Pai,", "com todas as vossas criaturas,", "que saíram da vossa mão poderosa.", "São vossas e estão repletas da vossa presença", "e da vossa ternura.", "Louvado sejais!"], ["Filho de Deus, Jesus,", "por Vós foram criadas todas as coisas.", "Fostes formado no seio materno de Maria,", "fizestes-Vos parte desta terra,", "e contemplastes este mundo", "com olhos humanos.", "Hoje estais vivo em cada criatura", "com a vossa glória de ressuscitado.", "Louvado sejais!"], ["Espírito Santo, que, com a vossa luz,", "guiais este mundo para o amor do Pai", "e acompanhais o gemido da criação,", "Vós viveis também nos nossos corações", "a fim de nos impelir para o bem.", "Louvado sejais!"], ["Senhor Deus, Uno e Trino,", "comunidade estupenda de amor infinito,", "ensinai-nos a contemplar-Vos", "na beleza do universo,", "onde tudo nos fala de Vós.", "Despertai o nosso louvor e a nossa gratidão", "por cada ser que criastes.", "Dai-nos a graça de nos sentirmos", "intimamente unidos", "a tudo o que existe.", "Deus de amor,", "mostrai-nos o nosso lugar neste mundo", "como instrumentos do vosso carinho", "por todos os seres desta terra,", "porque nem um deles sequer", "é esquecido por Vós.", "Iluminai os donos do poder e do dinheiro", "para que não caiam no pecado da indiferença,", "amem o bem comum, promovam os fracos,", "e cuidem deste mundo que habitamos.", "Os pobres e a terra estão bradando:", "Senhor, tomai-nos", "sob o vosso poder e a vossa luz,", "para proteger cada vida,", "para preparar um futuro melhor,", "para que venha o vosso Reino", "de justiça, paz, amor e beleza.", "Louvado sejais!", "Amen."]]}, {"sign": "Dado em Roma, junto de São Pedro, no dia 24 de Maio — Solenidade de Pentecostes — de 2015, terceiro ano do meu Pontificado.", "by": "Franciscus"}]}], "notes": {"1": "Cantico delle creature: Fonti Francescane, 263.", "2": "Carta ap. Octogesima adveniens (14 de Maio de 1971), 21: AAS 63 (1971), 416-417.", "3": "Discurso à FAO, no seu XXV aniversário (16 de Novembro de 1970), 4: AAS 62 (1970), 833; L’Osservatore Romano (ed. portuguesa de 22/XI/1970), 6.", "4": "Carta enc. Redemptor hominis (4 de Março de 1979), 15: AAS 71 (1979), 287.", "5": "Cf. Catequese (17 de Janeiro de 2001), 4: Insegnamenti 24/1 (2001), 179; L’Osservatore Romano (ed. portuguesa de 20/I/2001), 8.", "6": "Carta enc. Centesimus annus (1 de Maio de 1991), 38: AAS 83 (1991), 841.", "7": "Ibid., 58: o. c., 863.", "8": "João Paulo II, Carta enc. Sollicitudo rei sociali const EXTRA = {"adv": [{"p": "A Regra, as Recomendações e o Testamento de Santa Ângela Merici, comumente denominados “Escritos de Santa Ângela”, foram, de fato, ditados por ela a seu secretário, Gabriel Cozzano; têm, por conseguinte, o estilo e o ritmo de uma língua falada mais do que escrita."}, {"p": "Diversas traduções desses Escritos já foram realizadas. Há dez anos, as Ursulinas da União Romana publicavam uma nova tradução, preparada em Roma por uma equipe de religiosas do Generalato. Por que então, hoje, outra tradução?"}, {"h": "Escritos mericianos: os textos"}, {"h2": "A Regra"}, {"p": "Até, mais ou menos, o meado do século XX, as traduções da Regra de Santa Ângela, quando elas existiam, estavam baseadas numa ou noutra das traduções italianas anteriores, cuja maioria eram reelaborações sucessivas da Regra remanejada por Carlos Borromeu e publicada em 1582."}, {"p": "A edição príncipe fora impressa em Bréscia em 1569, graças aos cuidados de Damião Turlino; descoberta nos anos de 1930–1932, serviu de base às traduções subseqüentes. É o caso, em particular, da tradução que as Ursulinas da União Romana publicaram em 1985. Entrementes, um manuscrito, até então desconhecido, foi descoberto na Biblioteca Trivulziana de Milão. Pode-se datá-lo do fim de 1545 ou do início de 1546. É o documento mais antigo que nós conhecemos."}, {"p": "Remontando a uns cinco ou seis anos após a morte da Santa, este texto está relativamente próximo do momento em que Ângela ditava a Regra a Cozzano. Essa proximidade no tempo deveria nos permitir de encontrar nela, pelo menos em parte, os matizes e os acentos peculiares à língua falada por Ângela. De fato, numerosas minúcias de vocabulário e de sintaxe são típicas do linguajar da época."}, {"p": "O estudo do Códice trivulziano permitiu constatar que existe uma diferença significativa entre esse texto manuscrito e o texto impresso da edição Turlino. Dessa constatação, nasceu o desejo de ter uma tradução que espelhe as qualidades próprias desse “novo” texto. Eis a razão dessa “nova” tradução da Regra, preparada com um particular empenho de respeitar as características da linguagem utilizada no manuscrito."}, {"h2": "Recomendações e Testamento"}, {"p": "Exatamente como na tradução de 1985, a que apresentamos, hoje, está baseada no texto dos Atos do Processo de Canonização de Ângela Merici, no Arquivo Secreto Vaticano, cópia autenticada feita do original de Cozzano: ASV SCRit. Processus vol. 341 f 946v–958v."}, {"p": "Era natural, portanto, pensar em retraduzir Recomendações e Testamento à luz do Códice trivulziano, a fim de encontrar algo da espontaneidade original e, assim, favorecer uma leitura renovada desses Escritos."}, {"h": "Escritos mericianos: linguagem"}, {"p": "Ângela não se exprime em termos literários; ela se esforça sempre em ser clara e precisa; faz questão de salientar os pontos importantes, as razões das normas dadas. E isso, fá-lo espontaneamente, com formas tipicamente orais de insistir e de explicar. Para dar apenas exemplos, encontrar-se-ão, aqui, como aliás no original italiano, repetições, advérbios e conjunções entre outros, que sustentam o desenvolvimento do pensamento. A “Madre” fala ora em longos períodos, ora em frases curtas que, tomadas juntamente, desenvolvem a mesma idéia. Tentamos restituir essas particularidades em nossa tradução."}, {"p": "Os Escritos mericianos contêm citações latinas. Ângela fá-las seguir logo por um “cioè” — isto é. O que ela propõe, porém, não é sempre uma tradução literal do latim; é, de preferência, uma interpretação destinada a elucidar um ponto que ela quer destacar."}, {"p": "Os textos originais não contêm divisão nem numeração. A divisão e a numeração neles utilizadas têm por objetivo ajudar as referências. Maiúsculas e sinais de pontuação foram, mais ou menos, normalizados."}, {"h": "Escritos mericianos: as destinatárias"}, {"p": "É impossível ler, corretamente, os Escritos mericianos sem ter uma idéia das pessoas a quem Ângela os destinava e seu objetivo ao dirigir-se a elas."}, {"p": "A Regra, destinada a todas as virgens da Companhia de Santa Úrsula, indica-lhes a rota a seguir, para se tornarem o que devem ser — as “verdadeiras e virginais esposas do Filho de Deus”."}, {"p": "As Recomendações foram ditadas para as “coronelas”, isto é, para um grupo pequeno de virgens da Companhia — superioras locais, diríamos hoje, e formadoras. As Recomendações eram, para elas, um manual de formação, uma compilação de conselhos que as ajudariam a guiar suas jovens irmãs no caminho da vida espiritual."}, {"p": "Os Legados do Testamento eram reservados às “Matronas”, viúvas nobres de Bréscia, representantes e fiadoras da Companhia perante as autoridades civis e religiosas. Ângela propõe-se a instruí-las sobre a missão cuja dignidade e importância ela sublinha."}, {"p": "Esperamos que esta nova tradução ajude a compreender melhor a palavra viva de Ângela, e leve a um conhecimento mais direto e mais íntimo de sua pessoa e de sua mensagem."}, {"sign": "As tradutoras"}], "daily": [{"k": "rec:p:23"}, {"k": "ls:intro:2", "x": "Esquecemo-nos de que nós mesmos somos terra."}, {"k": "rec:p:15"}, {"k": "ls:intro:13", "x": "O Criador não nos abandona, nunca recua no seu projecto de amor, nem Se arrepende de nos ter criado."}, {"k": "rec:p:17"}, {"k": "ls:c1:49", "x": "Uma verdadeira abordagem ecológica sempre se torna uma abordagem social, que deve integrar a justiça nos debates sobre o meio ambiente, para ouvir tanto o clamor da terra como o clamor dos pobres."}, {"k": "rec:1:11"}, {"k": "ls:c2:84", "x": "O solo, a água, as montanhas: tudo é carícia de Deus."}, {"k": "rec:2:3"}, {"k": "ls:c4:139", "x": "Não há duas crises separadas: uma ambiental e outra social; mas uma única e complexa crise sócio-ambiental."}, {"k": "rec:2:6"}, {"k": "ls:c4:160", "x": "Que tipo de mundo queremos deixar a quem vai suceder-nos, às crianças que estão a crescer?"}, {"k": "rec:3:8"}, {"k": "ls:c6:217", "x": "Viver a vocação de guardiões da obra de Deus não é algo de opcional nem um aspecto secundário da experiência cristã, mas parte essencial duma existência virtuosa."}, {"k": "rec:4:8"}, {"k": "ls:c6:244", "x": "Caminhemos cantando; que as nossas lutas e a nossa preocupação por este planeta não nos tirem a alegria da esperança."}, {"k": "rec:5:12"}, {"k": "ls:c2:91", "x": "Não pode ser autêntico um sentimento de união íntima com os outros seres da natureza, se ao mesmo tempo não houver no coração ternura, compaixão e preocupação pelos seres humanos."}, {"k": "rec:5:17"}, {"k": "ls:c4:138", "x": "Nunca é demais insistir que tudo está interligado."}, {"k": "rec:5:22"}, {"k": "ls:intro:14", "x": "Lanço um convite urgente a renovar o diálogo sobre a maneira como estamos a construir o futuro do planeta."}, {"k": "rec:5:29"}, {"k": "ls:c6:211", "x": "É muito nobre assumir o dever de cuidar da criação com pequenas acções diárias."}, {"k": "rec:5:30"}, {"k": "ls:c2:85", "x": "Deus escreveu um livro estupendo, «cujas letras são representadas pela multidão de criaturas presentes no universo»."}, {"k": "rec:5:31"}, {"k": "ls:c6:233", "x": "O universo desenvolve-se em Deus, que o preenche completamente."}, {"k": "rec:5:43"}, {"k": "ls:c6:222", "x": "A espiritualidade cristã propõe um crescimento na sobriedade e uma capacidade de se alegrar com pouco."}, {"k": "rec:6:2"}, {"k": "ls:c1:30", "x": "O acesso à água potável e segura é um direito humano essencial, fundamental e universal."}, {"k": "rec:7:21"}, {"k": "rec:7:22"}, {"k": "rec:8:2"}, {"k": "rec:8:9"}, {"k": "rec:u:1"}, {"k": "rec:u:15"}, {"k": "rec:u:24"}, {"k": "rec:u:26"}, {"k": "leg:1:7"}, {"k": "leg:2:6"}, {"k": "leg:2:9"}, {"k": "leg:3:1"}, {"k": "leg:10:12"}, {"k": "leg:u:8"}, {"k": "leg:u:12"}, {"k": "leg:u:16"}, {"k": "leg:u:22"}, {"k": "leg:3:9"}]};

Object.values(PARTS).forEach(P=>P.sections.forEach((S,i)=>{S.idx=i;S.part=P;S.byN={};S.items.forEach(it=>{if(it.n)S.byN[it.n]=it})}));

const sec=(p,s)=>PARTS[p]&&PARTS[p].sections.find(x=>x.id===s);
const shortSec=S=>S.id==='p'?'Pról':S.id==='u'?'Últ':S.id;
const stripNotes=t=>t.replace(/\s*\[\d+\]/g,'');
function refShort(p,s,n){const S=sec(p,s);
  if(p==='ls'){const it=S.byN[n];return it&&it.poem?`LS, ${it.ptitle}`:`LS ${n}`}
  return `${PARTS[p].abbr} ${shortSec(S)}${S.id==='p'||S.id==='u'?' ':','}${n}`}
function refLong(p,s,n){const S=sec(p,s);
  if(p==='ls'){const it=S.byN[n];return `Papa Francisco, Laudato Si’, ${it&&it.poem?it.ptitle:n}`}
  return `Santa Ângela Merici, ${PARTS[p].title}, ${S.title}, ${n}`}
const keyOf=(p,s,n)=>`${p}:${s}:${n}`;
const parseKey=k=>{const a=k.split(':');return {p:a[0],s:a[1],n:a.slice(2).join(':')}};
const itemOf=(p,s,n)=>{const S=sec(p,s);return S&&S.byN[n]};
const textOf=(p,s,n)=>{const it=itemOf(p,s,n);return it?it.t:''};
const fold=str=>str.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const curly=s=>s.replace(/"([^"]*)"/g,'“$1”');
function fmtText(s){return esc(s.replace(/\s+\[(\d+)\]/g,'[$1]')).replace(/"([^"]*)"/g,'<span class="lat">“$1”</span>').replace(/\[(\d+)\]/g,'<button class="fn" data-fn="$1" aria-label="Nota $1">$1</button>')}
