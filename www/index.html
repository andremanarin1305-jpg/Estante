truição sem precedentes dos ecossistemas, com graves consequências para todos nós. Por exemplo, a subida do nível do mar pode criar situações de extrema gravidade, se se considera que um quarto da população mundial vive à beira-mar ou muito perto dele, e a maior parte das megacidades estão situadas em áreas costeiras."}, {"n": 25, "t": "As mudanças climáticas são um problema global com graves implicações ambientais, sociais, económicas, distributivas e políticas, constituindo actualmente um dos principais desafios para a humanidade. Provavelmente os impactos mais sérios recairão, nas próximas décadas, sobre os países em vias de desenvolvimento. Muitos pobres vivem em lugares particularmente afectados por fenómenos relacionados com o aquecimento, e os seus meios de subsistência dependem fortemente das reservas naturais e dos chamados serviços do ecossistema como a agricultura, a pesca e os recursos florestais. Não possuem outras disponibilidades económicas nem outros recursos que lhes permitam adaptar-se aos impactos climáticos ou enfrentar situações catastróficas, e gozam de reduzido acesso a serviços sociais e de protecção. Por exemplo, as mudanças climáticas dão origem a migrações de animais e vegetais que nem sempre conseguem adaptar-se; e isto, por sua vez, afecta os recursos produtivos dos mais pobres, que são forçados também a emigrar com grande incerteza quanto ao futuro da sua vida e dos seus filhos. É trágico o aumento de emigrantes em fuga da miséria agravada pela degradação ambiental, que, não sendo reconhecidos como refugiados nas convenções internacionais, carregam o peso da sua vida abandonada sem qualquer tutela normativa. Infelizmente, verifica-se uma indiferença geral perante estas tragédias, que estão acontecendo agora mesmo em diferentes partes do mundo. A falta de reacções diante destes dramas dos nossos irmãos e irmãs é um sinal da perda do sentido de responsabilidade pelos nossos semelhantes, sobre o qual se funda toda a sociedade civil."}, {"n": 26, "t": "Muitos daqueles que detêm mais recursos e poder económico ou político parecem concentrar-se sobretudo em mascarar os problemas ou ocultar os seus sintomas, procurando apenas reduzir alguns impactos negativos de mudanças climáticas. Mas muitos sintomas indicam que tais efeitos poderão ser cada vez piores, se continuarmos com os modelos actuais de produção e consumo. Por isso, tornou-se urgente e imperioso o desenvolvimento de políticas capazes de fazer com que, nos próximos anos, a emissão de dióxido de carbono e outros gases altamente poluentes se reduza drasticamente, por exemplo, substituindo os combustíveis fósseis e desenvolvendo fontes de energia renovável. No mundo, é exíguo o nível de acesso a energias limpas e renováveis. Mas ainda é necessário desenvolver adequadas tecnologias de acumulação. Entretanto, nalguns países, registaram-se avanços que começam a ser significativos, embora estejam longe de atingir uma proporção importante. Houve também alguns investimentos em modalidades de produção e transporte que consomem menos energia exigindo menor quantidade de matérias-primas, bem como em modalidades de construção ou restruturação de edifícios para se melhorar a sua eficiência energética. Mas estas práticas promissoras estão longe de se tornar omnipresentes."}, {"h": "2. A questão da água", "lvl": 1}, {"n": 27, "t": "Outros indicadores da situação actual têm a ver com o esgotamento dos recursos naturais. É bem conhecida a impossibilidade de sustentar o nível actual de consumo dos países mais desenvolvidos e dos sectores mais ricos da sociedade, onde o hábito de desperdiçar e jogar fora atinge níveis inauditos. Já se ultrapassaram certos limites máximos de exploração do planeta, sem termos resolvido o problema da pobreza."}, {"n": 28, "t": "A água potável e limpa constitui uma questão de primordial importância, porque é indispensável para a vida humana e para sustentar os ecossistemas terrestres e aquáticos. As fontes de água doce fornecem os sectores sanitários, agro-pecuários e industriais. A disponibilidade de água manteve-se relativamente constante durante muito tempo, mas agora, em muitos lugares, a procura excede a oferta sustentável, com graves consequências a curto e longo prazo. Grandes cidades, que dependem de importantes reservas hídricas, sofrem períodos de carência do recurso, que, nos momentos críticos, nem sempre se administra com uma gestão adequada e com imparcialidade. A pobreza da água pública verifica-se especialmente na África, onde grandes sectores da população não têm acesso a água potável segura, ou sofrem secas que tornam difícil a produção de alimento. Nalguns países, há regiões com abundância de água, enquanto outras sofrem de grave escassez."}, {"n": 29, "t": "Um problema particularmente sério é o da qualidade da água disponível para os pobres, que diariamente ceifa muitas vidas. Entre os pobres, são frequentes as doenças relacionadas com a água, incluindo as causadas por microorganismos e substâncias químicas. A diarreia e a cólera, devidas a serviços de higiene e reservas de água inadequados, constituem um factor significativo de sofrimento e mortalidade infantil. Em muitos lugares, os lençóis freáticos estão ameaçados pela poluição produzida por algumas actividades extractivas, agrícolas e industriais, sobretudo em países desprovidos de regulamentação e controles suficientes. Não pensamos apenas nas descargas provenientes das fábricas; os detergentes e produtos químicos que a população utiliza em muitas partes do mundo continuam a ser derramados em rios, lagos e mares."}, {"n": 30, "t": "Enquanto a qualidade da água disponível piora constantemente, em alguns lugares cresce a tendência para se privatizar este recurso escasso, tornando-se uma mercadoria sujeita às leis do mercado. Na realidade, o acesso à água potável e segura é um direito humano essencial, fundamental e universal, porque determina a sobrevivência das pessoas e, portanto, é condição para o exercício dos outros direitos humanos. Este mundo tem uma grave dívida social para com os pobres que não têm acesso à água potável, porque isto é negar-lhes o direito à vida radicado na sua dignidade inalienável. Esta dívida é parcialmente saldada com maiores contribuições económicas para prover de água limpa e saneamento as populações mais pobres. Entretanto nota-se um desperdício de água não só nos países desenvolvidos, mas também naqueles em vias de desenvolvimento que possuem grandes reservas. Isto mostra que o problema da água é, em parte, uma questão educativa e cultural, porque não há consciência da gravidade destes comportamentos num contexto de grande desigualdade."}, {"n": 31, "t": "Uma maior escassez de água provocará o aumento do custo dos alimentos e de vários produtos que dependem do seu uso. Alguns estudos assinalaram o risco de sofrer uma aguda escassez de água dentro de poucas décadas, se não forem tomadas medidas urgentes. Os impactos ambientais poderiam afectar milhares de milhões de pessoas, sendo previsível que o controle da água por grandes empresas mundiais se transforme numa das principais fontes de conflitos deste século.[23]"}, {"h": "3. Perda de biodiversidade", "lvl": 1}, {"n": 32, "t": "Os recursos da terra estão a ser depredados também por causa de formas imediatistas de entender a economia e a actividade comercial e produtiva. A perda de florestas e bosques implica simultaneamente a perda de espécies que poderiam constituir, no futuro, recursos extremamente importantes não só para a alimentação mas também para a cura de doenças e vários serviços. As diferentes espécies contêm genes que podem ser recursos-chave para resolver, no futuro, alguma necessidade humana ou regular algum problema ambiental."}, {"n": 33, "t": "Entretanto não basta pensar nas diferentes espécies apenas como eventuais «recursos» exploráveis, esquecendo que possuem um valor em si mesmas. Anualmente, desaparecem milhares de espécies vegetais e animais, que já não poderemos conhecer, que os nossos filhos não poderão ver, perdidas para sempre. A grande maioria delas extingue-se por razões que têm a ver com alguma actividade humana. Por nossa causa, milhares de espécies já não darão glória a Deus com a sua existência, nem poderão comunicar-nos a sua própria mensagem. Não temos direito de o fazer."}, {"n": 34, "t": "Possivelmente perturba-nos saber da extinção dum mamífero ou duma ave, pela sua maior visibilidade; mas, para o bom funcionamento dos ecossistemas, também são necessários os fungos, as algas, os vermes, os pequenos insectos, os répteis e a variedade inumerável de microorganismos. Algumas espécies pouco numerosas, que habitualmente nos passam despercebidas, desempenham uma função censória fundamental para estabelecer o equilíbrio dum lugar. É verdade que o ser humano deve intervir quando um geosistema cai em estado crítico, mas hoje o nível de intervenção humana numa realidade tão complexa como a natureza é tal, que os desastres constantes causados pelo ser humano provocam uma nova intervenção dele de modo que a actividade humana torna-se omnipresente, com todos os riscos que isto implica. Normalmente cria-se um círculo vicioso, no qual a intervenção humana, para resolver uma dificuldade, muitas vezes ainda agrava mais a situação. Por exemplo, muitos pássaros e insectos, que desaparecem por causa dos agro-tóxicos criados pela tecnologia, são úteis para a própria agricultura, e o seu desaparecimento deverá ser compensado por outra intervenção tecnológica que possivelmente trará novos efeitos nocivos. São louváveis e, às vezes, admiráveis os esforços de cientistas e técnicos que procuram dar solução aos problemas criados pelo ser humano. Mas, contemplando o mundo, damo-nos conta de que este nível de intervenção humana, muitas vezes ao serviço da finança e do consumismo, faz com que esta terra onde vivemos se torne realmente menos rica e bela, cada vez mais limitada e cinzenta, enquanto ao mesmo tempo o desenvolvimento da tecnologia e das ofertas de consumo continua a avançar sem limites. Assim, parece que nos iludimos de poder substituir uma beleza insuprível e irrecuperável por outra criada por nós."}, {"n": 35, "t": "Quando se analisa o impacto ambiental de qualquer iniciativa económica, costuma-se olhar para os seus efeitos no solo, na água e no ar, mas nem sempre se inclui um estudo cuidadoso do impacto na biodiversidade, como se a perda de algumas espécies ou de grupos animais ou vegetais fosse algo de pouca relevância. As estradas, os novos cultivos, as reservas, as barragens e outras construções vão tomando posse dos habitats e, por vezes, fragmentam-nos de tal maneira que as populações de animais já não podem migrar nem mover-se livremente, pelo que algumas espécies correm o risco de extinção. Existem alternativas que, pelo menos, mitigam o impacto destas obras, como a criação de corredores biológicos, mas são poucos os países em que se adverte este cuidado e prevenção. Quando se explora comercialmente algumas espécies, nem sempre se estuda a sua modalidade de crescimento para evitar a sua diminuição excessiva e consequente desequilíbrio do ecossistema."}, {"n": 36, "t": "O cuidado dos ecossistemas requer uma perspectiva que se estenda para além do imediato, porque, quando se busca apenas um ganho económico rápido e fácil, já ninguém se importa realmente com a sua preservação. Mas o custo dos danos provocados pela negligência egoísta é muitíssimo maior do que o benefício económico que se possa obter. No caso da perda ou dano grave dalgumas espécies, fala-se de valores que excedem todo e qualquer cálculo. Por isso, podemos ser testemunhas mudas de gravíssimas desigualdades, quando se pretende obter benefícios significativos, fazendo pagar ao resto da humanidade, presente e futura, os altíssimos custos da degradação ambiental."}, {"n": 37, "t": "Alguns países fizeram progressos na conservação eficaz de certos lugares e áreas — na terra e nos oceanos -, proibindo aí toda a intervenção humana que possa modificar a sua fisionomia ou alterar a sua constituição original. No cuidado da biodiversidade, os especialistas insistem na necessidade de prestar uma especial atenção às áreas mais ricas em variedade de espécies, em espécies endémicas, raras ou com menor grau de efectiva protecção. Há lugares que requerem um cuidado particular pela sua enorme importância para o ecossistema mundial, ou que constituem significativas reservas de água assegurando assim outras formas de vida."}, {"n": 38, "t": "Mencionemos, por exemplo, os pulmões do planeta repletos de biodiversidade que são a Amazónia e a bacia fluvial do Congo, ou os grandes lençóis freáticos e os glaciares. A importância destes lugares para o conjunto do planeta e para o futuro da humanidade não se pode ignorar. Os ecossistemas das florestas tropicais possuem uma biodiversidade de enorme complexidade, quase impossível de conhecer completamente, mas quando estas florestas são queimadas ou derrubadas para desenvolver cultivos, em poucos anos perdem-se inúmeras espécies, ou tais áreas transformam-se em áridos desertos. Todavia, ao falar sobre estes lugares, impõe-se um delicado equilíbrio, porque não é possível ignorar também os enormes interesses económicos internacionais que, a pretexto de cuidar deles, podem atentar contra as soberanias nacionais. Com efeito, há «propostas de internacionalização da Amazónia que só servem aos interesses económicos das corporações internacionais».[24] É louvável a tarefa de organismos internacionais e organizações da sociedade civil que sensibilizam as populações e colaboram de forma crítica, inclusive utilizando legítimos mecanismos de pressão, para que cada governo cumpra o dever próprio e não-delegável de preservar o meio ambiente e os recursos naturais do seu país, sem se vender a espúrios interesses locais ou internacionais."}, {"n": 39, "t": "Habitualmente também não se faz objecto de adequada análise a substituição da flora silvestre por áreas florestais com árvores, que geralmente são monoculturas. É que pode afectar gravemente uma biodiversidade que não é albergada pelas novas espécies que se implantam. Também as zonas húmidas, que são transformadas em terrenos agrícolas, perdem a enorme biodiversidade que abrigavam. É preocupante, nalgumas áreas costeiras, o desaparecimento dos ecossistemas constituídos por manguezais."}, {"n": 40, "t": "Os oceanos contêm não só a maior parte da água do planeta, mas também a maior parte da vasta variedade dos seres vivos, muitos deles ainda desconhecidos para nós e ameaçados por diversas causas. Além disso, a vida nos rios, lagos, mares e oceanos, que nutre grande parte da população mundial, é afectada pela extracção descontrolada dos recursos ictíicos, que provoca drásticas diminuições dalgumas espécies. E no entanto continuam a desenvolver-se modalidades selectivas de pesca, que descartam grande parte das espécies apanhadas. Particularmente ameaçados estão organismos marinhos que não temos em consideração, como certas formas de plâncton que constituem um componente muito importante da cadeia alimentar marinha e de que dependem, em última instância, espécies que se utilizam para a alimentação humana."}, {"n": 41, "t": "Passando aos mares tropicais e subtropicais, encontramos os recifes de coral, que equivalem às grandes florestas da terra firme, porque abrigam cerca de um milhão de espécies, incluindo peixes, caranguejos, moluscos, esponjas, algas e outras. Hoje, muitos dos recifes de coral no mundo já são estéreis ou encontram-se num estado contínuo de declínio: «Quem transformou o maravilhoso mundo marinho em cemitérios subaquáticos despojados de vida e de cor?»[25] Este fenómeno deve-se, em grande parte, à poluição que chega ao mar resultante do desflorestamento, das monoculturas agrícolas, das descargas industriais e de métodos de pesca destrutivos, nomeadamente os que utilizam cianeto e dinamite. É agravado pelo aumento da temperatura dos oceanos. Tudo isso nos ajuda a compreender como qualquer acção sobre a natureza pode ter consequências que não advertimos à primeira vista e como certas formas de exploração de recursos se obtêm à custa duma degradação que acaba por chegar até ao fundo dos oceanos."}, {"n": 42, "t": "É preciso investir muito mais na pesquisa para se entender melhor o comportamento dos ecossistemas e analisar adequadamente as diferentes variáveis de impacto de qualquer modificação importante do meio ambiente. Visto que todas as criaturas estão interligadas, deve ser reconhecido com carinho e admiração o valor de cada uma, e todos nós, seres criados, precisamos uns dos outros. Cada território detém uma parte de responsabilidade no cuidado desta família, pelo que deve fazer um inventário cuidadoso das espécies que alberga a fim de desenvolver programas e estratégias de protecção, cuidando com particular solicitude das espécies em vias de extinção."}, {"h": "4. Deterioração da qualidade de vida humana e degradação social", "lvl": 1}, {"n": 43, "t": "Tendo em conta que o ser humano também é uma criatura deste mundo, que tem direito a viver e ser feliz e, além disso, possui uma dignidade especial, não podemos deixar de considerar os efeitos da degradação ambiental, do modelo actual de desenvolvimento e da cultura do descarte sobre a vida das pessoas."}, {"n": 44, "t": "Nota-se hoje, por exemplo, o crescimento desmedido e descontrolado de muitas cidades que se tornaram pouco saudáveis para viver, devido não só à poluição proveniente de emissões tóxicas mas também ao caos urbano, aos problemas de transporte e à poluição visiva e acústica. Muitas cidades são grandes estruturas que não funcionam, gastando energia e água em excesso. Há bairros que, embora construídos recentemente, apresentam-se congestionados e desordenados, sem espaços verdes suficientes. Não é conveniente para os habitantes deste planeta viver cada vez mais submersos de cimento, asfalto, vidro e metais, privados do contacto físico com a natureza."}, {"n": 45, "t": "Nalguns lugares, rurais e urbanos, a privatização dos espaços tornou difícil o acesso dos cidadãos a áreas de especial beleza; noutros, criaram-se áreas residenciais «ecológicas» postas à disposição só de poucos, procurando-se evitar que outros entrem a perturbar uma tranquilidade artificial. Muitas vezes encontra-se uma cidade bela e cheia de espaços verdes e bem cuidados nalgumas áreas «seguras», mas não em áreas menos visíveis, onde vivem os descartados da sociedade."}, {"n": 46, "t": "Entre os componentes sociais da mudança global, incluem-se os efeitos laborais dalgumas inovações tecnológicas, a exclusão social, a desigualdade no fornecimento e consumo da energia e doutros serviços, a fragmentação social, o aumento da violência e o aparecimento de novas formas de agressividade social, o narcotráfico e o consumo crescente de drogas entre os mais jovens, a perda de identidade. São alguns sinais, entre outros, que mostram como o crescimento nos últimos dois séculos não significou, em todos os seus aspectos, um verdadeiro progresso integral e uma melhoria da qualidade de vida. Alguns destes sinais são ao mesmo tempo sintomas duma verdadeira degradação social, duma silenciosa ruptura dos vínculos de integração e comunhão social."}, {"n": 47, "t": "A isto vêm juntar-se as dinâmicas dos mass-media e do mundo digital, que, quando se tornam omnipresentes, não favorecem o desenvolvimento duma capacidade de viver com sabedoria, pensar em profundidade, amar com generosidade. Neste contexto, os grandes sábios do passado correriam o risco de ver sufocada a sua sabedoria no meio do ruído dispersivo da informação. Isto exige de nós um esforço para que esses meios se traduzam num novo desenvolvimento cultural da humanidade, e não numa deterioração da sua riqueza mais profunda. A verdadeira sabedoria, fruto da reflexão, do diálogo e do encontro generoso entre as pessoas, não se adquire com uma mera acumulação de dados, que, numa espécie de poluição mental, acabam por saturar e confundir. Ao mesmo tempo tendem a substituir as relações reais com os outros, com todos os desafios que implicam, por um tipo de comunicação mediada pela internet. Isto permite seleccionar ou eliminar a nosso arbítrio as relações e, deste modo, frequentemente gera-se um novo tipo de emoções artificiais, que têm a ver mais com dispositivos e monitores do que com as pessoas e a natureza. Os meios actuais permitem-nos comunicar e partilhar conhecimentos e afectos. Mas, às vezes, também nos impedem de tomar contacto directo com a angústia, a trepidação, a alegria do outro e com a complexidade da sua experiência pessoal. Por isso, não deveria surpreender-nos o facto de, a par da oferta sufocante destes produtos, ir crescendo uma profunda e melancólica insatisfação nas relações interpessoais ou um nocivo isolamento."}, {"h": "5. Desigualdade planetária", "lvl": 1}, {"n": 48, "t": "O ambiente humano e o ambiente natural degradam-se em conjunto; e não podemos enfrentar adequadamente a degradação ambiental, se não prestarmos atenção às causas que têm a ver com a degradação humana e social. De facto, a deterioração do meio ambiente e a da sociedade afectam de modo especial os mais frágeis do planeta: «Tanto a experiência comum da vida quotidiana como a investigação científica demonstram que os efeitos mais graves de todas as agressões ambientais recaem sobre as pessoas mais pobres».[26] Por exemplo, o esgotamento das reservas ictíicas prejudica especialmente as pessoas que vivem da pesca artesanal e não possuem qualquer maneira de a substituir, a poluição da água afecta particularmente os mais pobres que não têm possibilidades de comprar água engarrafada, e a elevação do nível do mar afecta principalmente as populações costeiras mais pobres que não têm para onde se transferir. O impacto dos desequilíbrios actuais manifesta-se também na morte prematura de muitos pobres, nos conflitos gerados pela falta de recursos e em muitos outros problemas que não têm espaço suficiente nas agendas mundiais.[27]"}, {"n": 49, "t": "Gostaria de assinalar que muitas vezes falta uma consciência clara dos problemas que afectam particularmente os excluídos. Estes são a maioria do planeta, milhares de milhões de pessoas. Hoje são mencionados nos debates políticos e económicos internacionais, mas com frequência parece que os seus problemas se coloquem como um apêndice, como uma questão que se acrescenta quase por obrigação ou perifericamente, quando não são considerados meros danos colaterais. Com efeito, na hora da implementação concreta, permanecem frequentemente no último lugar. Isto deve-se, em parte, ao facto de que muitos profissionais, formadores de opinião, meios de comunicação e centros de poder estão localizados longe deles, em áreas urbanas isoladas, sem ter contacto directo com os seus problemas. Vivem e reflectem a partir da comodidade dum desenvolvimento e duma qualidade de vida que não está ao alcance da maioria da população mundial. Esta falta de contacto físico e de encontro, as vezes favorecida pela fragmentação das nossas cidades, ajuda a cauterizar a consciência e a ignorar parte da realidade em análises tendenciosas. Isto, as vezes, coexiste com um discurso «verde». Mas, hoje, não podemos deixar de reconhecer que uma verdadeira abordagem ecológica sempre se torna uma abordagem social, que deve integrar a justiça nos debates sobre o meio ambiente, para ouvir tanto o clamor da terra como o clamor dos pobres."}, {"n": 50, "t": "Em vez de resolver os problemas dos pobres e pensar num mundo diferente, alguns limitam-se a propor uma redução da natalidade. Não faltam pressões internacionais sobre os países em vias de desenvolvimento, que condicionam as ajudas económicas a determinadas políticas de «saúde reprodutiva». Mas, «se é verdade que a desigual distribuição da população e dos recursos disponíveis cria obstáculos ao desenvolvimento e ao uso sustentável do ambiente, deve-se reconhecer que o crescimento demográfico é plenamente compatível com um desenvolvimento integral e solidário».[28] Culpar o incremento demográfico em vez do consumismo exacerbado e selectivo de alguns é uma forma de não enfrentar os problemas. Pretende-se, assim, legitimar o modelo distributivo actual, no qual uma minoria se julga com o direito de consumir numa proporção que seria impossível generalizar, porque o planeta não poderia sequer conter os resíduos de tal consumo. Além disso, sabemos que se desperdiça aproximadamente um terço dos alimentos produzidos, e «a comida que se desperdiça é como se fosse roubada da mesa do pobre».[29] Em todo o caso, é verdade que devemos prestar atenção ao desequilíbrio na distribuição da população pelo território, tanto a nível nacional como a nível mundial, porque o aumento do consumo levaria a situações regionais complexas pelas combinações de problemas ligados à poluição ambiental, ao transporte, ao tratamento de resíduos, à perda de recursos, à qualidade de vida."}, {"n": 51, "t": "A desigualdade não afecta apenas os indivíduos mas países inteiros, e obriga a pensar numa ética das relações internacionais. Com efeito, há uma verdadeira «dívida ecológica», particularmente entre o Norte e o Sul, ligada a desequilíbrios comerciais com consequências no âmbito ecológico e com o uso desproporcionado dos recursos naturais efectuado historicamente por alguns países. As exportações de algumas matérias-primas para satisfazer os mercados no Norte industrializado produziram danos locais, como, por exemplo, a contaminação com mercúrio na extracção minerária do ouro ou com o dióxido de enxofre na do cobre. De modo especial é preciso calcular o espaço ambiental de todo o planeta usado para depositar resíduos gasosos que se foram acumulando ao longo de dois séculos e criaram uma situação que agora afecta todos os países do mundo. O aquecimento causado pelo enorme consumo de alguns países ricos tem repercussões nos lugares mais pobres da terra, especialmente na África, onde o aumento da temperatura, juntamente com a seca, tem efeitos desastrosos no rendimento das cultivações. A isto acrescentam-se os danos causados pela exportação de resíduos sólidos e líquidos tóxicos para os países em vias de desenvolvimento e pela actividade poluente de empresas que fazem nos países menos desenvolvidos aquilo que não podem fazer nos países que lhes dão o capital: «Constatamos frequentemente que as empresas que assim procedem são multinacionais, que fazem aqui o que não lhes é permitido em países desenvolvidos ou do chamado primeiro mundo. Geralmente, quando cessam as suas actividades e se retiram, deixam grandes danos humanos e ambientais, como o desemprego, aldeias sem vida, esgotamento dalgumas reservas naturais, desflorestamento, empobrecimento da agricultura e pecuária local, crateras, colinas devastadas, rios poluídos e qualquer obra social que já não se pode sustentar».[30]"}, {"n": 52, "t": "A dívida externa dos países pobres transformou-se num instrumento de controle, mas não se dá o mesmo com a dívida ecológica. De várias maneiras os povos em vias de desenvolvimento, onde se encontram as reservas mais importantes da biosfera, continuam a alimentar o progresso dos países mais ricos à custa do seu presente e do seu futuro. A terra dos pobres do Sul é rica e pouco contaminada, mas o acesso à propriedade de bens e recursos para satisfazerem as suas carências vitais é-lhes vedado por um sistema de relações comerciais e de propriedade estruturalmente perverso. É necessário que os países desenvolvidos contribuam para resolver esta dívida, limitando significativamente o consumo de energia não renovável e fornecendo recursos aos países mais necessitados para promover políticas e programas de desenvolvimento sustentável. As regiões e os países mais pobres têm menos possibilidade de adoptar novos modelos de redução do impacto ambiental, porque não têm a preparação para desenvolver os processos necessários nem podem cobrir os seus custos. Por isso, deve-se manter claramente a consciência de que a mudança climática tem responsabilidades diversificadas e, como disseram os bispos dos Estados Unidos, é oportuno concentrar-se «especialmente sobre as necessidades dos pobres, fracos e vulneráveis, num debate muitas vezes dominado pelos interesses mais poderosos».[31] É preciso revigorar a consciência de que somos uma única família humana. Não há fronteiras nem barreiras políticas ou sociais que permitam isolar-nos e, por isso mesmo, também não há espaço para a globalização da indiferença."}, {"h": "6. A fraqueza das reacções", "lvl": 1}, {"n": 53, "t": "Estas situações provocam os gemidos da irmã terra, que se unem aos gemidos dos abandonados do mundo, com um lamento que reclama de nós outro rumo. Nunca maltratámos e ferimos a nossa casa comum como nos últimos dois séculos. Mas somos chamados a tornar-nos os instrumentos de Deus Pai para que o nosso planeta seja o que Ele sonhou ao criá-lo e corresponda ao seu projecto de paz, beleza e plenitude. O problema é que não dispomos ainda da cultura necessária para enfrentar esta crise e há necessidade de construir lideranças que tracem caminhos, procurando dar resposta às necessidades das gerações actuais, todos incluídos, sem prejudicar as gerações futuras. Torna-se indispensável criar um sistema normativo que inclua limites invioláveis e assegure a protecção dos ecossistemas, antes que as novas formas de poder derivadas do paradigma tecno-económico acabem por arrasá-los não só com a política, mas também com a liberdade e a justiça."}, {"n": 54, "t": "Preocupa a fraqueza da reacção política internacional. A submissão da política à tecnologia e à finança demonstra-se na falência das cimeiras mundiais sobre o meio ambiente. Há demasiados interesses particulares e, com muita facilidade, o interesse económico chega a prevalecer sobre o bem comum e manipular a informação para não ver afectados os seus projectos. Nesta linha, o Documento de Aparecida pede que, «nas intervenções sobre os recursos naturais, não predominem os interesses de grupos económicos que arrasam irracionalmente as fontes da vida».[32] A aliança entre economia e tecnologia acaba por deixar de fora tudo o que não faz parte dos seus interesses imediatos. Deste modo, poder-se-á esperar apenas algumas proclamações superficiais, acções filantrópicas isoladas e ainda esforços por mostrar sensibilidade para com o meio ambiente, enquanto, na realidade, qualquer tentativa das organizações sociais para alterar as coisas será vista como um distúrbio provocado por sonhadores românticos ou como um obstáculo a superar."}, {"n": 55, "t": "Pouco a pouco alguns países podem mostrar progressos significativos, o desenvolvimento de controles mais eficientes e uma luta mais sincera contra a corrupção. Cresceu a sensibilidade ecológica das populações, mas é ainda insuficiente para mudar os hábitos nocivos de consumo, que não parecem diminuir; antes, expandem-se e desenvolvem-se. É o que acontece - só para dar um exemplo simples — com o crescente aumento do uso e intensidade dos condicionadores de ar: os mercados, apostando num ganho imediato, estimulam ainda mais a procura. Se alguém observasse de fora a sociedade planetária, maravilhar-se-ia com tal comportamento que às vezes parece suicida."}, {"n": 56, "t": "Entretanto os poderes económicos continuam a justificar o sistema mundial actual, onde predomina uma especulação e uma busca de receitas financeiras que tendem a ignorar todo o contexto e os efeitos sobre a dignidade humana e sobre o meio ambiente. Assim se manifesta como estão intimamente ligadas a degradação ambiental e a degradação humana e ética. Muitos dirão que não têm consciência de realizar acções imorais, porque a constante distracção nos tira a coragem de advertir a realidade dum mundo limitado e finito. Por isso, hoje, «qualquer realidade que seja frágil, como o meio ambiente, fica indefesa face aos interesses do mercado divinizado, transformados em regra absoluta».[33]"}, {"n": 57, "t": "É previsível que, perante o esgotamento de alguns recursos, se vá criando um cenário favorável para novas guerras, disfarçadas sob nobres reivindicações. A guerra causa sempre danos graves ao meio ambiente e à riqueza cultural dos povos, e os riscos avolumam-se quando se pensa na energia nuclear e nas armas biológicas. Com efeito, «não obstante haver acordos internacionais que proíbem a guerra química, bacteriológica e biológica, subsiste o facto de continuarem nos laboratórios as pesquisas para o desenvolvimento de novas armas ofensivas, capazes de alterar os equilíbrios naturais».[34] Exige-se da política uma maior atenção para prevenir e resolver as causas que podem dar origem a novos conflitos. Entretanto o poder, ligado com a finança, é o que maior resistência põe a tal esforço, e os projectos políticos carecem muitas vezes de amplitude de horizonte. Para que se quer preservar hoje um poder que será recordado pela sua incapacidade de intervir quando era urgente e necessário fazê-lo?"}, {"n": 58, "t": "Nalguns países, há exemplos positivos de resultados na melhoria do ambiente, tais como o saneamento de alguns rios que foram poluídos durante muitas décadas, a recuperação de florestas nativas, o embelezamento de paisagens com obras de saneamento ambiental, projectos de edifícios de grande valor estético, progressos na produção de energia limpa, na melhoria dos transportes públicos. Estas acções não resolvem os problemas globais, mas confirmam que o ser humano ainda é capaz de intervir de forma positiva. Como foi criado para amar, no meio dos seus limites germinam inevitavelmente gestos de generosidade, solidariedade e desvelo."}, {"n": 59, "t": "Ao mesmo tempo cresce uma ecologia superficial ou aparente que consolida um certo torpor e uma alegre irresponsabilidade. Como frequentemente acontece em épocas de crises profundas, que exigem decisões corajosas, somos tentados a pensar que aquilo que está a acontecer não é verdade. Se nos detivermos na superfície, para além de alguns sinais visíveis de poluição e degradação, parece que as coisas não estejam assim tão graves e que o planeta poderia subsistir ainda por muito tempo nas condições actuais. Este comportamento evasivo serve-nos para mantermos os nossos estilos de vida, de produção e consumo. É a forma como o ser humano se organiza para alimentar todos os vícios autodestrutivos: tenta não os ver, luta para não os reconhecer, adia as decisões importantes, age como se nada tivesse acontecido."}, {"h": "7. Diversidade de opiniões", "lvl": 1}, {"n": 60, "t": "Finalmente reconhecemos, a propósito da situação e das possíveis soluções, que se desenvolveram diferentes perspectivas e linhas de pensamento. Num dos extremos, alguns defendem a todo o custo o mito do progresso, afirmando que os problemas ecológicos resolver-se-ão simplesmente com novas aplicações técnicas, sem considerações éticas nem mudanças de fundo. No extremo oposto, outros pensam que o ser humano, com qualquer uma das suas intervenções, só pode ameaçar e comprometer o ecossistema mundial, pelo que convém reduzir a sua presença no planeta e impedir-lhe todo o tipo de intervenção. Entre estes extremos, a reflexão deveria identificar possíveis cenários futuros, porque não existe só um caminho de solução. Isto deixaria espaço para uma variedade de contribuições que poderiam entrar em diálogo a fim de se chegar a respostas abrangentes."}, {"n": 61, "t": "Sobre muitas questões concretas, a Igreja não tem motivo para propor uma palavra definitiva e entende que deve escutar e promover o debate honesto entre os cientistas, respeitando a diversidade de opiniões. Basta, porém, olhar a realidade com sinceridade, para ver que há uma grande deterioração da nossa casa comum. A esperança convida-nos a reconhecer que sempre há uma saída, sempre podemos mudar de rumo, sempre podemos fazer alguma coisa para resolver os problemas. Todavia parece notar-se sintomas dum ponto de ruptura, por causa da alta velocidade das mudanças e da degradação, que se manifestam tanto em catástrofes naturais regionais como em crises sociais ou mesmo financeiras, uma vez que os problemas do mundo não se podem analisar nem explicar de forma isolada. Há regiões que já se encontram particularmente em risco e, prescindindo de qualquer previsão catastrófica, o certo é que o actual sistema mundial é insustentável a partir de vários pontos de vista, porque deixamos de pensar nas finalidades da acção humana: «Se o olhar percorre as regiões do nosso planeta, apercebemo-nos depressa de que a humanidade frustrou a expectativa divina».[35]"}]}, {"id": "c2", "title": "Capítulo II", "sub": "O Evangelho da criação", "short": "II", "items": [{"n": 62, "t": "Por que motivo incluir, neste documento dirigido a todas as pessoas de boa vontade, um capítulo referido às convicções de fé? Não ignoro que alguns, no campo da política e do pensamento, rejeitam decididamente a ideia de um Criador ou consideram-na irrelevante, chegando ao ponto de relegar para o reino do irracional a riqueza que as religiões possam oferecer para uma ecologia integral e o pleno desenvolvimento do género humano; outras vezes, supõe-se que elas constituam uma subcultura, que se deve simplesmente tolerar. Todavia a ciência e a religião, que fornecem diferentes abordagens da realidade, podem entrar num diálogo intenso e frutuoso para ambas."}, {"h": "1. A luz que a fé oferece", "lvl": 1}, {"n": 63, "t": "Se tivermos presente a complexidade da crise ecológica e as suas múltiplas causas, deveremos reconhecer que as soluções não podem vir duma única maneira de interpretar e transformar a realidade. É necessário recorrer também às diversas riquezas culturais dos povos, à arte e à poesia, à vida interior e à espiritualidade. Se quisermos, de verdade, construir uma ecologia que nos permita reparar tudo o que temos destruído, então nenhum ramo das ciências e nenhuma forma de sabedoria pode ser transcurada, nem sequer a sabedoria religiosa com a sua linguagem própria. Além disso, a Igreja Católica está aberta ao diálogo com o pensamento filosófico, o que lhe permite produzir várias sínteses entre fé e razão. No que diz respeito às questões sociais, pode-se constatar isto mesmo no desenvolvimento da doutrina social da Igreja, chamada a enriquecer-se cada vez mais a partir dos novos desafios."}, {"n": 64, "t": "Por outro lado, embora esta encíclica se abra a um diálogo com todos para, juntos, buscarmos caminhos de libertação, quero mostrar desde o início como as convicções da fé oferecem aos cristãos — e, em parte, também a outros crentes — motivações altas para cuidar da natureza e dos irmãos e irmãs mais frágeis. Se pelo simples facto de ser humanas, as pessoas se sentem movidas a cuidar do ambiente de que fazem parte, «os cristãos, em particular, advertem que a sua tarefa no seio da criação e os seus deveres em relação à natureza e ao Criador fazem parte da sua fé».[36] Por isso é bom, para a humanidade e para o mundo, que nós, crentes, conheçamos melhor os compromissos ecológicos que brotam das nossas convicções."}, {"h": "2. A sabedoria das narrações bíblicas", "lvl": 1}, {"n": 65, "t": "Sem repropor aqui toda a teologia da Criação, queremos saber o que nos dizem as grandes narrações bíblicas sobre a relação do ser humano com o mundo. Na primeira narração da obra criadora, no livro do Génesis, o plano de Deus inclui a criação da humanidade. Depois da criação do homem e da mulher, diz-se que «Deus, vendo a sua obra, considerou-a muito boa» (Gn 1, 31). A Bíblia ensina que cada ser humano é criado por amor, feito à imagem e semelhança de Deus (cf. Gn 1, 26). Esta afirmação mostra-nos a imensa dignidade de cada pessoa humana, que «não é somente alguma coisa, mas alguém. É capaz de se conhecer, de se possuir e de livremente se dar e entrar em comunhão com outras pessoas».[37] São João Paulo II recordou que o amor muito especial que o Criador tem por cada ser humano «confere-lhe uma dignidade infinita». [38] Todos aqueles que estão empenhados na defesa da dignidade das pessoas podem encontrar, na fé cristã, as razões mais profundas para tal compromisso. Como é maravilhosa a certeza de que a vida de cada pessoa não se perde num caos desesperador, num mundo regido pelo puro acaso ou por ciclos que se repetem sem sentido! O Criador pode dizer a cada um de nós: «Antes de te haver formado no ventre materno, Eu já te conhecia» (Jr 1, 5). Fomos concebidos no coração de Deus e, por isso, «cada um de nós é o fruto de um pensamento de Deus. Cada um de nós é querido, cada um de nós é amado, cada um é necessário».[39]"}, {"n": 66, "t": "As narrações da criação no livro do Génesis contêm, na sua linguagem simbólica e narrativa, ensinamentos profundos sobre a existência humana e a sua realidade histórica. Estas narrações sugerem que a existência humana se baseia sobre três relações fundamentais intimamente ligadas: as relações com Deus, com o próximo e com a terra. Segundo a Bíblia, estas três relações vitais romperam-se não só exteriormente, mas também dentro de nós. Esta ruptura é o pecado. A harmonia entre o Criador, a humanidade e toda a criação foi destruída por termos pretendido ocupar o lugar de Deus, recusando reconhecer-nos como criaturas limitadas. Este facto distorceu também a natureza do mandato de «dominar» a terra (cf. Gn 1, 28) e de a «cultivar e guardar» (cf. Gn 2, 15). Como resultado, a relação originariamente harmoniosa entre o ser humano e a natureza transformou-se num conflito (cf. Gn 3, 17-19). Por isso, é significativo que a harmonia vivida por São Francisco de Assis com todas as criaturas tenha sido interpretada como uma sanação daquela ruptura. Dizia São Boaventura que, através da reconciliação universal com todas as criaturas, Francisco voltara de alguma forma ao estado de inocência original.[40] Longe deste modelo, o pecado manifesta-se hoje, com toda a sua força de destruição, nas guerras, nas várias formas de violência e abuso, no abandono dos mais frágeis, nos ataques contra a natureza."}, {"n": 67, "t": "Não somos Deus. A terra existe antes de nós e foi-nos dada. Isto permite responder a uma acusação lançada contra o pensamento judaico-cristão: foi dito que a narração do Génesis, que convida a «dominar» a terra (cf. Gn 1, 28), favoreceria a exploração selvagem da natureza, apresentando uma imagem do ser humano como dominador e devastador. Mas esta não é uma interpretação correcta da Bíblia, como a entende a Igreja. Se é verdade que nós, cristãos, algumas vezes interpretámos de forma incorrecta as Escrituras, hoje devemos decididamente rejeitar que, do facto de ser criados à imagem de Deus e do mandato de dominar a terra, se deduza um domínio absoluto sobre as outras criaturas. É importante ler os textos bíblicos no seu contexto, com uma justa hermenêutica, e lembrar que nos convidam a «cultivar e guardar» o jardim do mundo (cf. Gn 2, 15). Enquanto «cultivar» quer dizer lavrar ou trabalhar um terreno, «guardar» significa proteger, cuidar, preservar, velar. Isto implica uma relação de reciprocidade responsável entre o ser humano e a natureza. Cada comunidade pode tomar da bondade da terra aquilo de que necessita para a sua sobrevivência, mas tem também o dever de a proteger e garantir a continuidade da sua fertilidade para as gerações futuras. Em última análise, «ao Senhor pertence a terra» (Sl 24/23, 1), a Ele pertence «a terra e tudo o que nela existe» (Dt 10, 14). Por isso, Deus proíbe-nos toda a pretensão de posse absoluta: «Nenhuma terra será vendida definitivamente, porque a terra pertence-Me, e vós sois apenas estrangeiros e meus hóspedes» (Lv 25, 23)."}, {"n": 68, "t": "Esta responsabilidade perante uma terra que é de Deus implica que o ser humano, dotado de inteligência, respeite as leis da natureza e os delicados equilíbrios entre os seres deste mundo, porque «Ele deu uma ordem e tudo foi criado; Ele fixou tudo pelos séculos sem fim e estabeleceu leis a que não se pode fugir!» (Sl 148, 5b-6). Consequentemente, a legislação bíblica detém-se a propor ao ser humano várias normas relativas não só às outras pessoas, mas também aos restantes seres vivos: «Se vires o jumento do teu irmão ou o seu boi caídos no caminho, não te desvies deles, mas ajuda-os a levantarem-se. (...) Se encontrares no caminho, em cima de uma árvore ou no chão, um ninho de pássaros com filhotes, ou ovos cobertos pela mãe, não apanharás a mãe com a ninhada» (Dt 22, 4.6). Nesta linha, o descanso do sétimo dia não é proposto só para o ser humano, mas «para que descansem o teu boi e o teu jumento» (Ex 23, 12). Assim nos damos conta de que a Bíblia não dá lugar a um antropocentrismo despótico, que se desinteressa das outras criaturas."}, {"n": 69, "t": "Ao mesmo tempo que podemos fazer um uso responsável das coisas, somos chamados a reconhecer que os outros seres vivos têm um valor próprio diante de Deus e, «pelo simples facto de existirem, eles O bendizem e Lhe dão glória»[41], porque «o Senhor Se alegra em suas obras» (Sl 104/103, 31). Precisamente pela sua dignidade única e por ser dotado de inteligência, o ser humano é chamado a respeitar a criação com as suas leis internas, já que «o Senhor fundou a terra com sabedoria» (Pr 3, 19). Hoje, a Igreja não diz, de forma simplicista, que as outras criaturas estão totalmente subordinadas ao bem do ser humano, como se não tivessem um valor em si mesmas e fosse possível dispor delas à nossa vontade; mas ensina - como fizeram os bispos da Alemanha - que, nas outras criaturas, «se poderia falar da prioridade do ser sobre o ser úteis».[42] O Catecismo põe em questão, de forma muito directa e insistente, um antropocentrismo desordenado: «Cada criatura possui a sua bondade e perfeição próprias. (...) As diferentes criaturas, queridas pelo seu próprio ser, reflectem, cada qual a seu modo, uma centelha da sabedoria e da bondade infinitas de Deus. É por isso que o homem deve respeitar a bondade própria de cada criatura, para evitar o uso desordenado das coisas».[43]"}, {"n": 70, "t": "Na narração de Caim e Abel, vemos que a inveja levou Caim a cometer a injustiça extrema contra o seu irmão. Isto, por sua vez, provocou uma ruptura da relação entre Caim e Deus e entre Caim e a terra, da qual foi exilado. Esta passagem aparece sintetizada no dramático colóquio de Deus com Caim. Deus pergunta: «Onde está o teu irmão Abel?» Caim responde que não sabe, e Deus insiste com ele: «Que fizeste? A voz do sangue do teu irmão clama da terra até Mim. De futuro, serás amaldiçoado pela terra (...). Serás vagabundo e fugitivo sobre a terra» (Gn 4, 9-12). O descuido no compromisso de cultivar e manter um correcto relacionamento com o próximo, relativamente a quem sou devedor da minha solicitude e custódia, destrói o relacionamento interior comigo mesmo, com os outros, com Deus e com a terra. Quando todas estas relações são negligenciadas, quando a justiça deixa de habitar na terra, a Bíblia diz-nos que toda a vida está em perigo. Assim no-lo ensina a narração de Noé, quando Deus ameaça acabar com a humanidade pela sua persistente incapacidade de viver à altura das exigências da justiça e da paz: «O fim de toda a humanidade chegou diante de Mim, pois ela encheu a terra de violência» (Gn 6, 13). Nestas narrações tão antigas, ricas de profundo simbolismo, já estava contida a convicção actual de que tudo está inter-relacionado e o cuidado autêntico da nossa própria vida e das nossas relações com a natureza é inseparável da fraternidade, da justiça e da fidelidade aos outros."}, {"n": 71, "t": "Embora Deus reconhecesse que «a maldade dos homens era grande na terra» (Gn 6, 5), «arrependendo-Se de ter criado o homem sobre a terra» (Gn 6, 6), Ele decidiu abrir um caminho de salvação através de Noé, que ainda se mantinha íntegro e justo. Assim deu à humanidade a possibilidade de um novo início. Basta um homem bom para haver esperança! A tradição bíblica estabelece claramente que esta reabilitação implica a redescoberta e o respeito dos ritmos inscritos na natureza pela mão do Criador. Isto está patente, por exemplo, na lei do Shabbath. No sétimo dia, Deus descansou de todas as suas obras. Deus ordenou a Israel que cada sétimo dia devia ser celebrado como um dia de descanso, um Shabbath (cf. Gn 2, 2-3; Ex 16, 23; 20, 10). Além disso, de sete em sete anos, instaurou-se também um ano sabático para Israel e a sua terra (cf. Lv 25, 1-4), durante o qual se dava descanso completo à terra, não se semeava e só se colhia o indispensável para sobreviver e oferecer hospitalidade (cf. Lv 25, 4-6). Por fim, passadas sete semanas de anos, ou seja quarenta e nove anos, celebrava-se o jubileu, um ano de perdão universal, «proclamando na vossa terra a liberdade de todos os que a habitam» (Lv 25, 10). O desenvolvimento desta legislação procurou assegurar o equilíbrio e a equidade nas relações do ser humano com os outros e com a terra onde vivia e trabalhava. Mas, ao mesmo tempo, era um reconhecimento de que a dádiva da terra com os seus frutos pertence a todo o povo. Aqueles que cultivavam e guardavam o território deviam partilhar os seus frutos, especialmente com os pobres, as viúvas, os órfãos e os estrangeiros: «Quando procederes à ceifa das vossas terras, não ceifarás as espigas até à extremidade do campo, e não apanharás as espigas caídas. Não rebuscarás também a tua vinha, e não apanharás os bagos caídos. Deixá-los-ás para o pobre e para o estrangeiro» (Lv 19, 9-10)."}, {"n": 72, "t": "Os Salmos convidam, frequentemente, o ser humano a louvar a Deus criador: «Estendeu a terra sobre as águas, porque o seu amor é eterno» (Sl 136/135, 6). E convidam também as outras criaturas a louvá-Lo: «Louvai-O, sol e lua; louvai-O, estrelas luminosas! Louvai-O, alturas dos céus e águas que estais acima dos céus! Louvem todos o nome do Senhor, porque Ele deu uma ordem e tudo foi criado» (Sl 148, 3-5). Existimos não só pelo poder de Deus, mas também na sua presença e companhia. Por isso O adoramos."}, {"n": 73, "t": "Os escritos dos profetas convidam a recuperar forças, nos momentos difíceis, contemplando a Deus poderoso que criou o universo. O poder infinito de Deus não nos leva a escapar da sua ternura paterna, porque n'Ele se conjugam o carinho e a força. Na verdade, toda a sã espiritualidade implica simultaneamente acolher o amor divino e adorar, com confiança, o Senhor pelo seu poder infinito. Na Bíblia, o Deus que liberta e salva é o mesmo que criou o universo, e estes dois modos de agir divino estão íntima e inseparavelmente ligados: «Ah! Senhor Deus, foste Tu que fizeste o céu e a terra com o teu grande poder e o teu braço estendido! Para Ti, nada é impossível! (...) Tu fizeste sair do Egipto o teu povo, Israel, com prodígios e milagres» (Jr 32, 17.21). «O Senhor é um Deus eterno, que criou os confins da terra. Não se cansa nem perde as forças. É insondável a sua sabedoria. Ele dá forças ao cansado e enche de vigor o fraco» (Is 40, 28b-29)."}, {"n": 74, "t": "A experiência do cativeiro em Babilónia gerou uma crise espiritual que levou a um aprofundamento da fé em Deus, explicitando a sua omnipotência criadora, para animar O povo a recuperar a esperança no meio da sua situação infeliz. Séculos mais tarde, noutro momento de prova e perseguição, quando o Império Romano procurou impor um domínio absoluto, os fiéis voltaram a encontrar consolação e esperança aumentando a sua confiança em Deus omnipotente, e cantavam: «Grandes e admiráveis são as tuas obras, Senhor Deus todo-poderoso! Justos e verdadeiros são os teus caminhos!» (Ap 15, 3). Se Deus pôde criar o universo a partir do nada, também pode intervir neste mundo e vencer qualquer forma de mal. Por isso, a injustiça não é invencível."}, {"n": 75, "t": "Não podemos defender uma espiritualidade que esqueça Deus todo-poderoso e criador. Neste caso, acabaríamos por adorar outros poderes do mundo, ou colocar-nos-íamos no lugar do Senhor chegando à pretensão de espezinhar sem limites a realidade criada por Ele. A melhor maneira de colocar o ser humano no seu lugar e acabar com a sua pretensão de ser dominador absoluto da terra, é voltar a propor a figura de um Pai criador e único dono do mundo; caso contrário, o ser humano tenderá sempre a querer impor à realidade as suas próprias leis e interesses."}, {"h": "3. O mistério do universo", "lvl": 1}, {"n": 76, "t": "Na tradição judaico-cristã, dizer «criação» é mais do que dizer natureza, porque tem a ver com um projecto do amor de Deus, onde cada criatura tem um valor e um significado. A natureza entende-se habitualmente como um sistema que se analisa, compreende e gere, mas a criação só se pode conceber como um dom que vem das mãos abertas do Pai de todos, como uma realidade iluminada pelo amor que nos chama a uma comunhão universal."}, {"n": 77, "t": "«A palavra do Senhor criou os céus» (Sl 33/32, 6). Deste modo indica-se que o mundo procede, não do caos nem do acaso, mas duma decisão, o que o exalta ainda mais. Há uma opção livre, expressa na palavra criadora. O universo não apareceu como resultado duma omnipotência arbitrária, duma demonstração de força ou dum desejo de auto-afirmação. A criação pertence à ordem do amor. O amor de Deus é a razão fundamental de toda a criação: «Tu amas tudo quanto existe e não detestas nada do que fizeste; pois, se odiasses alguma coisa, não a terias criado» (Sab 11, 24). Então cada criatura é objecto da ternura do Pai que lhe atribui um lugar no mundo. Até a vida efémera do ser mais insignificante é objecto do seu amor e, naqueles poucos segundos de existência, Ele envolve-o com o seu carinho. Dizia São Basílio Magno que o Criador é também «a bondade sem cálculos»,[44] e Dante Alighieri falava do «amor que move o sol e as outras estrelas».[45] Por isso, das obras criadas pode-se subir «à sua amorosa misericórdia».[46]"}, {"n": 78, "t": "Ao mesmo tempo, o pensamento judaico-cristão desmitificou a natureza. Sem deixar de a admirar pelo seu esplendor e imensidão, já não lhe atribui um carácter divino. Deste modo, ressalta ainda mais o nosso compromisso para com ela. Um regresso à natureza não pode ser feito à custa da liberdade e da responsabilidade do ser humano, que é parte do mundo com o dever de cultivar as próprias capacidades para o proteger e desenvolver as suas potencialidades. Se reconhecermos o valor e a fragilidade da natureza e, ao mesmo tempo, as capacidades que o Criador nos deu, isto permite-nos acabar hoje com o mito moderno do progresso material ilimitado. Um mundo frágil, com um ser humano a quem Deus confia o cuidado do mesmo, interpela a nossa inteligência para reconhecer como deveremos orientar, cultivar e limitar o nosso poder."}, {"n": 79, "t": "Neste universo, composto por sistemas abertos que entram em comunicação uns com os outros, podemos descobrir inumeráveis formas de relação e participação. Isto leva-nos também a pensar o todo como aberto à transcendência de Deus, dentro da qual se desenvolve. A fé permite-nos interpretar o significado e a beleza misteriosa do que acontece. A liberdade humana pode prestar a sua contribuição inteligente para uma evolução positiva, como pode também acrescentar novos males, novas causas de sofrimento e verdadeiros atrasos. Isto dá lugar à apaixonante e dramática história humana, capaz de transformar-se num desabrochamento de libertação, engrandecimento, salvação e amor, ou, pelo contrário, num percurso de declínio e mútua destruição. Por isso a Igreja, com a sua acção, procura não só lembrar o dever de cuidar da natureza, mas também e «sobretudo proteger o homem da destruição de si mesmo».[47]"}, {"n": 80, "t": "Apesar disso, Deus, que deseja actuar connosco e contar com a nossa cooperação, é capaz também de tirar algo de bom dos males que praticamos, porque «o Espírito Santo possui uma inventiva infinita, própria da mente divina, que sabe prover a desfazer os nós das vicissitudes humanas mais complexas e impenetráveis».[48] De certa maneira, quis limitar-Se a Si mesmo, criando um mundo necessitado de desenvolvimento, onde muitas coisas que consideramos males, perigos ou fontes de sofrimento, na realidade fazem parte das dores de parto que nos estimulam a colaborar com o Criador.[49] Ele está presente no mais íntimo de cada coisa sem condicionar a autonomia da sua criatura, e isto dá lugar também à legítima autonomia das realidades terrenas.[50] Esta presença divina, que garante a permanência e o desenvolvimento de cada ser, «é a continuação da acção criadora».[51] O Espírito de Deus encheu o universo de potencialidades que permitem que, do próprio seio das coisas, possa brotar sempre algo de novo: «A natureza nada mais é do que a razão de certa arte — concretamente a arte divina —- inscrita nas coisas, pela qual as próprias coisas se movem para um fim determinado. Como se o mestre construtor de navios pudesse conceder à madeira a possibilidade de se mover a si mesma para tomar a forma da nave».[52]"}, {"n": 81, "t": "Embora suponha também processos evolutivos, o ser humano implica uma novidade que não se explica cabalmente pela evolução doutros sistemas abertos. Cada um de nós tem em si uma identidade pessoal, capaz de entrar em diálogo com os outros e com o próprio Deus. A capacidade de reflexão, o raciocínio, a criatividade, a interpretação, a elaboração artística e outras capacidades originais manifestam uma singularidade que transcende o âmbito físico e biológico. A novidade qualitativa, implicada no aparecimento dum ser pessoal dentro do universo material, pressupõe uma acção directa de Deus, uma chamada peculiar à vida e à relação de um Tu com outro tu. A partir dos textos bíblicos, consideramos o ser humano como sujeito, que nunca pode ser reduzido à categoria de objecto."}, {"n": 82, "t": "Mas seria errado também pensar que os outros seres vivos devam ser considerados como meros objectos submetidos ao domínio arbitrário do ser humano. Quando se propõe uma visão da natureza unicamente como objecto de lucro e interesse, isso comporta graves consequências também para a sociedade. A visão que consolida o arbítrio do mais forte favoreceu imensas desigualdades, injustiças e violências para a maior parte da humanidade, porque os recursos tornam-se propriedade do primeiro que chega ou de quem tem mais poder: o vencedor leva tudo. O ideal de harmonia, justiça, fraternidade e paz que Jesus propõe situa-se nos antípodas de tal modelo, como Ele mesmo Se expressou ao compará-lo com os poderes do seu tempo: «Sabeis que os chefes das nações as governam como seus senhores, e que os grandes exercem sobre elas o seu poder. Não seja assim entre vós. Pelo contrário, quem entre vós quiser fazer-se grande, seja o vosso servo» (Mt 20, 25-26)."}, {"n": 83, "t": "A meta do caminho do universo situa-se na plenitude de Deus, que já foi alcançada por Cristo ressuscitado, fulcro da maturação universal.[53] E assim juntamos mais um argumento para rejeitar todo e qualquer domínio despótico e irresponsável do ser humano sobre as outras criaturas. O fim último das restantes criaturas não somos nós. Mas todas avançam, juntamente connosco e através de nós, para a meta comum, que é Deus, numa plenitude transcendente onde Cristo ressuscitado tudo abraça e ilumina. Com efeito, o ser humano, dotado de inteligência e amor e atraído pela plenitude de Cristo, é chamado a reconduzir todas as criaturas ao seu Criador."}, {"h": "4. A mensagem de cada criatura na harmonia de toda a criação", "lvl": 1}, {"n": 84, "t": "O facto de insistir na afirmação de que o ser humano é imagem de Deus não deveria fazer-nos esquecer que cada criatura tem uma função e nenhuma é supérflua. Todo o universo material é uma linguagem do amor de Deus, do seu carinho sem medida por nós. O solo, a água, as montanhas: tudo é carícia de Deus. A história da própria amizade com Deus desenrola-se sempre num espaço geográfico que se torna um sinal muito pessoal, e cada um de nós guarda na memória lugares cuja lembrança nos faz muito bem. Quem cresceu no meio de montes, quem na infância se sentava junto do riacho a beber, ou quem jogava numa praça do seu bairro, quando volta a esses lugares sente-se chamado a recuperar a sua própria identidade."}, {"n": 85, "t": "Deus escreveu um livro estupendo, «cujas letras são representadas pela multidão de criaturas presentes no universo».[54] E justamente afirmaram os bispos do Canadá que nenhuma criatura fica fora desta manifestação de Deus: «Desde os panoramas mais amplos às formas de vida mais frágeis, a natureza é um manancial incessante de encanto e reverência. Trata-se duma contínua revelação do divino».[55] Os bispos do Japão, por sua vez, disseram algo muito sugestivo: «Sentir cada criatura que canta o hino da sua existência é viver jubilosamente no amor de Deus e na esperança».[56] Esta contemplação da criação permite-nos descobrir qualquer ensinamento que Deus nos quer transmitir através de cada coisa, porque, «para o crente, contemplar a criação significa também escutar uma mensagem, ouvir uma voz paradoxal e silenciosa».[57] Podemos afirmar que, «ao lado da revelação propriamente dita, contida nas Sagradas Escrituras, há uma manifestação divina no despontar do sol e no cair da noite».[58] Prestando atenção a esta manifestação, o ser humano aprende a reconhecer-se a si mesmo na relação com as outras criaturas: «Eu expresso-me exprimindo o mundo; exploro a minha sacralidade decifrando a do mundo».[59]"}, {"n": 86, "t": "O conjunto do universo, com as suas múltiplas relações, mostra melhor a riqueza inesgotável de Deus. São Tomás de Aquino sublinhava, sabiamente, que a multiplicidade e a variedade «provêm da intenção do primeiro agente», o Qual quis que «o que falta a cada coisa, para representar a bondade divina, seja suprido pelas outras»,[60] pois a sua bondade «não pode ser convenientemente representada por uma só criatura».[61] Por isso, precisamos de individuar a variedade das coisas nas suas múltiplas relações.[62] Assim, compreende-se melhor a importância e o significado de qualquer criatura, se a contemplarmos no conjunto do plano de Deus. Tal é o ensinamento do Catecismo: «A interdependência das criaturas é querida por Deus. O sole a lua, o cedro e a florzinha, a águia e o pardal: o espectáculo das suas incontáveis diversidades e desigualdades significa que nenhuma criatura se basta a si mesma. Elas só existem na dependência umas das outras, para se completarem mutuamente no serviço umas das outras».[63]"}, {"n": 87, "t": "Quando nos damos conta do reflexo de Deus em tudo o que existe, o coração experimenta o desejo de adorar o Senhor por todas as suas criaturas e juntamente com elas, como se vê neste gracioso cântico de São Francisco de Assis: «Louvado sejas, meu Senhor, com todas as tuas criaturas, especialmente o meu senhor irmão sol, o qual faz o dia e por ele nos alumia. E ele é belo e radiante com grande esplendor: de Ti, Altíssimo, nos dá ele a imagem. Louvado sejas, meu Senhor, pela irmã lua e pelas estrelas, que no céu formaste claras, preciosas e belas. Louvado sejas, meu Senhor, pelo irmão vento pelo ar, pela nuvem, pelo sereno, e todo o tempo, com o qual, às tuas criaturas, dás o sustento. Louvado sejas, meu Senhor, pela irmã água, que é tão útil e humilde, e preciosa e casta. Louvado sejas, meu Senhor, pelo irmão fogo, pelo qual iluminas a noite: ele é belo e alegre, vigoroso e forte».[64]"}, {"n": 88, "t": "Os bispos do Brasil sublinharam que toda a natureza, além de manifestar Deus, é lugar da sua presença. Em cada criatura, habita o seu Espírito vivificante, que nos chama a um relacionamento com Ele.[65] A descoberta desta presença estimula em nós o desenvolvimento das «virtudes ecológicas».[66] Mas, quando dizemos isto, não esqueçamos que há também uma distância infinita, pois as coisas deste mundo não possuem a plenitude de Deus. Esquecê-lo, aliás, também não faria bem às criaturas, porque não reconheceríamos o seu lugar verdadeiro e próprio, acabando por lhes exigir indevidamente aquilo que, na sua pequenez, não nos podem dar."}, {"h": "5. Uma comunhão universal", "lvl": 1}, {"n": 89, "t": "As criaturas deste mundo não podem ser consideradas um bem sem dono: «Todas são tuas, ó Senhor, que amas a vida» (Sab 11, 26). Isto gera a convicção de que nós e todos os seres do universo, sendo criados pelo mesmo Pai, estamos unidos por laços invisíveis e formamos uma espécie de família universal, uma comunhão sublime que nos impele a um respeito sagrado, amoroso e humilde. Quero lembrar que «Deus uniu-nos tão estreitamente ao mundo que nos rodeia, que a desertificação do solo é como uma doença para cada um, e podemos lamentar a extinção de uma espécie como se fosse uma mutilação».[67]"}, {"n": 90, "t": "Isto não significa igualar todos os seres vivos e tirar ao ser humano aquele seu valor peculiar que, simultaneamente, implica uma tremenda responsabilidade. Também não requer uma divinização da terra, que nos privaria da nossa vocação de colaborar com ela e proteger a sua fragilidade. Estas concepções acabariam por criar novos desequilíbrios, na tentativa de fugir da realidade que nos interpela.[68] Às vezes nota-se a obsessão de negar qualquer preeminência à pessoa humana, conduzindo-se uma luta em prol das outras espécies que não se vê na hora de defender igual dignidade entre os seres humanos. Devemos, certamente, ter a preocupação de que os outros seres vivos não sejam tratados de forma irresponsável, mas deveriam indignar-nos sobretudo as enormes desigualdades que existem entre nós, porque continuamos a tolerar que alguns se considerem mais dignos do que outros. Deixamos de notar que alguns se arrastam numa miséria degradante, sem possibilidades reais de melhoria, enquanto outros não sabem sequer que fazer ao que têm, ostentam vaidosamente uma suposta superioridade e deixam atrás de si um nível de desperdício tal que seria impossível generalizar sem destruir o planeta. Na prática, continuamos a admitir que alguns se sintam mais humanos que outros, como se tivessem nascido com maiores direitos."}, {"n": 91, "t": "Não pode ser autêntico um sentimento de união íntima com os outros seres da natureza, se ao mesmo tempo não houver no coração ternura, compaixão e preocupação pelos seres humanos. É evidente a incoerência de quem luta contra o tráfico de animais em risco de extinção, mas fica completamente indiferente perante o tráfico de pessoas, desinteressa-se dos pobres ou procura destruir outro ser humano de que não gosta. Isto compromete o sentido da luta pelo meio ambiente. Não é por acaso que São Francisco, no cântico onde louva a Deus pelas criaturas, acrescenta o seguinte: «Louvado sejas, meu Senhor, por aqueles que perdoam por teu amor». Tudo está interligado. Por isso, exige-se uma preocupação pelo meio ambiente, unida ao amor sincero pelos seres humanos e a um compromisso constante com os problemas da sociedade."}, {"n": 92, "t": "Além disso, quando o coração está verdadeiramente aberto a uma comunhão universal, nada e ninguém fica excluído desta fraternidade. Portanto, é verdade também que a indiferença ou a crueldade com as outras criaturas deste mundo sempre acabam de alguma forma por repercutir-se no tratamento que reservamos aos outros seres humanos. O coração é um só, e a própria miséria que leva a maltratar um animal não tarda a manifestar-se na relação com as outras pessoas. Todo o encarniçamento contra qualquer criatura «é contrário à dignidade humana».[69] Não podemos considerar-nos grandes amantes da realidade, se excluímos dos nossos interesses alguma parte dela: «Paz, justiça e conservação da criação são três questões absolutamente ligadas, que não se poderão separar, tratando-as individualmente sob pena de cair novamente no reducionismo».[70] Tudo está relacionado, e todos nós, seres humanos, caminhamos juntos como irmãos e irmãs numa peregrinação maravilhosa, entrelaçados pelo amor que Deus tem a cada uma das suas criaturas e que nos une também, com terna afeição, ao irmão sol, à irmã lua, ao irmão rio e à mãe terra."}, {"h": "6. O destino comum dos bens", "lvl": 1}, {"n": 93, "t": "Hoje, crentes e não-crentes estão de acordo que a terra é, essencialmente, uma herança comum, cujos frutos devem beneficiar a todos. Para os crentes, isto torna-se uma questão de fidelidade ao Criador, porque Deus criou o mundo para todos. Por conseguinte, toda a abordagem ecológica deve integrar uma perspectiva social que tenha em conta os direitos fundamentais dos mais desfavorecidos. O princípio da subordinação da propriedade privada ao destino universal dos bens e, consequentemente, o direito universal ao seu uso é uma «regra de ouro» do comportamento social e o «primeiro princípio de toda a ordem ético-social».[71] A tradição cristã nunca reconheceu como absoluto ou intocável o direito à propriedade privada, e salientou a função social de qualquer forma de propriedade privada. São João Paulo II lembrou esta doutrina, com grande ênfase, dizendo que «Deus deu a terra a todo o género humano, para que ela sustente todos os seus membros, sem excluir nem privilegiar ninguém».[72] São palavras densas e fortes. Insistiu que «não seria verdadeiramente digno do homem, um tipo de desenvolvimento que não respeitasse e promovesse os direitos humanos, pessoais e sociais, económicos e políticos, incluindo os direitos das nações e dos povos».[73] Com grande clareza, explicou que «a Igreja defende, sim, o legítimo direito à propriedade privada, mas ensina, com não menor clareza, que sobre toda a propriedade particular pesa sempre uma hipoteca social, para que os bens sirvam ao destino geral que Deus lhes deu».[74] Por isso, afirma que «não é segundo o desígnio de Deus gerir este dom de modo tal que os seus benefícios aproveitem só a alguns poucos».[75] Isto põe seriamente em discussão os hábitos injustos duma parte da humanidade.[76]"}, {"n": 94, "t": "O rico e o pobre têm igual dignidade, porque «quem os fez a ambos foi o Senhor» (Pr 22, 2); «Ele criou o pequeno e o grande» (Sab 6, 7) e «faz com que o sol se levante sobre os bons e os maus» (Mt 5, 45). Isto tem consequências práticas, como explicitaram os bispos do Paraguai: «Cada camponês tem direito natural de possuir um lote razoável de terra, onde possa estabelecer o seu lar, trabalhar para a subsistência da sua família e gozar de segurança existencial. Este direito deve ser de tal forma garantido, que o seu exercício não seja ilusório mas real. Isto significa que, além do título de propriedade, o camponês deve contar com meios de formação técnica, empréstimos, seguros e acesso ao mercado».[77]"}, {"n": 95, "t": "O meio ambiente é um bem colectivo, património de toda a humanidade e responsabilidade de todos. Quem possui uma parte é apenas para a administrar em benefício de todos. Se não o fizermos, carregamos na consciência o peso de negar a existência aos outros. Por isso, os bispos da Nova Zelândia perguntavam-se que significado possa ter o mandamento «não matarás», quando «uns vinte por cento da população mundial consomem recursos numa medida tal que roubam às nações pobres, e às gerações futuras, aquilo de que necessitam para sobreviver».[78]"}, {"h": "7. O olhar de Jesus", "lvl": 1}, {"n": 96, "t": "Jesus retoma a fé bíblica no Deus criador e destaca um dado fundamental: Deus é Pai (cf. Mt 11, 25). Em colóquio com os seus discípulos, Jesus convidava-os a reconhecer a relação paterna que Deus tem com todas as criaturas e recordava-lhes, com comovente ternura, como cada uma delas era importante aos olhos d'Ele: «Não se vendem cinco pássaros por duas pequeninas moedas? Contudo, nenhum deles passa despercebido diante de Deus» (Lc 12, 6). «Olhai as aves do céu: não semeiam nem ceifam nem recolhem em celeiros; e o vosso Pai celeste alimenta-as» (Mt 6, 26)."}, {"n": 97, "t": "O Senhor podia convidar os outros a estar atentos à beleza que existe no mundo, porque Ele próprio vivia em contacto permanente com a natureza e prestava-lhe uma atenção cheia de carinho e admiração. Quando percorria os quatro cantos da sua terra, detinha-Se a contemplar a beleza semeada por seu Pai e convidava os discípulos a individuarem, nas coisas, uma mensagem divina: «Levantai os olhos e vede os campos que estão doirados para a ceifa» (Jo 4, 35). «O Reino dos Céus é semelhante a um grão de mostarda que um homem tomou e semeou no seu campo. É a menor de todas as sementes; mas, depois de crescer, torna-se a maior planta do horto e transforma-se numa árvore» (Mt 13, 31-32)."}, {"n": 98, "t": "Jesus vivia em plena harmonia com a criação, com grande maravilha dos outros: «Quem é este, a quem até o vento e o mar obedecem?» (Mt 8, 27). Não Se apresentava como um asceta separado do mundo ou inimigo das coisas aprazíveis da vida. Falando de Si mesmo, declarou: «Veio o Filho do Homem que come e bebe, e dizem: “Aí está um glutão e bebedor de vinho”» (Mt 11, 19). Encontrava-Se longe das filosofias que desprezavam o corpo, a matéria e as realidades deste mundo. Todavia, ao longo da história, estes dualismos combalidos tiveram notável influência nalguns pensadores cristãos e desfiguraram o Evangelho. Jesus trabalhava com suas mãos, entrando diariamente em contacto com matéria criada por Deus para a moldar com a sua capacidade de artesão. É digno de nota que a maior parte da sua existência terrena tenha sido consagrada a esta tarefa, levando uma vida simples que não despertava maravilha alguma: «Não é Ele o carpinteiro, o filho de Maria?» (Mc 6, 3). Assim santificou o trabalho, atribuindo-lhe um valor peculiar para o nosso amadurecimento. São João Paulo II ensinava que, «suportando o que há de penoso no trabalho em união com Cristo crucificado por nós, o homem colabora, de alguma forma, com o Filho de Deus na redenção da humanidade».[79]"}, {"n": 99, "t": "Segundo a compreensão cristã da realidade, o destino da criação inteira passa pelo mistério de Cristo, que nela está presente desde a origem: «Todas as coisas foram criadas por Ele e para Ele» (Cl 1, 16).[80] O prólogo do Evangelho de João (1, 1-18) mostra a actividade criadora de Cristo como Palavra divina (Logos). Mas o mesmo prólogo surpreende ao afirmar que esta Palavra «Se fez carne» (Jo 1, 14). Uma Pessoa da Santíssima Trindade inseriu-Se no universo criado, partilhando a própria sorte com ele até à cruz. Desde o início do mundo, mas de modo peculiar a partir da encarnação, o mistério de Cristo opera veladamente no conjunto da realidade natural, sem com isso afectar a sua autonomia."}, {"n": 100, "t": "O Novo Testamento não nos fala só de Jesus terreno e da sua relação tão concreta e amorosa com o mundo; mostra-no-Lo também como ressuscitado e glorioso, presente em toda a criação com o seu domínio universal. «Foi n'Ele que aprouve a Deus fazer habitar toda a plenitude e, por Ele e para Ele, reconciliar todas as coisas (...), tanto as que estão na terra como as que estão no céu» (Cl 1, 19-20). Isto lança-nos para o fim dos tempos, quando o Filho entregar ao Pai todas as coisas «a fim de que Deus seja tudo em todos» (1 Cor 15, 28). Assim, as criaturas deste mundo já não nos aparecem como uma realidade meramente natural, porque o Ressuscitado as envolve misteriosamente e guia para um destino de plenitude. As próprias flores do campo e as aves que Ele, admirado, contemplou com os seus olhos humanos, agora estão cheias da sua presença luminosa."}]}, {"id": "c3", "title": "Capítulo III", "sub": "A raiz humana da crise ecológica", "short": "III", "items": [{"n": 101, "t": "Para nada serviria descrever os sintomas, se não reconhecêssemos a raiz humana da crise ecológica. Há um modo desordenado de conceber a vida e a acção do ser humano, que contradiz a realidade até ao ponto de a arruinar. Não poderemos deter-nos a pensar nisto mesmo? Proponho, pois, que nos concentremos no paradigma tecnocrático dominante e no lugar que ocupa nele o ser humano e a sua acção no mundo."}, {"h": "1. A tecnologia: criatividade e poder", "lvl": 1}, {"n": 102, "t": "A humanidade entrou numa nova era, em que o poder da tecnologia nos põe diante duma encruzilhada. Somos herdeiros de dois séculos de ondas enormes de mudanças: a máquina a vapor, a ferrovia, o telégrafo, a electricidade, o automóvel, o avião, as indústrias químicas, a medicina moderna, a informática e, mais recentemente, a revolução digital, a robótica, as biotecnologias e as nanotecnologias. É justo que nos alegremos com estes progressos e nos entusiasmemos à vista das amplas possibilidades que nos abrem estas novidades incessantes, porque «a ciência e a tecnologia são um produto estupendo da criatividade humana que Deus nos deu».[81] A transformação da natureza para fins úteis é uma característica do género humano, desde os seus primórdios; e assim a técnica «exprime a tensão do ânimo humano para uma gradual superação de certos condicionamentos materiais».[82] A tecnologia deu remédio a inúmeros males, que afligiam e limitavam o ser humano. Não podemos deixar de apreciar e agradecer os progressos alcançados especialmente na medicina, engenharia e comunicações. Como não havemos de reconhecer todos os esforços de tantos cientistas e técnicos que elaboraram alternativas para um desenvolvimento sustentável?"}, {"n": 103, "t": "A tecnociência, bem orientada, pode produzir coisas realmente valiosas para melhorar a qualidade de vida do ser humano, desde os objectos de uso doméstico até aos grandes meios de transporte, pontes, edifícios, espaços públicos. É capaz também de produzir coisas belas e fazer o ser humano, imerso no mundo material, dar o «salto» para o âmbito da beleza. Poder-se-á negar a beleza de um avião ou de alguns arranha-céus? Há obras pictóricas e musicais de valor, obtidas com o recurso aos novos instrumentos técnicos. Assim, no desejo de beleza do artífice e em quem contempla esta beleza dá-se o salto para uma certa plenitude propriamente humana."}, {"n": 104, "t": "Não podemos, porém, ignorar que a energia nuclear, a biotecnologia, a informática, o conhecimento do nosso próprio DNA e outras potencialidades que adquirimos, nos dão um poder tremendo. Ou melhor: dão, àqueles que detêm o conhecimento e sobretudo o poder económico para o desfrutar, um domínio impressionante sobre o conjunto do género humano e do mundo inteiro. Nunca a humanidade teve tanto poder sobre si mesma, e nada garante que o utilizará bem, sobretudo se se considera a maneira como o está a fazer. Basta lembrar as bombas atómicas lançadas em pleno século XX, bem como a grande exibição de tecnologia ostentada pelo nazismo, o comunismo e outros regimes totalitários e que serviu para o extermínio de milhões de pessoas, sem esquecer que hoje a guerra dispõe de instrumentos cada vez mais mortíferos. Nas mãos de quem está e pode chegar a estar tanto poder? É tremendamente arriscado que resida numa pequena parte da humanidade."}, {"n": 105, "t": "Tende-se a crer que «toda a aquisição de poder seja simplesmente progresso, aumento de segurança, de utilidade, de bem-estar, de força vital, de plenitude de valores»[83], como se a realidade, o bem e a verdade desabrochassem espontaneamente do próprio poder da tecnologia e da economia. A verdade é que «o homem moderno não foi educado para o recto uso do poder»,[84] porque o imenso crescimento tecnológico não foi acompanhado por um desenvolvimento do ser humano quanto à responsabilidade, aos valores, à consciência. Cada época tende a desenvolver uma reduzida autoconsciência dos próprios limites. Por isso, é possível que hoje a humanidade não se dê conta da seriedade dos desafios que se lhe apresentam, e «cresce continuamente a possibilidade de o homem fazer mau uso do seu poder» quando «não existem normas de liberdade, mas apenas pretensas necessidades de utilidade e segurança».[85] O ser humano não é plenamente autónomo. A sua liberdade adoece, quando se entrega às forças cegas do inconsciente, das necessidades imediatas, do egoísmo, da violência brutal. Neste sentido, ele está nu e exposto frente ao seu próprio poder que continua a crescer, sem ter os instrumentos para o controlar. Talvez disponha de mecanismos superficiais, mas podemos afirmar que carece de uma ética sólida, uma cultura e uma espiritualidade qu
